[dependencies]
# CLI
clap = { version = "4.5.60", features = ["derive", "env", "string"] }
clap_complete = "4.5.66"

# Async runtime
asupersync = { version = "0.4.4", default-features = false, features = ["tls-webpki-roots", "test-internals"] }
futures = "0.3"
async-trait = "0.1"

# URL reads (bd-cv653.2.2): HTML reader-mode conversion + PDF text extraction
# htmd is lean and always on; pdf-extract adds ~6 MiB so it is opt-in
# (release binary size budget, 22 MiB). `full` includes it.
htmd = "0.5.5"
pdf-extract = { version = "0.12", optional = true }

# URL parsing/building
url = "2"

# Signals
ctrlc = "3.5.2"

# PTY allocation for isatty-requiring bash commands (bd-cv653.1.7)
portable-pty = "0.9"

# Serialization
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value"] }
json5 = "1.3.1"

# Error handling
anyhow = "1.0.104"
thiserror = "2"

# Terminal output (rich_rust for beautiful TUI).
# rich_rust is shared by non-TUI code paths (plain styled stdout/markdown
# rendering in src/tui.rs and elsewhere), so it stays unconditional.
rich_rust = { version = "0.2.2", features = ["markdown"] }
# crossterm is the low-level terminal driver used exclusively by the
# interactive front-end, so it is gated behind the `tui` feature.
crossterm = { version = "0.29", optional = true }
enable-ansi-support = "0.2"

# Interactive TUI (charmed_rust - bubbletea/lipgloss/bubbles/glamour).
# These are used exclusively by the interactive terminal front-end and are
# gated behind the `tui` feature so SDK/library consumers can build the lib
# with `--no-default-features` without pulling in the terminal stack.
bubbletea = { package = "charmed-bubbletea", version = "0.2.0", optional = true }
lipgloss = { package = "charmed-lipgloss", version = "0.2.0", optional = true }
bubbles = { package = "charmed-bubbles", version = "0.2.0", optional = true }
glamour = { package = "charmed-glamour", version = "0.2.0", optional = true }
# unicode-width / textwrap are TUI-layout helpers consumed only by the
# interactive render code, so they are gated with the rest of the TUI stack.
unicode-width = { version = "0.2", optional = true }
textwrap = { version = "0.16", optional = true }
arboard = { version = "3.6.1", optional = true }

# FrankenTUI migration target (bd-cv653.9.1). Coexists with the charmed_rust
# stack behind the default-OFF `ftui` feature while the interactive runtime is
# ported module by module; the bubbletea stack is deleted at cutover.
# crossterm backend for now (pi already ships crossterm via `tui`); the Unix
# native-backend (ftui-tty) switch is a later rollout step per the bead.
ftui = { version = "0.5", default-features = false, features = ["runtime", "crossterm"], optional = true }
# Markdown rendering for the ftui conversation view. Direct dep because the
# facade's `extras` feature enables no ftui-extras features (markdown stays
# off); default-features off keeps the heavy extras (charts, doom, ...) out.
ftui-extras = { version = "0.5", default-features = false, features = ["markdown"], optional = true }

# Filesystem
dirs = "6"
tempfile = "3.25.0"
fs4 = "1.1"
glob = "0.3"
ignore = "0.4"
globset = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
# Typed subagent results (bd-cv653.5.1): validate child yields against
# per-task output schemas.
jsonschema = { version = "0.42.0", default-features = false }
rustix = { version = "1.1.4", features = ["fs", "process"] }
crossbeam-queue = "0.3"
# default-features off: pi's session storage needs only the core engine.
# Effective since fsqlite 0.3.5 (frankensqlite#356): `native` no longer
# force-enables the extension vtabs, and serde_json's `preserve_order` no
# longer leaks into pi's dependency graph (bd-nhm45). Size note: the vtab
# decoupling reclaimed ~nothing (lto=true had already dead-stripped them);
# the 26 MiB budget (src/perf_build.rs BINARY_SIZE_RELEASE_BUDGET_MB) stands
# with darwin-arm64 release at 24.59 MiB (bd-2ohw2).
fsqlite = { version = "0.3.5", default-features = false, features = ["native", "fts5"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
uuid = { version = "1.21.0", features = ["v4"] }
memchr = "2.8.0"
base64 = "0.23"
flate2 = "1.1.9"
rustc-hash = "2.1"
sha2 = "0.11"
sha1 = "0.11"
md-5 = "0.11"
hmac = "0.13"
pbkdf2 = { version = "0.13.0", features = ["hmac"] }
scrypt = { version = "0.12.0", default-features = false }
getrandom = "0.4.1"
regex = "1.12.3"
ring = "0.17.14"
semver = "1.0.27"
crc32c = "0.6"
ast-grep-core = "0.40"
ast-grep-language = { version = "0.40", default-features = false, features = [
    "tree-sitter-bash",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-ruby",
    "tree-sitter-rust",
    "tree-sitter-go",
] }
unicode-normalization = "0.1"
xxhash-rust = { version = "0.8", features = ["xxh32"] }
similar = "2"
sysinfo = "0.39.6"
# BPE token counting tables (bd-cv653.7.2.1); enabled via the `bpe-tokens`
# feature.
tiktoken-rs = { version = "0.12.0", optional = true }
rquickjs = { version = "0.12.2", features = ["futures", "loader"] }
swc_common = "26.0.0"
swc_ecma_codegen = "32.0.0"
swc_ecma_ast = "29.0.0"
swc_ecma_parser = "45.0.0"
swc_ecma_transforms_base = "49.0.0"
swc_ecma_transforms_typescript = "55.0.0"
swc_ecma_visit = "29.0.0"
wasmtime = { version = "47.0.3", features = ["component-model"], optional = true }
filetime = "0.2.27"

# Image processing (optional). Formats limited to what the read tool
# actually decodes (jpg/png/gif/webp — see its schema docs) plus rayon for
# decode parallelism: the default-formats set would pull avif → ravif →
# rav1e → paste, adding two RUSTSEC inventory warnings (unmaintained
# `paste`, bd-kytip) and megabytes of AV1 encoder against the size budget.
image = { version = "0.25", optional = true, default-features = false, features = [
    "jpeg",
    "png",
    "gif",
    "webp",
    "rayon",
] }

[build-dependencies]
crc32c = "0.6.8"
flate2 = "1.1.9"
vergen-gix = { version = "9.1.0", features = ["build", "cargo", "rustc"] }

[dev-dependencies]
arbitrary = { version = "1", features = ["derive"] }
pretty_assertions = "1"
insta = { version = "1", features = ["filters"] }
tempfile = "3.25.0"
asupersync = { version = "0.4.4", default-features = false, features = ["test-internals"] }
criterion = { version = "0.8.2", features = ["html_reports"] }
jsonschema = { version = "0.42.0", default-features = false }
proptest = "1.10.0"
wat = "1.255.0"
toml = "1.0.3"
# Pinned to the reviewed upstream root-stack configurability change from
# tokio-rs/loom#412. Loom 0.7.2 hard-codes the model root coroutine to 4 KiB,
# which overflows before these hostcall models can begin exploring. The exact
# revision is immutable and remains test-only until upstream publishes it.
loom = { version = "0.7.2", git = "https://github.com/ongardie-atomix/loom", rev = "2b7c402034cc041b5e325384c67bb43bff93c048" }
signal-hook = "0.4.4"

[[bench]]
name = "tools"
harness = false

[[bench]]
name = "extensions"
harness = false

[[bench]]
name = "extension_budget_inputs"
harness = false

[[bench]]
name = "semantic_context"
harness = false

[[bench]]
name = "system"
harness = false

[[bench]]
name = "tui_perf"
harness = false

[[bench]]
name = "search_backends"
harness = false

# Gap H: jemalloc for 10-20% allocation-heavy path improvement.
# Keep the global jemalloc override to targets where tikv-jemallocator is a
# supported allocator choice. BSD-family targets stay on the platform allocator.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
tikv-jemallocator = { version = "0.6", optional = true }

# FreeBSD: third-party libs live under /usr/local and rquickjs-sys doesn't
# ship pre-generated bindings for this target, so regenerate at build time
# via the `bindgen` feature (uses /usr/bin/clang from the base system).
[target.'cfg(target_os = "freebsd")'.dependencies]
rquickjs = { version = "0.12.2", features = ["futures", "loader", "bindgen"] }

# Android (including Termux on-device): rquickjs-sys 0.11 ships pre-generated
# bindings for aarch64-linux-android only for some Cargo versions and not
# others; the canonical fix is to regenerate via the `bindgen` feature so we
# stop depending on a missing bindings/aarch64-linux-android.rs in the
# upstream crate. Termux ships clang under $PREFIX/bin which bindgen picks
# up automatically.
[target.'cfg(target_os = "android")'.dependencies]
rquickjs = { version = "0.12.2", features = ["futures", "loader", "bindgen"] }

[features]
default = ["sqlite-sessions", "tui", "bpe-tokens"]
full = [
    "image-resize",
    "jemalloc",
    "clipboard",
    "wasm-host",
    "sqlite-sessions",
    "syntax-highlighting",
    "tui",
    "url-pdf",
    "bpe-tokens",
    "rich_rust/full",
]
# BPE token counting (bd-cv653.7.2.1): real O200k/Cl100k tables replace the
# chars/4 heuristic; default-on, disable for size-critical minimal builds.
bpe-tokens = ["dep:tiktoken-rs"]
# PDF extraction for URL reads (bd-cv653.2.2) — opt-in to keep the default
# release binary inside the 22 MiB size budget.
url-pdf = ["dep:pdf-extract"]
# Interactive terminal front-end (crossterm + charmed_rust stack). Enabled by
# default so CLI users get an identical `pi` binary with no action required.
# Disabling it (`--no-default-features`) lets SDK/library consumers compile the
# `pi` library without the terminal UI dependencies.
tui = [
    "dep:crossterm",
    "dep:bubbletea",
    "dep:lipgloss",
    "dep:bubbles",
    "dep:glamour",
    "dep:unicode-width",
    "dep:textwrap",
]
# FrankenTUI migration stack (bd-cv653.9.1): default-OFF while the interactive
# runtime is ported. Requires `tui` because the bridge reuses PiMsg and the
# existing agent-event plumbing during coexistence.
ftui = ["dep:ftui", "dep:ftui-extras", "tui"]
image-resize = ["image"]
clipboard = ["dep:arboard"]
wasm-host = ["dep:wasmtime"]
sqlite-sessions = []
syntax-highlighting = ["rich_rust/syntax"]
ext-conformance = []
fuzzing = []
# Internal-only legacy capture utility. This is deliberately non-default so
# end-user `cargo install` installs only the supported `pi` executable. The
# single integration test that executes it is gated at the test-function level
# so the rest of that target remains in ordinary test runs.
internal-legacy-capture = []
# Internal-only MCP fixture server (bd-cv653.6.1): a tiny stdio JSON-RPC
# binary used by the MCP client e2e lanes. Non-default so end-user installs
# only get `pi`.
internal-mcp-fixture = []
# Opt-in loom model-checking lane. These tests are excluded from default
# all-target gates because loom explores scheduler interleavings aggressively.
loom-tests = []
# Opt-in wall-clock/process timing regressions. These are intentionally
# excluded from default test gates because scheduler-sensitive coverage should
# use deterministic clocks.
manual-timing-tests = []
jemalloc = ["dep:tikv-jemallocator"]

[[test]]
name = "hostcall_queue_loom"
path = "tests/hostcall_queue_loom.rs"
required-features = ["loom-tests"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true

[profile.test]
# Full-suite RCH workers have limited artifact storage; keep test binaries
# debuggable enough for line traces without emitting full debug sections.
debug = "line-tables-only"
incremental = false

# Performance benchmarking profile: opt-level=3, with debug info.
[profile.perf]
inherits = "release"
opt-level = 3
lto = "thin"
debug = 1
strip = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Allow some common patterns
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

# ---------------------------------------------------------------------------
# Local development with sibling crates
# ---------------------------------------------------------------------------
# This project depends on published crates.io versions of asupersync,
# rich_rust, charmed-*, and fsqlite. CI builds verify this (no sibling
# repos are checked out).
#
# To develop against LOCAL checkouts of these crates, uncomment the
# [patch.crates-io] section below. Cargo will use the local paths when they
# satisfy the version requirement and fall back to crates.io otherwise.
#
# IMPORTANT: Do NOT commit this section. To prevent accidental commits:
#   git update-index --skip-worktree Cargo.toml
# To re-enable tracking:
#   git update-index --no-skip-worktree Cargo.toml
#
# [patch.crates-io]
# asupersync = { path = "../asupersync" }
# rich_rust = { path = "../rich_rust" }
# charmed-bubbletea = { path = "../charmed_rust/crates/bubbletea" }
# charmed-bubbletea-macros = { path = "../charmed_rust/crates/bubbletea-macros" }
# charmed-lipgloss = { path = "../charmed_rust/crates/lipgloss" }
# charmed-bubbles = { path = "../charmed_rust/crates/bubbles" }
# charmed-glamour = { path = "../charmed_rust/crates/glamour" }
# charmed-harmonica = { path = "../charmed_rust/crates/harmonica" }
# fsqlite = { path = "../frankensqlite/crates/fsqlite" }
