[transfer]
# The extension-conformance corpus intentionally versions nested `dist/` and
# `build/` directories. Generic exclusions leave stale corpus fragments on
# workers, so only root-level build output is excluded here.
exclude_patterns = [
  "target/",
  "target-*/",
  "target_*/",
  "target-gate/",
  ".cargo-target/",
  ".cargo-target-*/",
  ".cargo-target-rusticmill/",
  ".rch-target/",
  ".rch-target*/",
  ".rch-target-*/",
  "*.rlib",
  "*.rmeta",
  ".git/objects/",
  ".git/logs/",
  ".git/hooks/",
  ".git/index",
  ".git/worktrees/",
  ".git/lfs/",
  "node_modules/",
  ".bun/",
  ".npm/",
  ".pnpm-store/",
  "/dist/",
  "/build/",
  ".next/",
  ".nuxt/",
  ".turbo/",
  ".parcel-cache/",
  ".beads/.br_history/",
  ".beads/.br_history_quarantine/",
  ".beads/.br_recovery/",
  ".beads/recovery_*/",
  ".beads/*.db*",
  ".beads/*.lock",
  ".beads/last-touched",
  "coverage/",
  "fuzz/corpus/",
  ".nyc_output/",
  ".core.*",
  "core.[0-9]*",
  "perf.data",
  "perf.data.old",
  "perf_hsmm.data",
  "perf_hsmm.data.old",
  "tests/artifacts/",
  "tests/edit_repro.rs",
  ".cargo/credentials",
  ".cargo/credentials.toml",
  ".env",
  ".env.*",
  "*.pem",
  "*.key",
  "credentials.json",
  "secrets.json",
  "secrets.yaml",
  "secrets.yml",
  "secrets.toml",
  "secrets.env",
  "secrets.txt",
  "secrets.conf",
  "secrets.cfg",
  "secrets.properties",
  "secrets.xml",
]

[environment]
# Provider replay artifacts require a full source commit when RCH intentionally
# omits `.git/`. Callers can export this from the local checkout before an RCH
# gate; the test fails closed rather than accepting ambiguous lineage.
allowlist = ["PI_PROVIDER_REPLAY_GIT_COMMIT"]
