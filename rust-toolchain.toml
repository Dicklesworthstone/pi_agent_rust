# Pinned to a specific nightly so builds and lint results are reproducible.
# The locked dependency graph requires Rust 1.95 or newer; the repository's
# validated release toolchain is nightly-2026-07-05. An unpinned `nightly`
# channel let clippy drift across toolchains: newer nightlies strengthen the
# pedantic/nursery lint groups and can expose new warnings without a source
# change. CI runs `cargo clippy --all-targets -- -D warnings`, so bump this pin
# deliberately and re-run the complete release gates rather than floating.
#
# Deliberate bump 2026-07-09: nightly-2026-02-19 -> nightly-2026-07-05.
# asupersync requires `sysinfo = "0.39"`; the locked sysinfo 0.39.6 declares
# Rust 1.95 and uses language/library support unavailable on the old pin.
# nightly-2026-07-05 is the validated landing spot for the current dependency
# graph and lint policy.
# (Sibling projects may use different pins because they do not consume this
# repository's locked asupersync/sysinfo graph.)
[toolchain]
channel = "nightly-2026-07-05"
components = ["rustfmt", "clippy"]
