      - name: Build drop-in certification verdict artifact [linux]
        if: always() && runner.os == 'Linux'
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path, PurePosixPath

          source_path = Path("tests/full_suite_gate/certification_verdict.json")
          contract_path = Path("docs/contracts/dropin-certification-contract.json")
          target_path = Path("docs/evidence/dropin-certification-verdict.json")
          repo_root = Path.cwd().resolve(strict=True)
          generated_at = (
              datetime.now(timezone.utc)
              .replace(microsecond=0)
              .isoformat()
              .replace("+00:00", "Z")
          )
          gate_id_pattern = re.compile(r"G(0[1-9]|1[0-2])-[a-z0-9]+(?:-[a-z0-9]+)*")
          commit_pattern = re.compile(r"(?:[0-9a-f]{40}|[0-9a-f]{64})")

          def write_payload(payload):
              if target_path.is_symlink():
                  raise RuntimeError(f"refusing to replace symlinked verdict target: {target_path}")
              target_path.parent.mkdir(parents=True, exist_ok=True)
              target_path.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
              print(
                  f"Wrote {target_path} with overall_verdict={payload.get('overall_verdict')}"
              )

          def load_object(path, label, errors):
              if path.is_symlink() or not path.is_file():
                  errors.append(
                      f"missing or non-regular {label}: {path.as_posix()}"
                  )
                  return {}
              try:
                  payload = json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:  # noqa: BLE001
                  errors.append(f"invalid {label}: {exc}")
                  return {}
              if not isinstance(payload, dict):
                  errors.append(f"invalid {label}: root must be an object")
                  return {}
              return payload

          def canonical_repo_path(value):
              if (
                  not isinstance(value, str)
                  or not value
                  or "\\" in value
                  or re.match(r"^[A-Za-z]:", value) is not None
              ):
                  return None
              pure = PurePosixPath(value)
              if (
                  pure.is_absolute()
                  or pure.as_posix() != value
                  or any(part in ("", ".", "..") for part in pure.parts)
              ):
                  return None
              return pure.as_posix()

          def run_git(*args, text=True):
              env = os.environ.copy()
              env["GIT_LITERAL_PATHSPECS"] = "1"
              return subprocess.run(
                  ["git", *args],
                  check=False,
                  capture_output=True,
                  text=text,
                  env=env,
              )

          def committed_regular_blob_error(value):
              relative = canonical_repo_path(value)
              if relative is None:
                  return "path is not canonical and repository-relative"
              candidate = Path(relative)
              if candidate.is_symlink() or not candidate.is_file():
                  return "path is not a regular non-symlink file"
              try:
                  candidate.resolve(strict=True).relative_to(repo_root)
              except (OSError, RuntimeError, ValueError):
                  return "path resolves outside the repository"

              tree = run_git("ls-tree", "-z", "HEAD", "--", relative, text=False)
              if tree.returncode != 0:
                  return "unable to inspect release HEAD"
              records = [record for record in tree.stdout.split(b"\0") if record]
              if len(records) != 1:
                  return "path is not tracked as one exact release-HEAD entry"
              try:
                  metadata, recorded_path = records[0].split(b"\t", 1)
                  mode, object_type, object_id = metadata.split(b" ", 2)
              except ValueError:
                  return "release-HEAD entry is malformed"
              if (
                  mode not in (b"100644", b"100755")
                  or object_type != b"blob"
                  or os.fsdecode(recorded_path) != relative
              ):
                  return "release-HEAD entry is not a canonical regular-file blob"

              committed = run_git("cat-file", "blob", os.fsdecode(object_id), text=False)
              if committed.returncode != 0:
                  return "unable to read release-HEAD blob"
              try:
                  worktree_bytes = candidate.read_bytes()
              except OSError as exc:
                  return f"unable to read worktree artifact: {exc}"
              if committed.stdout != worktree_bytes:
                  return "worktree bytes differ from the release-HEAD blob"
              return None

          def resolve_git_commit():
              candidate = os.environ.get("GITHUB_SHA", "").strip()
              if commit_pattern.fullmatch(candidate):
                  return candidate
              result = subprocess.run(
                  ["git", "rev-parse", "--verify", "HEAD^{commit}"],
                  check=False,
                  capture_output=True,
                  text=True,
              )
              fallback = result.stdout.strip()
              return fallback if result.returncode == 0 else candidate

          producer_errors = []
          contract = load_object(contract_path, "drop-in certification contract", producer_errors)
          source = load_object(source_path, "certification lane artifact", producer_errors)
          contract_provenance_error = committed_regular_blob_error(contract_path.as_posix())
          if contract_provenance_error is not None:
              producer_errors.append(
                  "drop-in certification contract provenance: " + contract_provenance_error
              )

          if contract.get("schema") != "pi.dropin.certification_contract.v1":
              producer_errors.append("unsupported drop-in certification contract schema")
          enforcement = contract.get("release_process_enforcement")
          verdict_spec = enforcement.get("verdict_artifact_contract") if isinstance(enforcement, dict) else None
          required_verdict_fields = {
              "git_commit",
              "generated_at_utc",
              "overall_verdict",
              "hard_gate_results",
              "blocking_reasons",
              "evidence_index",
          }
          if not isinstance(verdict_spec, dict):
              producer_errors.append("contract verdict_artifact_contract must be an object")
          else:
              if verdict_spec.get("path") != target_path.as_posix():
                  producer_errors.append("contract verdict path does not name the canonical target")
              if verdict_spec.get("schema") != "pi.dropin.certification_verdict.v1":
                  producer_errors.append("contract names an unsupported verdict schema")
              required_fields = verdict_spec.get("required_fields")
              if (
                  not isinstance(required_fields, list)
                  or len(required_fields) != len(set(required_fields))
                  or set(required_fields) != required_verdict_fields
              ):
                  producer_errors.append("contract verdict required_fields do not match the v1 schema")
          if source.get("schema") != "pi.ci.certification_lane.v1":
              producer_errors.append("unsupported certification lane schema")

          contract_gates = contract.get("hard_gates")
          gate_specs = []
          if not isinstance(contract_gates, list):
              producer_errors.append("contract hard_gates must be an array")
          else:
              seen_gate_ids = set()
              for index, gate in enumerate(contract_gates, start=1):
                  if not isinstance(gate, dict):
                      producer_errors.append(f"contract hard_gates[{index - 1}] must be an object")
                      continue
                  gate_id = gate.get("gate_id")
                  match = gate_id_pattern.fullmatch(gate_id) if isinstance(gate_id, str) else None
                  if match is None or int(match.group(1)) != index:
                      producer_errors.append(
                          f"contract hard_gates[{index - 1}] must be canonical gate G{index:02d}"
                      )
                      continue
                  if gate_id in seen_gate_ids:
                      producer_errors.append(f"duplicate contract hard gate: {gate_id}")
                      continue
                  seen_gate_ids.add(gate_id)
                  blocking = gate.get("blocking")
                  if not isinstance(blocking, bool):
                      producer_errors.append(f"contract hard gate {gate_id} blocking must be boolean")
                      continue
                  bead = gate.get("owner_issue_primary")
                  if not isinstance(bead, str) or not bead:
                      producer_errors.append(
                          f"contract hard gate {gate_id} owner_issue_primary must be non-empty"
                      )
                      continue
                  required_artifacts = gate.get("required_artifacts")
                  if not isinstance(required_artifacts, list) or not required_artifacts:
                      producer_errors.append(
                          f"contract hard gate {gate_id} required_artifacts must be non-empty"
                      )
                      continue
                  canonical_artifacts = [canonical_repo_path(path) for path in required_artifacts]
                  if any(path is None for path in canonical_artifacts):
                      producer_errors.append(
                          f"contract hard gate {gate_id} has a non-canonical required artifact"
                      )
                      continue
                  if len(canonical_artifacts) != len(set(canonical_artifacts)):
                      producer_errors.append(
                          f"contract hard gate {gate_id} repeats a required artifact"
                      )
                      continue
                  gate_specs.append(
                      {
                          "gate_id": gate_id,
                          "blocking": blocking,
                          "required_artifacts": canonical_artifacts,
                          "bead": bead,
                      }
                  )
              if len(contract_gates) != 12 or len(gate_specs) != 12:
                  producer_errors.append(
                      f"contract must define exactly the ordered G01-G12 gate set; found {len(gate_specs)} valid gates"
                  )

          source_gates = source.get("gates")
          source_gate_by_id = {}
          if not isinstance(source_gates, list):
              producer_errors.append("certification lane gates must be an array")
          else:
              for index, gate in enumerate(source_gates):
                  if (
                      not isinstance(gate, dict)
                      or not isinstance(gate.get("id"), str)
                      or not gate["id"]
                  ):
                      producer_errors.append(f"certification lane gate[{index}] is malformed")
                      continue
                  gate_id = gate["id"]
                  if gate_id in source_gate_by_id:
                      producer_errors.append(f"duplicate certification lane gate: {gate_id}")
                      continue
                  source_gate_by_id[gate_id] = gate

          hard_gate_results = []
          blocking_reasons = list(producer_errors)
          evidence_by_path = {}
          artifact_errors = {}
          for spec in gate_specs:
              gate_id = spec["gate_id"]
              required_artifacts = spec["required_artifacts"]
              for artifact_path in required_artifacts:
                  if artifact_path not in artifact_errors:
                      artifact_errors[artifact_path] = committed_regular_blob_error(
                          artifact_path
                      )
                  evidence_by_path.setdefault(
                      artifact_path,
                      {"path": artifact_path, "exists": artifact_errors[artifact_path] is None},
                  )

              source_gate = source_gate_by_id.get(gate_id)
              failures = []
              status = "fail"
              detail = None
              if source_gate is None:
                  failures.append("canonical gate is absent from certification lane output")
              else:
                  source_status = source_gate.get("status")
                  normalized_status = source_status.lower() if isinstance(source_status, str) else ""
                  if normalized_status not in ("pass", "fail", "blocked", "waived"):
                      failures.append(f"invalid certification lane status: {source_status!r}")
                  elif normalized_status != "pass":
                      failures.append(f"certification lane status={normalized_status}")

                  source_blocking = source_gate.get("blocking")
                  if source_blocking is not spec["blocking"]:
                      failures.append(
                          f"certification lane blocking={source_blocking!r}, expected {spec['blocking']}"
                      )

                  source_artifacts = source_gate.get("artifact_paths")
                  if source_artifacts is None and isinstance(source_gate.get("artifact_path"), str):
                      source_artifacts = [source_gate["artifact_path"]]
                  if source_artifacts != required_artifacts:
                      failures.append(
                          "certification lane artifact paths do not match the contract"
                      )
                  source_detail = source_gate.get("detail")
                  if source_detail is not None and not isinstance(source_detail, str):
                      failures.append("certification lane detail must be a string or null")
                  elif source_detail:
                      detail = source_detail

              invalid_artifacts = [
                  f"{path} ({artifact_errors[path]})"
                  for path in required_artifacts
                  if artifact_errors[path] is not None
              ]
              if invalid_artifacts:
                  failures.append(
                      "invalid required artifacts: " + ", ".join(invalid_artifacts)
                  )

              if not failures:
                  status = "pass"
              else:
                  failure_detail = "; ".join(failures)
                  detail = f"{detail}; {failure_detail}" if detail else failure_detail
                  blocking_reasons.append(f"{gate_id}:fail ({failure_detail})")
              hard_gate_results.append(
                  {
                      "gate_id": gate_id,
                      "status": status,
                      "blocking": spec["blocking"],
                      "detail": detail,
                      "artifact_paths": required_artifacts,
                      "bead": spec["bead"],
                  }
              )

          lane_verdict = source.get("verdict", "missing")
          if lane_verdict != "pass":
              blocking_reasons.append(f"certification lane verdict={lane_verdict!r} (expected 'pass')")

          overall_verdict = (
              "CERTIFIED"
              if len(hard_gate_results) == 12
              and all(gate["status"] == "pass" for gate in hard_gate_results)
              and not blocking_reasons
              else "NOT_CERTIFIED"
          )
          write_payload(
              {
                  "schema": "pi.dropin.certification_verdict.v1",
                  "git_commit": resolve_git_commit(),
                  "generated_at_utc": generated_at,
                  "overall_verdict": overall_verdict,
                  "hard_gate_results": hard_gate_results,
                  "blocking_reasons": blocking_reasons,
                  "evidence_index": list(evidence_by_path.values()),
                  "source": {
                      "certification_lane_artifact": source_path.as_posix(),
                      "lane_schema": source.get("schema"),
                      "lane_verdict": lane_verdict,
                      "lane_generated_at": source.get("generated_at"),
                  },
              }
          )
          PY

      - name: Release gate (evidence bundle) [linux]
        if: always() && runner.os == 'Linux'
        env:
          RELEASE_GATE_REQUIRE_DROPIN_CERTIFIED: ${{ vars.RELEASE_GATE_REQUIRE_DROPIN_CERTIFIED || '0' }}
          # rch (remote cargo) is a developer-laptop tool and is not installed
          # on GitHub-hosted runners; force the local runner so the script does
          # not abort with "RELEASE_GATE_CARGO_RUNNER=rch ... not available".
          RELEASE_GATE_CARGO_RUNNER: local
        run: |
          set -euxo pipefail
          report_path="${RUNNER_TEMP}/pi-release-gate-report.json"
          gate_checkout="${RUNNER_TEMP}/pi-release-gate-checkout"
          # Earlier evidence producers intentionally write ignored and tracked
          # artifacts in the primary checkout. The release gate verifies only
          # committed evidence and a clean source tree, so run it against a
          # detached worktree populated from the exact CI commit.
          git worktree add --detach "$gate_checkout" HEAD
          cd "$gate_checkout"
          gate_exit=0
          ./scripts/release_gate.sh --report --no-rch | tee "$report_path" || gate_exit=$?
          VERDICT=$(python3 -c "import json, sys; print(json.load(open(sys.argv[1])).get('verdict','unknown'))" "$report_path")
          echo "Release gate verdict: $VERDICT"
          if [ "$gate_exit" -ne 0 ] || [ "$VERDICT" != "pass" ]; then
            echo "::error::Release gate failed (exit=$gate_exit, verdict=$VERDICT)"
            exit 1
          fi

      - name: Upload release gate report [linux]
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-${{ github.sha }}
          path: ${{ runner.temp }}/pi-release-gate-report.json
          if-no-files-found: error

      - name: Upload unified evidence bundle [linux]
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: evidence-bundle-${{ github.sha }}
          path: |
            tests/evidence_bundle/index.json
            tests/evidence_bundle/bundle_report.md
            tests/evidence_bundle/events.jsonl
          if-no-files-found: warn

      - name: Upload full-suite gate artifacts [linux]
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: full-suite-gate-${{ github.sha }}
          path: |
            tests/full_suite_gate/full_suite_verdict.json
            tests/full_suite_gate/full_suite_events.jsonl
            tests/full_suite_gate/full_suite_report.md
            tests/security_compat/security_compat_dashboard.json
            tests/security_compat/security_compat_events.jsonl
            docs/evidence/dropin-certification-verdict.json
          if-no-files-found: warn

      - name: Reclaim disk space before coverage [linux]
        if: runner.os == 'Linux'
        run: |
          set -euxo pipefail
          df -h /
          cargo clean 2>/dev/null || true
          df -h /

      - name: Coverage summary (llvm-cov)
        if: runner.os == 'Linux'
        run: |
          set -euxo pipefail
          start=$(date +%s)
          echo "env: CI=$CI VCR_MODE=$VCR_MODE VCR_CASSETTE_DIR=$VCR_CASSETTE_DIR"
          cargo llvm-cov --locked --all-targets --workspace --summary-only | tee llvm-cov-summary.txt
          end=$(date +%s)
          echo "coverage_summary_duration_s=$((end-start))"

      - name: Coverage gate (lcov)
        if: runner.os == 'Linux'
        run: |
          set -euxo pipefail
          start=$(date +%s)
          # Coverage gate: 50% (actual: ~66% as of 2026-02-05)
          cargo llvm-cov --locked --all-targets --workspace --lcov --output-path lcov.info --fail-under-lines 50
          ls -lah lcov.info
          end=$(date +%s)
          echo "coverage_lcov_duration_s=$((end-start))"

      - name: Coverage report (html)
        if: runner.os == 'Linux'
        run: cargo llvm-cov --locked --all-targets --workspace --html

      - name: Upload coverage artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            pi_agent_rust/llvm-cov-summary.txt
            pi_agent_rust/lcov.info
            pi_agent_rust/target/llvm-cov/html

      - name: Upload conformance reports
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-reports
          path: |
            pi_agent_rust/tests/ext_conformance/reports/**/*.json
            pi_agent_rust/tests/ext_conformance/reports/**/*.jsonl
            pi_agent_rust/tests/e2e_results/**/*.json
            pi_agent_rust/tests/e2e_results/**/*.jsonl
            pi_agent_rust/tests/e2e_results/**/*.log
            pi_agent_rust/tests/quarantine_report.json
            pi_agent_rust/tests/quarantine_audit.jsonl
            pi_agent_rust/release_gate_report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload provider test artifacts
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-test-artifacts-${{ github.sha }}
          path: |
            pi_agent_rust/tests/full_suite_gate/**/*.json
            pi_agent_rust/tests/full_suite_gate/**/*.jsonl
            pi_agent_rust/tests/full_suite_gate/**/*.md
            pi_agent_rust/tests/cross_platform_reports/**/*.json
          if-no-files-found: ignore
          retention-days: 30

  release_evidence_gate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      CI: "true"
      RUST_BACKTRACE: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
    defaults:
      run:
        working-directory: pi_agent_rust
        shell: bash
    steps:
      - name: Checkout pi_agent_rust
        uses: actions/checkout@v4
        with:
          path: pi_agent_rust
          fetch-depth: 0

      - name: Install Rust toolchain (nightly)
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # pinned 2026-08-04
        with:
          toolchain: nightly-2026-07-05
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: pi_agent_rust -> target
          prefix-key: release-evidence-gate

      - name: Release evidence gate
        run: |
          set -euxo pipefail
          cargo test --locked --test release_evidence_gate -- --nocapture

  qa_shards_linux:
    name: qa-shard (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: unit
            lane: unit
            shard_index: 0
            shard_total: 1
          - name: integration-0
            lane: integration
            shard_index: 0
            shard_total: 2
          - name: integration-1
            lane: integration
            shard_index: 1
            shard_total: 2
          - name: e2e-0
            lane: e2e
            shard_index: 0
            shard_total: 2
          - name: e2e-1
            lane: e2e
            shard_index: 1
            shard_total: 2
          - name: extension-0
            lane: extension
            shard_index: 0
            shard_total: 4
          - name: extension-1
            lane: extension
            shard_index: 1
            shard_total: 4
          - name: extension-2
            lane: extension
            shard_index: 2
            shard_total: 4
          - name: extension-3
            lane: extension
            shard_index: 3
            shard_total: 4
          - name: parity
            lane: parity
            shard_index: 0
            shard_total: 1
          - name: security
            lane: security
            shard_index: 0
            shard_total: 1
          - name: perf
            lane: perf
            shard_index: 0
            shard_total: 1
    env:
      CI: "true"
      VCR_MODE: "playback"
      VCR_CASSETTE_DIR: "tests/fixtures/vcr"
      RUST_BACKTRACE: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      SHARD_ARTIFACT_DIR: ${{ github.workspace }}/pi_agent_rust/tests/e2e_results/ci-shards/${{ matrix.shard.name }}
      SHARD_CORRELATION_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard.name }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/pi_agent_rust/target/ci-shards/${{ matrix.shard.name }}
    defaults:
      run:
        working-directory: pi_agent_rust
        shell: bash
    steps:
      - name: Checkout pi_agent_rust
        uses: actions/checkout@v4
        with:
          path: pi_agent_rust
          fetch-depth: 0

      - name: Install system deps (fd, rg)
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y fd-find ripgrep
          sudo ln -sf "$(command -v fdfind)" /usr/local/bin/fd

      - name: Install Rust toolchain (nightly)
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # pinned 2026-08-04
        with:
          toolchain: nightly-2026-07-05
          components: rustfmt, clippy, llvm-tools-preview

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: pi_agent_rust -> target
          prefix-key: qa-shards-${{ matrix.shard.name }}

      - name: Execute shard lane
        run: |
          set -euxo pipefail
          mkdir -p "$SHARD_ARTIFACT_DIR"
          case "${{ matrix.shard.lane }}" in
            unit)
              E2E_ARTIFACT_DIR="$SHARD_ARTIFACT_DIR" \
              CI_CORRELATION_ID="$SHARD_CORRELATION_ID" \
              ./scripts/e2e/run_all.sh \
                --profile quick \
                --skip-lint \
                --shard-name "${{ matrix.shard.name }}"
              ;;
            integration)
              E2E_ARTIFACT_DIR="$SHARD_ARTIFACT_DIR" \
              CI_CORRELATION_ID="$SHARD_CORRELATION_ID" \
              ./scripts/e2e/run_all.sh \
                --profile ci \
                --skip-lint \
                --skip-e2e \
                --shard-kind unit \
                --shard-index "${{ matrix.shard.shard_index }}" \
                --shard-total "${{ matrix.shard.shard_total }}" \
                --shard-name "${{ matrix.shard.name }}"
              ;;
            e2e)
              E2E_ARTIFACT_DIR="$SHARD_ARTIFACT_DIR" \
              CI_CORRELATION_ID="$SHARD_CORRELATION_ID" \
              ./scripts/e2e/run_all.sh \
                --profile full \
                --skip-lint \
                --skip-unit \
                --shard-kind suite \
                --shard-index "${{ matrix.shard.shard_index }}" \
                --shard-total "${{ matrix.shard.shard_total }}" \
                --shard-name "${{ matrix.shard.name }}"
              ;;
            extension)
              TEST_LOG_JSONL_PATH="$SHARD_ARTIFACT_DIR/test-log.jsonl" \
              TEST_ARTIFACT_INDEX_PATH="$SHARD_ARTIFACT_DIR/artifact-index.jsonl" \
              PI_SHARD_INDEX="${{ matrix.shard.shard_index }}" \
              PI_SHARD_TOTAL="${{ matrix.shard.shard_total }}" \
              PI_SHARD_PARALLELISM="${{ vars.PI_EXT_SHARD_PARALLELISM || '4' }}" \
              RUST_LOG=info \
              cargo test --locked --test ext_conformance_generated --features ext-conformance \
                -- conformance_sharded_matrix --nocapture --exact \
                2>&1 | tee "$SHARD_ARTIFACT_DIR/output.log"
              mkdir -p "$SHARD_ARTIFACT_DIR/sharded"
              cp -f tests/ext_conformance/reports/sharded/shard_*_report.json "$SHARD_ARTIFACT_DIR/sharded/" || true
              cp -f tests/ext_conformance/reports/sharded/shard_*_events.jsonl "$SHARD_ARTIFACT_DIR/sharded/" || true
              cp -f tests/ext_conformance/reports/sharded/shard_*_report.md "$SHARD_ARTIFACT_DIR/sharded/" || true
              ;;
            parity)
              TEST_LOG_JSONL_PATH="$SHARD_ARTIFACT_DIR/test-log.jsonl" \
              TEST_ARTIFACT_INDEX_PATH="$SHARD_ARTIFACT_DIR/artifact-index.jsonl" \
              RUST_LOG=info \
              cargo test \
                --locked \
                --test json_mode_parity \
                --test cross_surface_parity \
                --test config_precedence \
                --test vcr_parity_validation \
                --test e2e_cross_provider_parity \
                -- --test-threads=2 \
                2>&1 | tee "$SHARD_ARTIFACT_DIR/output.log"
              python3 scripts/ci/generate_parity_evidence.py \
                --output "$SHARD_ARTIFACT_DIR/parity_evidence.json" \
                --log "$SHARD_ARTIFACT_DIR/output.log"
              ;;
            security)
              TEST_LOG_JSONL_PATH="$SHARD_ARTIFACT_DIR/test-log.jsonl" \
              TEST_ARTIFACT_INDEX_PATH="$SHARD_ARTIFACT_DIR/artifact-index.jsonl" \
              RUST_LOG=info \
              cargo test \
                --locked \
                --test security_budgets \
                --test security_fs_escape \
                --test security_http_policy \
                -- --test-threads=1 \
                2>&1 | tee "$SHARD_ARTIFACT_DIR/output.log"
              ;;
            perf)
              TEST_LOG_JSONL_PATH="$SHARD_ARTIFACT_DIR/test-log.jsonl" \
              TEST_ARTIFACT_INDEX_PATH="$SHARD_ARTIFACT_DIR/artifact-index.jsonl" \
              RUST_LOG=info \
              cargo build --locked --bin pi
              TEST_LOG_JSONL_PATH="$SHARD_ARTIFACT_DIR/test-log.jsonl" \
              TEST_ARTIFACT_INDEX_PATH="$SHARD_ARTIFACT_DIR/artifact-index.jsonl" \
              RUST_LOG=info \
              cargo test \
                --locked \
                --test perf_budgets \
                --test perf_regression \
                --test perf_comparison \
                --test performance_comparison \
                -- --test-threads=1 \
                2>&1 | tee "$SHARD_ARTIFACT_DIR/output.log"
              ;;
            *)
              echo "Unknown shard lane: ${{ matrix.shard.lane }}" >&2
              exit 1
              ;;
          esac

      - name: Build shard artifact index
        if: always()
        env:
          SHARD_NAME: ${{ matrix.shard.name }}
          SHARD_LANE: ${{ matrix.shard.lane }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p "$SHARD_ARTIFACT_DIR"
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path(os.environ["SHARD_ARTIFACT_DIR"])
          index_path = root / "ci-shard-index.json"
          entries = []
          for path in sorted(root.rglob("*")):
              if path.is_file():
                  entries.append(
                      {
                          "path": str(path.relative_to(root)),
                          "size_bytes": path.stat().st_size,
                      }
                  )

          payload = {
              "schema": "pi.ci.shard_index.v1",
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "shard_name": os.environ["SHARD_NAME"],
              "lane": os.environ["SHARD_LANE"],
              "correlation_id": os.environ["SHARD_CORRELATION_ID"],
              "job_status": os.environ.get("JOB_STATUS", "unknown"),
              "file_count": len(entries),
              "entries": entries,
          }
          index_path.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          print(f"wrote shard index: {index_path}")
          PY

      - name: Upload shard artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-shard-${{ matrix.shard.name }}-${{ github.sha }}
          path: |
            pi_agent_rust/tests/e2e_results/ci-shards/${{ matrix.shard.name }}/
          if-no-files-found: warn
          retention-days: 30

  qa_shard_summary:
    name: qa-shard-summary
    runs-on: ubuntu-latest
    needs: qa_shards_linux
    if: always()
    steps:
      - name: Download shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ci-shard-*
          path: shard-artifacts
          merge-multiple: false

      - name: Build merged shard index
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import math
          import os
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path

          def now_iso():
              return datetime.now(timezone.utc).isoformat()

          def load_json(path):
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:  # pragma: no cover
                  return {"error": str(exc)}

          def clean_signature(value):
              text = " ".join(str(value).strip().split())
              if not text:
                  return "unknown failure"
              if len(text) > 240:
                  return text[:237] + "..."
              return text

          def extract_failure_signature(log_path):
              if not log_path.is_file():
                  return "missing log file"
              try:
                  lines = log_path.read_text(encoding="utf-8", errors="replace").splitlines()
              except Exception as exc:  # pragma: no cover
                  return clean_signature(f"log read error: {exc}")
              signal_tokens = (
                  "error:",
                  "panicked at",
                  "assertion failed",
                  "thread '",
                  "failed",
                  "timeout",
                  "timed out",
                  "connection reset",
                  "rate limit",
              )
              for line in reversed(lines[-400:]):
                  lowered = line.lower()
                  if any(token in lowered for token in signal_tokens):
                      return clean_signature(line)
              if lines:
                  return clean_signature(lines[-1])
              return "empty log"

          def summarize_balance(samples):
              if not samples:
                  return {
                      "count": 0,
                      "min": None,
                      "max": None,
                      "spread": None,
                      "ratio_max_to_min": None,
                  }
              sample_min = min(samples)
              sample_max = max(samples)
              ratio = None
              if sample_min > 0:
                  ratio = sample_max / sample_min
              return {
                  "count": len(samples),
                  "min": sample_min,
                  "max": sample_max,
                  "spread": sample_max - sample_min,
                  "ratio_max_to_min": ratio,
              }

          def percentile(values, pct):
              if not values:
                  return None
              ordered = sorted(float(v) for v in values)
              if len(ordered) == 1:
                  return ordered[0]
              rank = (pct / 100.0) * (len(ordered) - 1)
              lower = int(math.floor(rank))
              upper = int(math.ceil(rank))
              if lower == upper:
                  return ordered[lower]
              weight = rank - lower
              return ordered[lower] + (ordered[upper] - ordered[lower]) * weight

          root = Path("shard-artifacts")
          index_files = sorted(root.rglob("ci-shard-index.json"))
          shards = []
          for index_file in index_files:
              try:
                  payload = json.loads(index_file.read_text(encoding="utf-8"))
              except Exception as exc:  # pragma: no cover
                  payload = {
                      "schema": "pi.ci.shard_index.v1",
                      "shard_name": index_file.parent.name,
                      "lane": "unknown",
                      "correlation_id": "unknown",
                      "job_status": "invalid",
                      "file_count": 0,
                      "entries": [],
                      "error": str(exc),
                  }
              shard_dir = index_file.parent
              payload["artifact_source"] = str(shard_dir)

              shard_failure_records = []
              summary_file = shard_dir / "summary.json"
              duration_seconds = None
              if summary_file.is_file():
                  summary_payload = load_json(summary_file)
                  if "error" in summary_payload:
                      payload["summary_error"] = summary_payload["error"]
                  else:
                      raw_duration = summary_payload.get("duration_seconds")
                      if isinstance(raw_duration, (int, float)):
                          duration_seconds = float(raw_duration)
                      payload["summary_excerpt"] = {
                          "profile": summary_payload.get("profile"),
                          "duration_seconds": duration_seconds,
                          "total_units": summary_payload.get("total_units"),
                          "failed_units": summary_payload.get("failed_units"),
                          "total_suites": summary_payload.get("total_suites"),
                          "failed_suites": summary_payload.get("failed_suites"),
                      }
                      for item in summary_payload.get("unit_targets", []):
                          if not isinstance(item, dict):
                              continue
                          if int(item.get("exit_code", 1)) == 0:
                              continue
                          target = str(item.get("target", "unknown"))
                          rel_log = Path("unit") / target / "output.log"
                          signature = extract_failure_signature(shard_dir / rel_log)
                          shard_failure_records.append(
                              {
                                  "shard_name": payload.get("shard_name", shard_dir.name),
                                  "lane": payload.get("lane", "unknown"),
                                  "scope": "unit_target",
                                  "name": target,
                                  "signature": signature,
                                  "log_path": str(rel_log),
                                  "artifact_source": str(shard_dir),
                                  "issue_id": "bd-1f42.6.2",
                                  "thread_id": "bd-1f42.6.2",
                              }
                          )
                      for item in summary_payload.get("suites", []):
                          if not isinstance(item, dict):
                              continue
                          if int(item.get("exit_code", 1)) == 0:
                              continue
                          suite = str(item.get("suite", "unknown"))
                          rel_log = Path(suite) / "output.log"
                          signature = extract_failure_signature(shard_dir / rel_log)
                          shard_failure_records.append(
                              {
                                  "shard_name": payload.get("shard_name", shard_dir.name),
                                  "lane": payload.get("lane", "unknown"),
                                  "scope": "suite",
                                  "name": suite,
                                  "signature": signature,
                                  "log_path": str(rel_log),
                                  "artifact_source": str(shard_dir),
                                  "issue_id": "bd-1f42.6.2",
                                  "thread_id": "bd-1f42.6.2",
                              }
                          )
              manifest_file = shard_dir / "ci_shard_manifest.json"
              unit_targets = []
              e2e_suites = []
              extension_count = 0
              if manifest_file.is_file():
                  manifest_payload = load_json(manifest_file)
                  if "error" in manifest_payload:
                      payload["manifest_error"] = manifest_payload["error"]
                  else:
                      selection = manifest_payload.get("selection", {})
                      maybe_units = selection.get("unit_targets", [])
                      maybe_suites = selection.get("e2e_suites", [])
                      if isinstance(maybe_units, list):
                          unit_targets = [item for item in maybe_units if isinstance(item, str) and item]
                      if isinstance(maybe_suites, list):
                          e2e_suites = [item for item in maybe_suites if isinstance(item, str) and item]
                      payload["manifest_excerpt"] = {
                          "profile": manifest_payload.get("profile"),
                          "correlation_id": manifest_payload.get("correlation_id"),
                          "shard": manifest_payload.get("shard"),
                          "selection_counts": {
                              "unit_targets": len(unit_targets),
                              "e2e_suites": len(e2e_suites),
                          },
                      }
              extension_reports = sorted((shard_dir / "sharded").glob("shard_*_report.json"))
              if extension_reports:
                  extension_excerpts = []
                  extension_durations_ms = []
                  for report_file in extension_reports:
                      report_payload = load_json(report_file)
                      if "error" in report_payload:
                          payload.setdefault("extension_report_errors", []).append(
                              {
                                  "path": str(report_file.relative_to(shard_dir)),
                                  "error": report_payload["error"],
                              }
                          )
                          continue
                      shard_size = report_payload.get("shard_count")
                      if isinstance(shard_size, int):
                          extension_count += shard_size
                      duration_ms = report_payload.get("total_duration_ms")
                      if isinstance(duration_ms, (int, float)):
                          extension_durations_ms.append(float(duration_ms))
                      extension_excerpts.append(
                          {
                              "path": str(report_file.relative_to(shard_dir)),
                              "shard_index": report_payload.get("shard_index"),
                              "shard_total": report_payload.get("shard_total"),
                              "shard_count": report_payload.get("shard_count"),
                              "tested": report_payload.get("tested"),
                              "passed": report_payload.get("passed"),
                              "failed": report_payload.get("failed"),
                              "skipped": report_payload.get("skipped"),
                              "pass_rate_pct": report_payload.get("pass_rate_pct"),
                              "by_failure_category": report_payload.get("by_failure_category"),
                          }
                      )
                      for failure in report_payload.get("failures", []):
                          if not isinstance(failure, dict):
                              continue
                          extension_id = str(failure.get("id", "unknown"))
                          reason = str(failure.get("reason", "unknown"))
                          category = str(failure.get("category", "unknown"))
                          shard_failure_records.append(
                              {
                                  "shard_name": payload.get("shard_name", shard_dir.name),
                                  "lane": payload.get("lane", "unknown"),
                                  "scope": "extension",
                                  "name": extension_id,
                                  "signature": clean_signature(f"[{category}] {reason}"),
                                  "failure_category": category,
                                  "reason": reason,
                                  "log_path": str(report_file.relative_to(shard_dir)),
                                  "artifact_source": str(shard_dir),
                                  "issue_id": "bd-1f42.6.2",
                                  "thread_id": "bd-1f42.6.2",
                              }
                          )
                  payload["extension_shard_reports"] = extension_excerpts
                  if duration_seconds is None and extension_durations_ms:
                      duration_seconds = max(extension_durations_ms) / 1000.0

              payload["selection_counts"] = {
                  "unit_targets": len(unit_targets),
                  "e2e_suites": len(e2e_suites),
                  "extensions": extension_count,
              }
              payload["duration_seconds"] = duration_seconds

              if not shard_failure_records and payload.get("job_status") not in {
                  "success",
                  "unknown",
              }:
                  fallback_log = shard_dir / "output.log"
                  shard_failure_records.append(
                      {
                          "shard_name": payload.get("shard_name", shard_dir.name),
                          "lane": payload.get("lane", "unknown"),
                          "scope": "shard",
                          "name": payload.get("shard_name", shard_dir.name),
                          "signature": extract_failure_signature(fallback_log),
                          "log_path": str(fallback_log.relative_to(shard_dir))
                          if fallback_log.exists()
                          else "output.log",
                          "artifact_source": str(shard_dir),
                          "issue_id": "bd-1f42.6.2",
                          "thread_id": "bd-1f42.6.2",
                      }
                  )
              payload["failure_records"] = shard_failure_records
              shards.append(payload)

          lane_counts = {}
          lane_runtime_samples = {}
          lane_duration_seconds = {}
          lane_unit_samples = {}
          lane_suite_samples = {}
          lane_extension_samples = {}
          correlation_ids = set()
          duration_rows = []
          failure_records = []
          failed = 0
          for shard in shards:
              lane = shard.get("lane", "unknown")
              lane_counts[lane] = lane_counts.get(lane, 0) + 1
              lane_duration_seconds.setdefault(lane, 0.0)
              lane_runtime_samples.setdefault(lane, [])
              lane_unit_samples.setdefault(lane, [])
              lane_suite_samples.setdefault(lane, [])
              lane_extension_samples.setdefault(lane, [])
              if shard.get("job_status") not in {"success", "unknown"}:
                  failed += 1
              duration = shard.get("duration_seconds")
              if isinstance(duration, (int, float)):
                  lane_duration_seconds[lane] += float(duration)
                  lane_runtime_samples[lane].append(float(duration))
                  duration_rows.append(
                      {
                          "shard_name": shard.get("shard_name", "unknown"),
                          "lane": lane,
                          "duration_seconds": float(duration),
                      }
                  )
              selection_counts = shard.get("selection_counts", {})
              unit_count = selection_counts.get("unit_targets")
              suite_count = selection_counts.get("e2e_suites")
              extension_count = selection_counts.get("extensions")
              if isinstance(unit_count, int):
                  lane_unit_samples[lane].append(unit_count)
              if isinstance(suite_count, int):
                  lane_suite_samples[lane].append(suite_count)
              if isinstance(extension_count, int):
                  lane_extension_samples[lane].append(extension_count)
              correlation = shard.get("correlation_id")
              if isinstance(correlation, str) and correlation:
                  correlation_ids.add(correlation)
              for failure in shard.get("failure_records", []):
                  if isinstance(failure, dict):
                      failure_records.append(failure)

          slowest = max(duration_rows, key=lambda row: row["duration_seconds"], default=None)
          fastest = min(duration_rows, key=lambda row: row["duration_seconds"], default=None)
          runtime_samples = [row["duration_seconds"] for row in duration_rows]
          p95_runtime_seconds = percentile(runtime_samples, 95)

          signature_counter = Counter(
              failure.get("signature", "unknown failure") for failure in failure_records
          )
          top_failure_signatures = []
          for signature, count in signature_counter.most_common(10):
              samples = [
                  failure
                  for failure in failure_records
                  if failure.get("signature", "unknown failure") == signature
              ][:3]
              top_failure_signatures.append(
                  {
                      "signature": signature,
                      "count": count,
                      "samples": samples,
                  }
              )

          transient_tokens = (
              "timeout",
              "timed out",
              "connection reset",
              "rate limit",
              "temporarily unavailable",
              "broken pipe",
              "econnreset",
              "429",
              "503",
          )
          flaky_candidates = [
              failure
              for failure in failure_records
              if any(token in failure.get("signature", "").lower() for token in transient_tokens)
          ]
          flake_rate_estimate = (
              (len(flaky_candidates) / len(failure_records)) if failure_records else 0.0
          )

          pass_rate = (
              ((len(shards) - failed) / len(shards))
              if shards
              else 0.0
          )

          lane_balance = {}
          for lane in sorted(lane_counts):
              lane_balance[lane] = {
                  "runtime_seconds": summarize_balance(lane_runtime_samples.get(lane, [])),
                  "selection_unit_targets": summarize_balance(
                      lane_unit_samples.get(lane, [])
                  ),
                  "selection_e2e_suites": summarize_balance(
                      lane_suite_samples.get(lane, [])
                  ),
                  "selection_extensions": summarize_balance(
                      lane_extension_samples.get(lane, [])
                  ),
              }

          dashboard = {
              "schema": "pi.ci.test_health_dashboard.v1",
              "generated_at": now_iso(),
              "owner_issue_id": "bd-1f42.6.2",
              "owner_thread_id": "bd-1f42.6.2",
              "run": {
                  "github_run_id": os.environ.get("GITHUB_RUN_ID"),
                  "github_run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
                  "github_sha": os.environ.get("GITHUB_SHA"),
              },
              "metrics": {
                  "total_shards": len(shards),
                  "failed_shards": failed,
                  "pass_rate": pass_rate,
                  "p95_runtime_seconds": p95_runtime_seconds,
                  "flake_rate_estimate": flake_rate_estimate,
                  "failure_signature_count": len(failure_records),
              },
              "top_failure_signatures": top_failure_signatures,
              "artifact_links": {
                  "merged_summary": "ci-shard-summary.json",
                  "shards": [
                      {
                          "shard_name": shard.get("shard_name"),
                          "lane": shard.get("lane"),
                          "artifact_source": shard.get("artifact_source"),
                          "index_file": "ci-shard-index.json",
                      }
                      for shard in shards
                  ],
              },
              "methodology": {
                  "pass_rate": "successful_shards / total_shards",
                  "p95_runtime_seconds": "p95 across shard duration_seconds",
                  "flake_rate_estimate": "transient-keyword signature count / total failure signatures",
                  "top_failure_signatures": "frequency-ranked failure signature extraction from shard logs",
              },
          }

          summary = {
              "schema": "pi.ci.shard_summary.v1",
              "generated_at": now_iso(),
              "total_shards": len(shards),
              "failed_shards": failed,
              "lane_counts": lane_counts,
              "runtime": {
                  "documented_shards": len(duration_rows),
                  "total_duration_seconds": sum(
                      row["duration_seconds"] for row in duration_rows
                  ),
                  "lane_duration_seconds": lane_duration_seconds,
                  "slowest_shard": slowest,
                  "fastest_shard": fastest,
              },
              "balance": {"lane_balance": lane_balance},
              "correlation_ids": sorted(correlation_ids),
              "dashboard": dashboard["metrics"],
              "top_failure_signatures": top_failure_signatures,
              "flake_candidates": flaky_candidates,
              "shards": shards,
          }

          summary_out = Path("ci-shard-summary.json")
          summary_out.write_text(json.dumps(summary, indent=2) + "\n", encoding="utf-8")
          print(f"wrote {summary_out}")

          dashboard_out = Path("ci-test-health-dashboard.json")
          dashboard_out.write_text(
              json.dumps(dashboard, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"wrote {dashboard_out}")

          trend_row = {
              "schema": "pi.ci.test_health_trend_row.v1",
              "generated_at": now_iso(),
              "owner_issue_id": "bd-1f42.6.2",
              "owner_thread_id": "bd-1f42.6.2",
              "github_run_id": os.environ.get("GITHUB_RUN_ID"),
              "github_run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "github_sha": os.environ.get("GITHUB_SHA"),
              "pass_rate": pass_rate,
              "p95_runtime_seconds": p95_runtime_seconds,
              "flake_rate_estimate": flake_rate_estimate,
              "failed_shards": failed,
              "total_shards": len(shards),
              "top_failure_signatures": [
                  entry["signature"] for entry in top_failure_signatures[:5]
              ],
              "summary_artifact": "ci-shard-summary.json",
              "dashboard_artifact": "ci-test-health-dashboard.json",
          }
          trend_out = Path("ci-test-health-trend.jsonl")
          trend_out.write_text(json.dumps(trend_row) + "\n", encoding="utf-8")
          print(f"wrote {trend_out}")
          PY

      - name: Upload merged shard summary
        uses: actions/upload-artifact@v4
        with:
          name: ci-shard-summary-${{ github.sha }}
          path: |
            ci-shard-summary.json
            ci-test-health-dashboard.json
            ci-test-health-trend.jsonl
          if-no-files-found: error

  # SDK / library consumers (e.g. the pi-code-gui VSCode extension) embed the
  # `pi` library without the interactive terminal front-end. The `tui` feature
  # is in the default set, so `cargo build` is unchanged for CLI users, but the
  # library must keep compiling without crossterm + the charmed_rust stack.
  # This job locks that contract in so it can never silently regress.
  library_no_default_features:
    name: lib (--no-default-features, no TUI)
    runs-on: ubuntu-latest
    env:
      CI: "true"
      RUST_BACKTRACE: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
    defaults:
      run:
        working-directory: pi_agent_rust
        shell: bash
    steps:
      - name: Checkout pi_agent_rust
        uses: actions/checkout@v4
        with:
          path: pi_agent_rust
          fetch-depth: 0

      - name: Install Rust toolchain (nightly)
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # pinned 2026-08-04
        with:
          toolchain: nightly-2026-07-05
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: pi_agent_rust -> target
          prefix-key: library-no-default-features

      - name: cargo check (lib, no default features, no TUI)
        run: |
          set -euxo pipefail
          # Library-only build: SDK consumers must compile without the
          # crossterm / charmed_rust terminal stack pulled in by `tui`.
          # `--lib` (not `--all-targets`) is deliberate: the `pi` binary and the
          # integration tests/benches require the `tui` feature, so they are
          # expected to be skipped here — only the library contract is locked in.
          cargo check --locked --no-default-features --lib
