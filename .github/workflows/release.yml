            "refs/tags/${RELEASE_TAG}:${validation_tag_ref}" \
            "refs/heads/main:${validation_main_ref}"
          if [ "$(git rev-parse "${validation_tag_ref}")" != "$RELEASE_TAG_OID" ] \
            || [ "$(git rev-parse "${validation_tag_ref}^{commit}")" != "$RELEASE_COMMIT" ] \
            || [ "$(git rev-parse 'HEAD^{commit}')" != "$RELEASE_COMMIT" ] \
            || [ "$RELEASE_COMMIT" != "$RELEASE_MAIN_COMMIT" ] \
            || ! git merge-base --is-ancestor "$RELEASE_MAIN_COMMIT" "$(git rev-parse "${validation_main_ref}^{commit}")"; then
            echo "::error::Frozen release source changed across draft handoff"
            exit 1
          fi

  verify_crate:
    name: Verify exact crate publication payload
    needs: [plan, release]
    if: needs.plan.result == 'success' && needs.release.result == 'success' && needs.plan.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: pi_agent_rust
        shell: bash
    steps:
      - name: Checkout frozen release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: pi_agent_rust
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.plan.outputs.commit }}

      - name: Verify frozen release source
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
          RELEASE_TAG_OID: ${{ needs.plan.outputs.tag_oid }}
          RELEASE_MAIN_COMMIT: ${{ needs.plan.outputs.main_commit }}
        run: |
          set -euo pipefail
          validation_tag_ref="refs/release-validation/crate/tag/${RELEASE_TAG}"
          validation_main_ref="refs/release-validation/crate/main"
          git fetch --no-tags --force origin \
            "refs/tags/${RELEASE_TAG}:${validation_tag_ref}" \
            "refs/heads/main:${validation_main_ref}"
          remote_tag_oid="$(git rev-parse "${validation_tag_ref}")"
          remote_commit="$(git rev-parse "${validation_tag_ref}^{commit}")"
          remote_main="$(git rev-parse "${validation_main_ref}^{commit}")"
          if [ "$remote_tag_oid" != "$RELEASE_TAG_OID" ] \
            || [ "$(git rev-parse 'HEAD^{commit}')" != "$RELEASE_COMMIT" ] \
            || [ "$remote_commit" != "$RELEASE_COMMIT" ] \
            || [ "$RELEASE_COMMIT" != "$RELEASE_MAIN_COMMIT" ] \
            || ! git merge-base --is-ancestor "$RELEASE_MAIN_COMMIT" "$remote_main"; then
            echo "::error::Frozen release source changed before crate validation"
            exit 1
          fi

      - name: Install system dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Install frozen Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master commit verified 2026-08-04
        with:
          toolchain: nightly-2026-07-05

      - name: Resolve exact root package
        id: package
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          metadata="$(cargo metadata --no-deps --locked --format-version 1)"
          package_fields="$(python3 -c '
          import json, pathlib, sys
          metadata = json.load(sys.stdin)
          manifest = pathlib.Path("Cargo.toml").resolve()
          matches = [package for package in metadata["packages"] if pathlib.Path(package["manifest_path"]) == manifest]
          if len(matches) != 1:
              raise SystemExit(f"expected one root package, found {len(matches)}")
          package = matches[0]
          print(package["name"], package["version"])
          ' <<< "$metadata")"
          read -r package_name package_version <<< "$package_fields"
          if [ "$package_name" != "pi_agent_rust" ] || [ "$package_version" != "$RELEASE_VERSION" ]; then
            echo "::error::Root package identity differs from release tag: ${package_name} ${package_version}"
            exit 1
          fi
          {
            echo "name=$package_name"
            echo "version=$package_version"
          } >> "$GITHUB_OUTPUT"

      - name: Build and verify dry-run crate package
        id: crate
        env:
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain=v2 --untracked-files=all)" ] \
            || ! git diff --quiet HEAD -- \
            || ! git diff --cached --quiet HEAD --; then
            echo "::error::Canonical release checkout is dirty before cargo publish dry-run"
            exit 1
          fi
          noncanonical_flags="$(git ls-files -v | grep -v '^H ' || true)"
          if [ -n "$noncanonical_flags" ]; then
            echo "::error::Release index contains hidden or noncanonical flags"
            printf '%s\n' "$noncanonical_flags"
            exit 1
          fi
          cargo publish --dry-run --locked
          crate_path="target/package/${PACKAGE_NAME}-${PACKAGE_VERSION}.crate"
          if [ ! -f "$crate_path" ] || [ -L "$crate_path" ] || [ ! -s "$crate_path" ]; then
            echo "::error::cargo publish dry-run did not produce the expected regular .crate"
            exit 1
          fi
          CRATE_PATH="$crate_path" python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          import tarfile
          import tomllib
          from pathlib import Path, PurePosixPath

          crate_path = Path(os.environ["CRATE_PATH"])
          package_name = os.environ["PACKAGE_NAME"]
          version = os.environ["PACKAGE_VERSION"]
          commit = os.environ["RELEASE_COMMIT"]
          prefix = f"{package_name}-{version}"

          def strict_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise SystemExit(f"duplicate JSON key in crate metadata: {key!r}")
                  result[key] = value
              return result

          def head_blob(path):
              tree = subprocess.run(
                  ["git", "ls-tree", "HEAD", "--", path], capture_output=True, text=True, check=True
              ).stdout.strip().split()
              if len(tree) < 4 or tree[0] not in {"100644", "100755"} or tree[1] != "blob":
                  raise SystemExit(f"packaged path is not a regular tracked HEAD blob: {path}")
              return subprocess.run(["git", "show", f"HEAD:{path}"], capture_output=True, check=True).stdout

          data = crate_path.read_bytes()
          with tarfile.open(fileobj=__import__("io").BytesIO(data), mode="r:gz") as archive:
              members = archive.getmembers()
              names = [member.name.rstrip("/") for member in members]
              if len(names) != len(set(names)):
                  raise SystemExit("dry-run crate archive contains duplicate paths")
              saw_vcs = saw_original_manifest = saw_normalized_manifest = False
              for member, name in zip(members, names, strict=True):
                  raw_parts = name.split("/")
                  path = PurePosixPath(name)
                  if "\\" in name or name.startswith("/") or not raw_parts or raw_parts[0] != prefix \
                      or any(part in {"", ".", ".."} for part in raw_parts):
                      raise SystemExit(f"unsafe dry-run crate path: {name!r}")
                  if member.isdir():
                      continue
                  if not member.isreg() or member.issym() or member.islnk():
                      raise SystemExit(f"non-regular dry-run crate entry: {name!r}")
                  extracted = archive.extractfile(member)
                  if extracted is None:
                      raise SystemExit(f"unreadable dry-run crate entry: {name!r}")
                  member_bytes = extracted.read()
                  relative = PurePosixPath(*path.parts[1:]).as_posix()
                  if relative == ".cargo_vcs_info.json":
                      vcs = json.loads(member_bytes, object_pairs_hook=strict_object)
                      if not isinstance(vcs, dict) or not set(vcs).issubset({"git", "path_in_vcs"}) or "git" not in vcs:
                          raise SystemExit("unexpected .cargo_vcs_info.json schema")
                      if set(vcs["git"]) not in ({"sha1"}, {"sha1", "dirty"}) \
                          or vcs["git"].get("sha1") != commit or vcs["git"].get("dirty", False) is not False:
                          raise SystemExit("crate VCS metadata is not bound cleanly to the frozen commit")
                      if "path_in_vcs" in vcs and vcs["path_in_vcs"] != "":
                          raise SystemExit("root package has unexpected path_in_vcs metadata")
                      saw_vcs = True
                  elif relative == "Cargo.toml.orig":
                      if member_bytes != head_blob("Cargo.toml"):
                          raise SystemExit("Cargo.toml.orig bytes differ from frozen HEAD")
                      saw_original_manifest = True
                  elif relative == "Cargo.toml":
                      normalized = tomllib.loads(member_bytes.decode("utf-8"))
                      if normalized.get("package", {}).get("name") != package_name \
                          or normalized.get("package", {}).get("version") != version:
                          raise SystemExit("normalized package manifest identity differs")
                      saw_normalized_manifest = True
                  elif member_bytes != head_blob(relative):
                      raise SystemExit(f"packaged bytes differ from frozen HEAD: {relative}")
              if not (saw_vcs and saw_original_manifest and saw_normalized_manifest):
                  raise SystemExit("dry-run crate is missing required Cargo/VCS metadata")
          digest = hashlib.sha256(data).hexdigest()
          if re.fullmatch(r"[0-9a-f]{64}", digest) is None:
              raise SystemExit("invalid dry-run crate SHA256")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"path={crate_path.as_posix()}\nsha256={digest}\nsize={len(data)}\n")
          print(f"Verified canonical dry-run crate: sha256={digest} size={len(data)}")
          PY

      - name: Check crates.io reconciliation state
        id: registry
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          CRATE_SHA256: ${{ steps.crate.outputs.sha256 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          endpoint = (
              "https://crates.io/api/v1/crates/"
              f"{urllib.parse.quote(os.environ['PACKAGE_NAME'], safe='')}/"
              f"{urllib.parse.quote(os.environ['PACKAGE_VERSION'], safe='')}"
          )
          request = urllib.request.Request(endpoint, headers={"User-Agent": "pi-agent-rust-release-verifier"})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  needed = "true"
              else:
                  raise
          else:
              checksum = payload.get("version", {}).get("checksum")
              if checksum != os.environ["CRATE_SHA256"]:
                  raise SystemExit(f"existing crates.io version checksum differs: {checksum!r}")
              needed = "false"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"publish_needed={needed}\n")
          PY

      - name: Final source and package proof before payload capture
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
          RELEASE_TAG_OID: ${{ needs.plan.outputs.tag_oid }}
          RELEASE_MAIN_COMMIT: ${{ needs.plan.outputs.main_commit }}
          CRATE_PATH: ${{ steps.crate.outputs.path }}
          CRATE_SHA256: ${{ steps.crate.outputs.sha256 }}
          CRATE_SIZE: ${{ steps.crate.outputs.size }}
        run: |
          set -euo pipefail
          validation_tag_ref="refs/release-validation/pre-crates/tag/${RELEASE_TAG}"
          validation_main_ref="refs/release-validation/pre-crates/main"
          git fetch --no-tags --force origin \
            "refs/tags/${RELEASE_TAG}:${validation_tag_ref}" \
            "refs/heads/main:${validation_main_ref}"
          if [ "$(git rev-parse "${validation_tag_ref}")" != "$RELEASE_TAG_OID" ] \
            || [ "$(git rev-parse "${validation_tag_ref}^{commit}")" != "$RELEASE_COMMIT" ] \
            || [ "$(git rev-parse 'HEAD^{commit}')" != "$RELEASE_COMMIT" ] \
            || [ "$RELEASE_COMMIT" != "$RELEASE_MAIN_COMMIT" ] \
            || ! git merge-base --is-ancestor "$RELEASE_MAIN_COMMIT" "$(git rev-parse "${validation_main_ref}^{commit}")"; then
            echo "::error::Frozen release source changed immediately before payload capture"
            exit 1
          fi
          if [ -n "$(git status --porcelain=v2 --untracked-files=all)" ] \
            || ! git diff --quiet HEAD -- \
            || ! git diff --cached --quiet HEAD -- \
            || [ -n "$(git ls-files -v | grep -v '^H ' || true)" ]; then
            echo "::error::Release checkout/index is not canonical immediately before payload capture"
            exit 1
          fi
          actual_sha256="$(sha256sum "$CRATE_PATH" | awk '{print $1}')"
          actual_size="$(stat -c '%s' "$CRATE_PATH")"
          if [ "$actual_sha256" != "$CRATE_SHA256" ] || [ "$actual_size" != "$CRATE_SIZE" ]; then
            echo "::error::Dry-run .crate changed after raw-byte verification"
            exit 1
          fi

      - name: Capture Cargo's exact verified registry payload
        id: capture
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          CRATE_SHA256: ${{ steps.crate.outputs.sha256 }}
        run: |
          set -euo pipefail
          server_path="${RUNNER_TEMP}/pi-cargo-publish-capture-server.py"
          body_path="${RUNNER_TEMP}/pi-crates-publish-body.bin"
          receipt_path="${RUNNER_TEMP}/pi-crates-publish-receipt.json"
          port_path="${RUNNER_TEMP}/pi-cargo-publish-capture-port"
          cat > "$server_path" <<'PY'
          import json
          import os
          import threading
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          from pathlib import Path

          body_path = Path(os.environ["PI_CAPTURE_BODY"])
          port_path = Path(os.environ["PI_CAPTURE_PORT"])

          class Handler(BaseHTTPRequestHandler):
              def log_message(self, format, *args):
                  return

              def do_GET(self):
                  if self.path == "/index/config.json":
                      payload = json.dumps(
                          {
                              "dl": f"http://127.0.0.1:{self.server.server_port}/crates",
                              "api": f"http://127.0.0.1:{self.server.server_port}",
                          },
                          separators=(",", ":"),
                      ).encode("utf-8")
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(payload)))
                      self.end_headers()
                      self.wfile.write(payload)
                  else:
                      self.send_response(404)
                      self.end_headers()

              def do_PUT(self):
                  if self.path != "/api/v1/crates/new":
                      self.send_response(404)
                      self.end_headers()
                      return
                  try:
                      length = int(self.headers.get("Content-Length", ""))
                  except ValueError:
                      length = -1
                  if length <= 8 or length > 512 * 1024 * 1024:
                      self.send_response(400)
                      self.end_headers()
                      return
                  body = self.rfile.read(length)
                  if len(body) != length:
                      self.send_response(400)
                      self.end_headers()
                      return
                  body_path.write_bytes(body)
                  payload = b'{"warnings":{"invalid_categories":[],"invalid_badges":[],"other":[]}}'
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(payload)))
                  self.end_headers()
                  self.wfile.write(payload)
                  threading.Thread(target=self.server.shutdown, daemon=True).start()

          server = ThreadingHTTPServer(("127.0.0.1", 0), Handler)
          port_path.write_text(f"{server.server_port}\n", encoding="utf-8")
          server.serve_forever()
          server.server_close()
          PY
          chmod 700 "$server_path"
          PI_CAPTURE_BODY="$body_path" PI_CAPTURE_PORT="$port_path" \
            python3 "$server_path" &
          server_pid=$!
          for _ in $(seq 1 100); do
            [ -s "$port_path" ] && break
            sleep 0.1
          done
          if [ ! -s "$port_path" ]; then
            echo "::error::Local Cargo publish capture server did not start"
            exit 1
          fi
          capture_port="$(cat "$port_path")"
          if [[ ! "$capture_port" =~ ^[0-9]+$ ]]; then
            echo "::error::Local Cargo publish capture server emitted an invalid port"
            exit 1
          fi
          capture_index="sparse+http://127.0.0.1:${capture_port}/index/"
          cargo -Zpublish-timeout publish \
            --locked \
            --registry pi-local-capture \
            --token pi-local-non-secret-capture-token \
            --config "registries.pi-local-capture.index='${capture_index}'" \
            --config 'publish.timeout=0'
          wait "$server_pid"

          PI_CAPTURE_BODY="$body_path" PI_CAPTURE_RECEIPT="$receipt_path" \
            CRATE_PATH="${{ steps.crate.outputs.path }}" python3 - <<'PY'
          import hashlib
          import json
          import os
          import struct
          from pathlib import Path

          def strict_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise SystemExit(f"duplicate Cargo publish metadata key: {key!r}")
                  result[key] = value
              return result

          body_path = Path(os.environ["PI_CAPTURE_BODY"])
          crate_path = Path(os.environ["CRATE_PATH"])
          if not body_path.is_file() or body_path.is_symlink() or not crate_path.is_file():
              raise SystemExit("Cargo capture body or verified dry-run crate is missing/non-regular")
          body = body_path.read_bytes()
          if len(body) < 8:
              raise SystemExit("Cargo registry publish body is truncated")
          metadata_len = struct.unpack_from("<I", body, 0)[0]
          metadata_start = 4
          metadata_end = metadata_start + metadata_len
          if metadata_end + 4 > len(body):
              raise SystemExit("Cargo registry metadata length exceeds captured body")
          crate_len = struct.unpack_from("<I", body, metadata_end)[0]
          crate_start = metadata_end + 4
          if crate_start + crate_len != len(body):
              raise SystemExit("Cargo registry crate length does not exactly consume captured body")
          metadata_bytes = body[metadata_start:metadata_end]
          crate_bytes = body[crate_start:]
          metadata = json.loads(metadata_bytes, object_pairs_hook=strict_object)
          required_metadata = {
              "name", "vers", "deps", "features", "authors", "description",
              "documentation", "homepage", "readme", "readme_file", "keywords",
              "categories", "license", "license_file", "repository", "badges",
              "links", "rust_version",
          }
          if not isinstance(metadata, dict) or not required_metadata.issubset(metadata):
              raise SystemExit("Cargo registry publish metadata is incomplete or malformed")
          if metadata.get("name") != os.environ["PACKAGE_NAME"] \
              or metadata.get("vers") != os.environ["PACKAGE_VERSION"]:
              raise SystemExit("Cargo registry publish metadata package identity differs")
          dry_run_bytes = crate_path.read_bytes()
          crate_sha256 = hashlib.sha256(crate_bytes).hexdigest()
          if crate_bytes != dry_run_bytes or crate_sha256 != os.environ["CRATE_SHA256"]:
              raise SystemExit("Cargo captured upload crate differs from the fully verified dry-run crate")
          receipt = {
              "schema": "pi.release.crates_publish_payload.v1",
              "name": os.environ["PACKAGE_NAME"],
              "version": os.environ["PACKAGE_VERSION"],
              "body_sha256": hashlib.sha256(body).hexdigest(),
              "body_size": len(body),
              "metadata_sha256": hashlib.sha256(metadata_bytes).hexdigest(),
              "metadata_size": len(metadata_bytes),
              "crate_sha256": crate_sha256,
              "crate_size": len(crate_bytes),
          }
          Path(os.environ["PI_CAPTURE_RECEIPT"]).write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print("Captured Cargo's canonical publish body with the exact fully verified .crate bytes")
          PY
          {
            echo "body=$body_path"
            echo "receipt=$receipt_path"
          } >> "$GITHUB_OUTPUT"

      - name: Upload exact crates.io publication payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crates-publication-payload-${{ needs.plan.outputs.tag }}
          path: |
            ${{ steps.capture.outputs.body }}
            ${{ steps.capture.outputs.receipt }}
          if-no-files-found: error
          retention-days: 1

      - name: Revalidate frozen source after payload capture
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
          RELEASE_TAG_OID: ${{ needs.plan.outputs.tag_oid }}
          RELEASE_MAIN_COMMIT: ${{ needs.plan.outputs.main_commit }}
        run: |
          set -euo pipefail
          validation_tag_ref="refs/release-validation/post-crate-capture/tag/${RELEASE_TAG}"
          validation_main_ref="refs/release-validation/post-crate-capture/main"
          git fetch --no-tags --force origin \
            "refs/tags/${RELEASE_TAG}:${validation_tag_ref}" \
            "refs/heads/main:${validation_main_ref}"
          if [ "$(git rev-parse "${validation_tag_ref}")" != "$RELEASE_TAG_OID" ] \
            || [ "$(git rev-parse "${validation_tag_ref}^{commit}")" != "$RELEASE_COMMIT" ] \
            || [ "$(git rev-parse 'HEAD^{commit}')" != "$RELEASE_COMMIT" ] \
            || [ "$RELEASE_COMMIT" != "$RELEASE_MAIN_COMMIT" ] \
            || ! git merge-base --is-ancestor "$RELEASE_MAIN_COMMIT" "$(git rev-parse "${validation_main_ref}^{commit}")"; then
            echo "::error::Frozen release source changed across crate payload capture"
            exit 1
          fi
