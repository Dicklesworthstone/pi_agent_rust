name: Release (GitHub binaries)

on:
  push:
    tags:
      - 'v[0-9]+.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.1.0)'
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  deployments: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      commit: ${{ steps.source.outputs.commit }}
      tag_oid: ${{ steps.source.outputs.tag_oid }}
      main_commit: ${{ steps.source.outputs.main_commit }}
    steps:
      - name: Determine and validate tag
        id: tag
        env:
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euxo pipefail
          if [ "$RELEASE_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$RELEASE_TAG_INPUT"
          else
            if [[ "$GITHUB_REF" != refs/tags/* ]]; then
              echo "::error::Expected a tag ref, got '$GITHUB_REF'"
              exit 1
            fi
            TAG="${GITHUB_REF#refs/tags/}"
          fi

          semver_tag_re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$TAG" =~ $semver_tag_re ]]; then
            echo "::error::Tag '$TAG' is not a complete v-prefixed SemVer tag"
            exit 1
          fi
          VERSION="${TAG#v}"

          version_without_build="${VERSION%%+*}"
          if [[ "$version_without_build" == *-* ]]; then
            PRERELEASE="true"
          else
            PRERELEASE="false"
          fi

          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

      - name: Require externally configured release governance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_GOVERNANCE_ACK: ${{ vars.RELEASE_GOVERNANCE_ACK }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          MAX_RESPONSE_BYTES = 1024 * 1024
          REQUIRED_ACK = "release-env-reviewers+immutable-v-tags-v1"

          def strict_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise SystemExit(f"duplicate GitHub governance JSON key: {key!r}")
                  result[key] = value
              return result

          if os.environ.get("RELEASE_GOVERNANCE_ACK") != REQUIRED_ACK:
              raise SystemExit(
                  "repository variable RELEASE_GOVERNANCE_ACK must attest the documented "
                  f"release controls with exact value {REQUIRED_ACK!r}"
              )

          api = os.environ["GITHUB_API_URL"].rstrip("/")
          parsed_api = urllib.parse.urlparse(api)
          api_origin = (
              parsed_api.scheme.lower(), (parsed_api.hostname or "").lower(), parsed_api.port or 443
          )
          if api_origin[0] != "https" or not api_origin[1]:
              raise SystemExit("GITHUB_API_URL must use a valid HTTPS origin")

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise urllib.error.HTTPError(
                      newurl, code, "refusing GitHub governance API redirect", headers, fp
                  )

          opener = urllib.request.build_opener(NoRedirect())
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "pi-agent-rust-release-governance",
          }

          def get_json(path):
              url = f"{api}{path}"
              parsed = urllib.parse.urlparse(url)
              origin = (parsed.scheme.lower(), (parsed.hostname or "").lower(), parsed.port or 443)
              if origin != api_origin:
                  raise SystemExit(f"refusing non-API governance URL: {url!r}")
              try:
                  with opener.open(urllib.request.Request(url, headers=headers), timeout=30) as response:
                      body = response.read(MAX_RESPONSE_BYTES + 1)
              except urllib.error.HTTPError as exc:
                  raise SystemExit(
                      f"required release governance endpoint {path!r} returned HTTP {exc.code}"
                  ) from exc
              if len(body) > MAX_RESPONSE_BYTES:
                  raise SystemExit(f"governance response exceeds {MAX_RESPONSE_BYTES} bytes")
              return json.loads(body, object_pairs_hook=strict_object)

          repo = os.environ["GITHUB_REPOSITORY"]
          environment = get_json(f"/repos/{repo}/environments/release")
          if not isinstance(environment, dict) or environment.get("name") != "release":
              raise SystemExit("the required release environment is absent or malformed")
          reviewer_rules = [
              rule for rule in environment.get("protection_rules", [])
              if isinstance(rule, dict) and rule.get("type") == "required_reviewers"
          ]
          if len(reviewer_rules) != 1 \
              or not reviewer_rules[0].get("reviewers") \
              or reviewer_rules[0].get("prevent_self_review") is not True:
              raise SystemExit(
                  "release environment must have nonempty required reviewers and prevent self-review"
              )

          summaries = get_json(
              f"/repos/{repo}/rulesets?includes_parents=true&targets=tag&per_page=100"
          )
          if not isinstance(summaries, list) or len(summaries) > 100:
              raise SystemExit("repository tag-ruleset inventory is malformed or incomplete")
          immutable = []
          for summary in summaries:
              if not isinstance(summary, dict) or not isinstance(summary.get("id"), int):
                  raise SystemExit("repository tag-ruleset summary is malformed")
              ruleset = get_json(f"/repos/{repo}/rulesets/{summary['id']}?includes_parents=true")
              ref_name = ruleset.get("conditions", {}).get("ref_name", {})
              includes = ref_name.get("include", [])
              excludes = ref_name.get("exclude", [])
              rule_types = {
                  rule.get("type") for rule in ruleset.get("rules", []) if isinstance(rule, dict)
              }
              # GitHub intentionally omits bypass_actors from callers without
              # ruleset write access. Omission is unproven and must fail closed.
              bypass = ruleset.get("bypass_actors")
              if ruleset.get("target") == "tag" \
                  and ruleset.get("enforcement") == "active" \
                  and ("refs/tags/v*" in includes or "~ALL" in includes) \
                  and excludes == [] \
                  and {"update", "deletion"}.issubset(rule_types) \
                  and isinstance(bypass, list) \
                  and bypass == []:
                  immutable.append(ruleset.get("id"))
          if not immutable:
              raise SystemExit(
                  "an active v* tag ruleset forbidding tag update/deletion with an explicitly "
                  "visible empty bypass-actor list is required"
              )
          print(
              "Verified observable release controls: protected review environment and immutable v* tag ruleset"
          )
          PY

      - name: Checkout release tag for commit resolution
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: pi_agent_rust
          fetch-depth: 0
          persist-credentials: false
          ref: refs/tags/${{ steps.tag.outputs.tag }}

      - name: Freeze release source commit
        id: source
        working-directory: pi_agent_rust
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          tag_ref="refs/tags/${RELEASE_TAG}"
          validation_tag_ref="refs/release-validation/plan/tag/${RELEASE_TAG}"
          validation_main_ref="refs/release-validation/plan/main"
          validation_master_ref="refs/release-validation/plan/master"
          git fetch --no-tags --force origin \
            "${tag_ref}:${validation_tag_ref}" \
            "refs/heads/main:${validation_main_ref}" \
            "refs/heads/master:${validation_master_ref}"
          tag_oid="$(git rev-parse "${tag_ref}")"
          remote_tag_oid="$(git rev-parse "${validation_tag_ref}")"
          tag_type="$(git cat-file -t "${tag_ref}")"
          remote_tag_type="$(git cat-file -t "${validation_tag_ref}")"
          tag_commit="$(git rev-parse "${tag_ref}^{commit}")"
          remote_commit="$(git rev-parse "${validation_tag_ref}^{commit}")"
          main_commit="$(git rev-parse "${validation_main_ref}^{commit}")"
          master_commit="$(git rev-parse "${validation_master_ref}^{commit}")"
          head_commit="$(git rev-parse 'HEAD^{commit}')"
          for oid in "$tag_oid" "$remote_tag_oid" "$tag_commit" "$remote_commit" "$main_commit" "$master_commit" "$head_commit"; do
            if [[ ! "$oid" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Release source did not resolve to a full Git object ID: $oid"
              exit 1
            fi
          done
          if [ "$tag_oid" != "$remote_tag_oid" ]; then
            echo "::error::Local and remote release tag objects differ"
            exit 1
          fi
          if [ "$tag_type" != "tag" ] || [ "$remote_tag_type" != "tag" ]; then
            echo "::error::Release tags must be annotated tag objects; lightweight tags are forbidden"
            exit 1
          fi
          if [ "$head_commit" != "$tag_commit" ] || [ "$remote_commit" != "$tag_commit" ]; then
            echo "::error::Release tag, remote tag, and checked-out HEAD do not resolve to one commit"
            exit 1
          fi
          if [ "$tag_commit" != "$main_commit" ] || [ "$tag_commit" != "$master_commit" ]; then
            echo "::error::Release tag must point at the synchronized origin/main and origin/master tips"
            exit 1
          fi
          {
            echo "commit=$tag_commit"
            echo "tag_oid=$tag_oid"
            echo "main_commit=$main_commit"
          } >> "$GITHUB_OUTPUT"

  gate:
    name: Release gate
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: "true"
      VCR_MODE: "playback"
      VCR_CASSETTE_DIR: "tests/fixtures/vcr"
      RUST_BACKTRACE: "1"
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        working-directory: pi_agent_rust
        shell: bash
    steps:
      - name: Checkout pi_agent_rust
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: pi_agent_rust
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.plan.outputs.commit }}

      - name: Verify frozen release source
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
          RELEASE_TAG_OID: ${{ needs.plan.outputs.tag_oid }}
          RELEASE_MAIN_COMMIT: ${{ needs.plan.outputs.main_commit }}
        run: |
          set -euo pipefail
          tag_ref="refs/tags/${RELEASE_TAG}"
          validation_tag_ref="refs/release-validation/gate/tag/${RELEASE_TAG}"
          validation_main_ref="refs/release-validation/gate/main"
          validation_master_ref="refs/release-validation/gate/master"
          for oid in "$RELEASE_COMMIT" "$RELEASE_TAG_OID" "$RELEASE_MAIN_COMMIT"; do
            if [[ ! "$oid" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Frozen release source contains an invalid Git object ID: $oid"
              exit 1
            fi
          done
          git fetch --no-tags --force origin \
            "${tag_ref}:${validation_tag_ref}" \
            "refs/heads/main:${validation_main_ref}" \
            "refs/heads/master:${validation_master_ref}"
          remote_tag_oid="$(git rev-parse "${validation_tag_ref}")"
          remote_commit="$(git rev-parse "${validation_tag_ref}^{commit}")"
          remote_main="$(git rev-parse "${validation_main_ref}^{commit}")"
          remote_master="$(git rev-parse "${validation_master_ref}^{commit}")"
          head_commit="$(git rev-parse 'HEAD^{commit}')"
          if [ "$remote_tag_oid" != "$RELEASE_TAG_OID" ] \
            || [ "$head_commit" != "$RELEASE_COMMIT" ] \
            || [ "$remote_commit" != "$RELEASE_COMMIT" ] \
            || [ "$RELEASE_COMMIT" != "$RELEASE_MAIN_COMMIT" ] \
            || [ "$remote_main" != "$remote_master" ]; then
            echo "::error::Frozen tag object, peeled commit, checkout, or main-tip binding changed"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$RELEASE_MAIN_COMMIT" "$remote_main"; then
            echo "::error::Frozen origin/main tip is no longer an ancestor of origin/main"
            exit 1
          fi

      - name: Verify Cargo.toml version matches tag
        run: |
          set -euxo pipefail
          cargo_version=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          tag_version="${{ needs.plan.outputs.version }}"
          if [[ "$cargo_version" != "$tag_version" ]]; then
            echo "::error::Version mismatch: Cargo.toml=$cargo_version, tag=$tag_version"
            exit 1
          fi
          echo "Version verified: $cargo_version"

      - name: Install system dependencies for all-target gates
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: Install frozen Rust toolchain for release gates
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # upstream commit verified 2026-08-04
        with:
          toolchain: nightly-2026-07-05
          components: rustfmt, clippy

      - name: Cache frozen release gate artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: pi_agent_rust -> target
          key: release-gate-${{ needs.plan.outputs.commit }}-internal-legacy-capture

      - name: Run mandatory frozen-SHA Cargo gates
        run: |
          set -euxo pipefail
          cargo fmt --check
          cargo check --locked --all-targets --features internal-legacy-capture
          cargo clippy --locked --all-targets --features internal-legacy-capture -- -D warnings
          cargo test --locked --all-targets --features internal-legacy-capture

      - name: Run release gate
        env:
          RELEASE_GATE_CARGO_RUNNER: local
          RELEASE_GATE_REQUIRE_DROPIN_CERTIFIED: "0"
          RELEASE_GATE_REQUIRE_PREFLIGHT: "1"
          RELEASE_GATE_REQUIRE_QUALITY: "1"
        run: |
          set -euxo pipefail
          chmod +x scripts/release_gate.sh
          report_path="${RUNNER_TEMP}/pi-release-gate-report.json"
          gate_exit=0
          ./scripts/release_gate.sh --no-rch --report | tee "$report_path" || gate_exit=$?
          VERDICT=$(python3 -c "import json, sys; print(json.load(open(sys.argv[1])).get('verdict','unknown'))" "$report_path")
          echo "Release gate verdict: $VERDICT"
          if [ "$gate_exit" -ne 0 ] || [ "$VERDICT" != "pass" ]; then
            echo "::error::Release gate failed (exit=$gate_exit, verdict=$VERDICT)"
            exit 1
          fi

      - name: Revalidate frozen source after every mandatory gate
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
          RELEASE_TAG_OID: ${{ needs.plan.outputs.tag_oid }}
          RELEASE_MAIN_COMMIT: ${{ needs.plan.outputs.main_commit }}
        run: |
          set -euo pipefail
          validation_tag_ref="refs/release-validation/post-gates/tag/${RELEASE_TAG}"
          validation_main_ref="refs/release-validation/post-gates/main"
          validation_master_ref="refs/release-validation/post-gates/master"
          git fetch --no-tags --force origin \
            "refs/tags/${RELEASE_TAG}:${validation_tag_ref}" \
            "refs/heads/main:${validation_main_ref}" \
            "refs/heads/master:${validation_master_ref}"
          remote_main="$(git rev-parse "${validation_main_ref}^{commit}")"
          remote_master="$(git rev-parse "${validation_master_ref}^{commit}")"
          if [ "$(git cat-file -t "${validation_tag_ref}")" != "tag" ] \
            || [ "$(git rev-parse "${validation_tag_ref}")" != "$RELEASE_TAG_OID" ] \
            || [ "$(git rev-parse "${validation_tag_ref}^{commit}")" != "$RELEASE_COMMIT" ] \
            || [ "$(git rev-parse 'HEAD^{commit}')" != "$RELEASE_COMMIT" ] \
            || [ "$RELEASE_COMMIT" != "$RELEASE_MAIN_COMMIT" ] \
            || [ "$remote_main" != "$remote_master" ] \
            || ! git merge-base --is-ancestor "$RELEASE_MAIN_COMMIT" "$remote_main"; then
            echo "::error::Frozen release source changed across mandatory release gates"
            exit 1
          fi
          if [ -n "$(git status --porcelain=v2 --untracked-files=all)" ] \
            || ! git diff --quiet HEAD -- \
            || ! git diff --cached --quiet HEAD -- \
            || [ -n "$(git ls-files -v | grep -v '^H ' || true)" ]; then
            echo "::error::Mandatory release gates mutated the canonical checkout/index"
            exit 1
          fi

      - name: Upload release gate report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-gate-report
          path: ${{ runner.temp }}/pi-release-gate-report.json
          if-no-files-found: error

  installer_regression:
    name: Installer regression
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pi_agent_rust
        shell: bash
    steps:
      - name: Checkout pi_agent_rust
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: pi_agent_rust
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.plan.outputs.commit }}

      - name: Verify frozen release source
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
          RELEASE_TAG_OID: ${{ needs.plan.outputs.tag_oid }}
          RELEASE_MAIN_COMMIT: ${{ needs.plan.outputs.main_commit }}
        run: |
          set -euo pipefail
          tag_ref="refs/tags/${RELEASE_TAG}"
          validation_tag_ref="refs/release-validation/installer/tag/${RELEASE_TAG}"
          validation_main_ref="refs/release-validation/installer/main"
          validation_master_ref="refs/release-validation/installer/master"
          for oid in "$RELEASE_COMMIT" "$RELEASE_TAG_OID" "$RELEASE_MAIN_COMMIT"; do
            if [[ ! "$oid" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Frozen release source contains an invalid Git object ID: $oid"
              exit 1
            fi
          done
          git fetch --no-tags --force origin \
            "${tag_ref}:${validation_tag_ref}" \
            "refs/heads/main:${validation_main_ref}" \
            "refs/heads/master:${validation_master_ref}"
          remote_tag_oid="$(git rev-parse "${validation_tag_ref}")"
          remote_commit="$(git rev-parse "${validation_tag_ref}^{commit}")"
          remote_main="$(git rev-parse "${validation_main_ref}^{commit}")"
          remote_master="$(git rev-parse "${validation_master_ref}^{commit}")"
          head_commit="$(git rev-parse 'HEAD^{commit}')"
          if [ "$remote_tag_oid" != "$RELEASE_TAG_OID" ] \
            || [ "$head_commit" != "$RELEASE_COMMIT" ] \
            || [ "$remote_commit" != "$RELEASE_COMMIT" ] \
            || [ "$RELEASE_COMMIT" != "$RELEASE_MAIN_COMMIT" ] \
            || [ "$remote_main" != "$remote_master" ]; then
            echo "::error::Frozen tag object, peeled commit, checkout, or main-tip binding changed"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$RELEASE_MAIN_COMMIT" "$remote_main"; then
            echo "::error::Frozen origin/main tip is no longer an ancestor of origin/main"
            exit 1
          fi

      - name: Run installer regression harness
        run: |
          set -euxo pipefail
          bash -n install.sh uninstall.sh tests/installer_regression.sh scripts/skill-smoke.sh
          bash tests/installer_regression.sh

  build:
    name: Build (${{ matrix.target }})
    needs: [plan, gate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: pi-linux-amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: pi-linux-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: pi-darwin-amd64
          - os: macos-15
            target: aarch64-apple-darwin
            asset: pi-darwin-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: pi-windows-amd64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CI: "true"
      RUST_BACKTRACE: "1"
    defaults:
      run:
        working-directory: pi_agent_rust
        shell: bash
    steps:
      - name: Checkout pi_agent_rust
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: pi_agent_rust
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.plan.outputs.commit }}
          # DO NOT add `submodules: false` here (YAML boolean).
          # actions/checkout@v4 treats the YAML boolean false as "recursive",
          # which then fails because legacy_pi_mono_code/pi-mono has no
          # .gitmodules entry. Omitting the key entirely gives the correct
          # default (string "false" = don't checkout submodules).
          # See: https://github.com/Dicklesworthstone/pi_agent_rust/issues/34

      - name: Verify frozen release source
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
          RELEASE_TAG_OID: ${{ needs.plan.outputs.tag_oid }}
          RELEASE_MAIN_COMMIT: ${{ needs.plan.outputs.main_commit }}
        run: |
          set -euo pipefail
          tag_ref="refs/tags/${RELEASE_TAG}"
          validation_tag_ref="refs/release-validation/build/tag/${RELEASE_TAG}"
          validation_main_ref="refs/release-validation/build/main"
          validation_master_ref="refs/release-validation/build/master"
          for oid in "$RELEASE_COMMIT" "$RELEASE_TAG_OID" "$RELEASE_MAIN_COMMIT"; do
            if [[ ! "$oid" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Frozen release source contains an invalid Git object ID: $oid"
              exit 1
            fi
          done
          git fetch --no-tags --force origin \
            "${tag_ref}:${validation_tag_ref}" \
            "refs/heads/main:${validation_main_ref}" \
            "refs/heads/master:${validation_master_ref}"
          remote_tag_oid="$(git rev-parse "${validation_tag_ref}")"
          remote_commit="$(git rev-parse "${validation_tag_ref}^{commit}")"
          remote_main="$(git rev-parse "${validation_main_ref}^{commit}")"
          remote_master="$(git rev-parse "${validation_master_ref}^{commit}")"
          head_commit="$(git rev-parse 'HEAD^{commit}')"
          if [ "$remote_tag_oid" != "$RELEASE_TAG_OID" ] \
            || [ "$head_commit" != "$RELEASE_COMMIT" ] \
            || [ "$remote_commit" != "$RELEASE_COMMIT" ] \
            || [ "$RELEASE_COMMIT" != "$RELEASE_MAIN_COMMIT" ] \
            || [ "$remote_main" != "$remote_master" ]; then
            echo "::error::Frozen tag object, peeled commit, checkout, or main-tip binding changed"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$RELEASE_MAIN_COMMIT" "$remote_main"; then
            echo "::error::Frozen origin/main tip is no longer an ancestor of origin/main"
            exit 1
          fi

      - name: Verify committed model registry source
        run: |
          set -euo pipefail
          MODELS_TS="legacy_pi_mono_code/pi-mono/packages/ai/src/models.generated.ts"

          before_head="$(git rev-parse HEAD)"
          before_status="$(git status --porcelain=v2 --untracked-files=all)"
          if [ -n "$before_status" ]; then
            echo "::error::Release checkout is not clean before model registry validation"
            printf '%s\n' "$before_status"
            exit 1
          fi

          if [ ! -f "$MODELS_TS" ] || [ -L "$MODELS_TS" ]; then
            echo "::error::$MODELS_TS must be an existing regular non-symlink file"
            exit 1
          fi

          head_entry="$(git ls-tree HEAD -- "$MODELS_TS")"
          if [ -z "$head_entry" ]; then
            echo "::error::$MODELS_TS is not tracked by HEAD"
            exit 1
          fi
          read -r head_mode head_type head_oid head_path <<< "$head_entry"
          if [[ ! "$head_mode" =~ ^100(644|755)$ ]] || [ "$head_type" != "blob" ] || [ "$head_path" != "$MODELS_TS" ]; then
            echo "::error::$MODELS_TS is not a regular tracked HEAD blob: $head_entry"
            exit 1
          fi

          index_entry="$(git ls-files --stage -- "$MODELS_TS")"
          read -r index_mode index_oid index_stage index_path <<< "$index_entry"
          if [ "$index_mode" != "$head_mode" ] || [ "$index_oid" != "$head_oid" ] || [ "$index_stage" != "0" ] || [ "$index_path" != "$MODELS_TS" ]; then
            echo "::error::$MODELS_TS index entry does not match the HEAD blob"
            exit 1
          fi

          index_state="$(git ls-files -v -- "$MODELS_TS")"
          if [ "$index_state" != "H $MODELS_TS" ]; then
            echo "::error::$MODELS_TS has an unexpected or hidden index state: $index_state"
            exit 1
          fi

          worktree_oid="$(git hash-object --no-filters -- "$MODELS_TS")"
          if [ "$worktree_oid" != "$head_oid" ]; then
            echo "::error::$MODELS_TS worktree bytes do not match the committed HEAD blob"
            exit 1
          fi

          after_head="$(git rev-parse HEAD)"
          after_status="$(git status --porcelain=v2 --untracked-files=all)"
          if [ "$after_head" != "$before_head" ] || [ "$after_status" != "$before_status" ]; then
            echo "::error::Model registry validation mutated the checked-out source tree"
            exit 1
          fi

      - name: Install system deps (xcb + build tools) [linux]
        if: runner.os == 'Linux'
        run: |
          set -euxo pipefail
          sudo apt-get update
          # libxcb: required by arboard (clipboard crate) on Linux.
          # build-essential: ensures gcc/make are present for C-FFI crates
          # (tikv-jemallocator, rquickjs, wasmtime) — particularly important
          # on the ubuntu-24.04-arm runner which may have a minimal image.
          sudo apt-get install -y \
            build-essential \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: Install Rust toolchain (nightly)
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # upstream commit verified 2026-08-04
        with:
          toolchain: nightly-2026-07-05
          components: rustfmt, clippy

      - name: Add target
        run: rustup target add "${{ matrix.target }}"

      - name: Cargo cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: pi_agent_rust -> target
          key: release-${{ needs.plan.outputs.commit }}-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --bin pi --target "${{ matrix.target }}"

      - name: Execute native release binary smoke test
        env:
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_RUNNER_OS: ${{ runner.os }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_RUNNER_OS" = "Windows" ]; then
            binary="target/${RELEASE_TARGET}/release/pi.exe"
          else
            binary="target/${RELEASE_TARGET}/release/pi"
          fi
          output="$("$binary" --version)"
          if command -v python3 >/dev/null 2>&1; then
            PYTHON=python3
          else
            PYTHON=python
          fi
          VERSION_OUTPUT="$output" "$PYTHON" - <<'PY'
          import datetime
          import os
          import re

          output = os.environ["VERSION_OUTPUT"]
          expected_version = os.environ["RELEASE_VERSION"]
          expected_commit = os.environ["RELEASE_COMMIT"]
          match = re.fullmatch(r"pi ([^ ]+) \(([0-9a-f]{40}) ([^)]+)\)", output)
          if match is None:
              raise SystemExit(f"native release binary returned malformed version output: {output!r}")
          version, commit, timestamp = match.groups()
          if version != expected_version or commit != expected_commit:
              raise SystemExit(
                  "native release identity differs from the frozen version/commit: "
                  f"version={version!r} commit={commit!r}"
              )
          try:
              parsed = datetime.datetime.fromisoformat(timestamp.replace("Z", "+00:00"))
          except ValueError as exc:
              raise SystemExit(f"native release build timestamp is not RFC 3339: {timestamp!r}") from exc
          if parsed.tzinfo is None:
              raise SystemExit("native release build timestamp must include an explicit UTC offset")
          PY
          printf '%s\n' "$output"

      - name: Revalidate source after build
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
          RELEASE_TAG_OID: ${{ needs.plan.outputs.tag_oid }}
          RELEASE_MAIN_COMMIT: ${{ needs.plan.outputs.main_commit }}
        run: |
          set -euo pipefail
          tag_ref="refs/tags/${RELEASE_TAG}"
          validation_tag_ref="refs/release-validation/post-build/tag/${RELEASE_TAG}"
          validation_main_ref="refs/release-validation/post-build/main"
          validation_master_ref="refs/release-validation/post-build/master"
          git fetch --no-tags --force origin \
            "${tag_ref}:${validation_tag_ref}" \
            "refs/heads/main:${validation_main_ref}" \
            "refs/heads/master:${validation_master_ref}"
          remote_tag_oid="$(git rev-parse "${validation_tag_ref}")"
          remote_commit="$(git rev-parse "${validation_tag_ref}^{commit}")"
          remote_main="$(git rev-parse "${validation_main_ref}^{commit}")"
          remote_master="$(git rev-parse "${validation_master_ref}^{commit}")"
          head_commit="$(git rev-parse 'HEAD^{commit}')"
          if [ "$remote_tag_oid" != "$RELEASE_TAG_OID" ] \
            || [ "$head_commit" != "$RELEASE_COMMIT" ] \
            || [ "$remote_commit" != "$RELEASE_COMMIT" ] \
            || [ "$RELEASE_COMMIT" != "$RELEASE_MAIN_COMMIT" ] \
            || [ "$remote_main" != "$remote_master" ]; then
            echo "::error::Release source or remote tag changed during the build"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$RELEASE_MAIN_COMMIT" "$remote_main"; then
            echo "::error::Frozen origin/main tip is no longer an ancestor of origin/main"
            exit 1
          fi
          if ! git diff --quiet HEAD -- || ! git diff --cached --quiet HEAD --; then
            echo "::error::Tracked worktree or index bytes changed during the release build"
            exit 1
          fi
          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "::error::Release build created unexpected untracked source-tree files"
            git ls-files --others --exclude-standard
            exit 1
          fi
          noncanonical_flags="$(git ls-files -v | grep -v '^H ' || true)"
          if [ -n "$noncanonical_flags" ]; then
            echo "::error::Release index contains hidden or noncanonical flags after build"
            printf '%s\n' "$noncanonical_flags"
            exit 1
          fi

          critical_paths=(
            Cargo.toml
            Cargo.lock
            rust-toolchain.toml
            LICENSE
            README.md
            install.sh
            docs/evidence/dropin-certification-verdict.json
            legacy_pi_mono_code/pi-mono/packages/ai/src/models.generated.ts
          )
          for path in "${critical_paths[@]}"; do
            head_entry="$(git ls-tree HEAD -- "$path")"
            index_entry="$(git ls-files --stage -- "$path")"
            read -r head_mode head_type head_oid head_path <<< "$head_entry"
            read -r index_mode index_oid index_stage index_path <<< "$index_entry"
            worktree_oid="$(git hash-object --no-filters -- "$path")"
            index_state="$(git ls-files -v -- "$path")"
            if [[ ! "$head_mode" =~ ^100(644|755)$ ]] \
              || [ "$head_type" != "blob" ] \
              || [ "$head_path" != "$path" ] \
              || [ "$index_mode" != "$head_mode" ] \
              || [ "$index_oid" != "$head_oid" ] \
              || [ "$index_stage" != "0" ] \
              || [ "$index_path" != "$path" ] \
              || [ "$worktree_oid" != "$head_oid" ] \
              || [ "$index_state" != "H $path" ]; then
              echo "::error::Critical release input differs from its committed blob: $path"
              exit 1
            fi
          done

      - name: Create tarball (Unix)
        if: runner.os != 'Windows'
        run: |
          set -euxo pipefail
          mkdir dist

          # RUNNER_TEMP is job-scoped, so staging never mutates the release checkout.
          STAGE_NAME="pi-${{ needs.plan.outputs.version }}-${{ matrix.target }}"
          STAGE_DIR="${RUNNER_TEMP}/${STAGE_NAME}"
          mkdir "$STAGE_DIR"
          cp "target/${{ matrix.target }}/release/pi" "$STAGE_DIR/"
          cp LICENSE README.md "$STAGE_DIR/"

          tar -C "$RUNNER_TEMP" -cJf "dist/${{ matrix.asset }}.tar.xz" "$STAGE_NAME"

      - name: Create zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path dist

          $stageName = "pi-${{ needs.plan.outputs.version }}-${{ matrix.target }}"
          $stageDir = Join-Path $env:RUNNER_TEMP $stageName
          New-Item -ItemType Directory -Path $stageDir
          Copy-Item "target/${{ matrix.target }}/release/pi.exe" "$stageDir/"
          Copy-Item "LICENSE" "$stageDir/"
          Copy-Item "README.md" "$stageDir/"

          Compress-Archive -Path "$stageDir" -DestinationPath "dist/${{ matrix.asset }}.zip"

      - name: Build manifest
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_ASSET: ${{ matrix.asset }}
          RELEASE_RUNNER_OS: ${{ runner.os }}
        run: |
          set -euo pipefail
          PI_AGENT_RUST_SHA="$(git rev-parse 'HEAD^{commit}')"
          if [ "$PI_AGENT_RUST_SHA" != "$RELEASE_COMMIT" ]; then
            echo "::error::Manifest source commit differs from the frozen release commit"
            exit 1
          fi
          CARGO_TOML_BLOB="$(git rev-parse 'HEAD:Cargo.toml')"
          CARGO_LOCK_BLOB="$(git rev-parse 'HEAD:Cargo.lock')"
          RUST_TOOLCHAIN_BLOB="$(git rev-parse 'HEAD:rust-toolchain.toml')"
          LICENSE_BLOB="$(git rev-parse 'HEAD:LICENSE')"
          README_BLOB="$(git rev-parse 'HEAD:README.md')"
          INSTALL_BLOB="$(git rev-parse 'HEAD:install.sh')"
          DROPIN_VERDICT_BLOB="$(git rev-parse 'HEAD:docs/evidence/dropin-certification-verdict.json')"
          MODELS_BLOB="$(git rev-parse 'HEAD:legacy_pi_mono_code/pi-mono/packages/ai/src/models.generated.ts')"
          RELEASE_RUSTC="$(rustc -Vv)"
          RELEASE_TOOLCHAIN="$(rustup show active-toolchain | awk '{print $1}')"
          export PI_AGENT_RUST_SHA CARGO_TOML_BLOB CARGO_LOCK_BLOB RUST_TOOLCHAIN_BLOB
          export LICENSE_BLOB README_BLOB INSTALL_BLOB DROPIN_VERDICT_BLOB
          export MODELS_BLOB RELEASE_RUSTC RELEASE_TOOLCHAIN
          if command -v python3 >/dev/null 2>&1; then
            PYTHON=python3
          else
            PYTHON=python
          fi
          "$PYTHON" - <<'PY'
          import json
          import hashlib
          import os
          import re
          import tomllib
          from pathlib import Path

          def digest(path):
              data = path.read_bytes()
              return {"name": path.name, "sha256": hashlib.sha256(data).hexdigest(), "size": len(data)}

          lock = tomllib.loads(Path("Cargo.lock").read_text(encoding="utf-8"))
          crates_io_source = "registry+https://github.com/rust-lang/crates.io-index"
          selected = []
          for package in lock["package"]:
              name = package["name"]
              if not (
                  name in {"asupersync", "rich_rust"}
                  or name.startswith("charmed-")
                  or name.startswith("sqlmodel-")
              ):
                  continue
              source = package.get("source")
              checksum = package.get("checksum")
              if source != crates_io_source:
                  raise SystemExit(f"expected crates.io source for {name}, got {source!r}")
              if not isinstance(checksum, str) or re.fullmatch(r"[0-9a-f]{64}", checksum) is None:
                  raise SystemExit(f"invalid crates.io checksum for {name}")
              selected.append(
                  {
                      "name": name,
                      "version": package["version"],
                      "source": source,
                      "checksum": checksum,
                  }
              )

          selected.sort(key=lambda package: (package["name"], package["version"]))
          selected_identities = [(package["name"], package["version"]) for package in selected]
          if len(selected_identities) != len(set(selected_identities)):
              raise SystemExit("selected locked package provenance contains duplicate identities")
          selected_names = {package["name"] for package in selected}
          required_names = {"asupersync", "rich_rust", "sqlmodel-core", "sqlmodel-sqlite"}
          if not required_names.issubset(selected_names):
              missing = sorted(required_names - selected_names)
              raise SystemExit(f"missing required locked package provenance: {missing}")

          toolchain = tomllib.loads(Path("rust-toolchain.toml").read_text(encoding="utf-8"))["toolchain"]
          expected_channel = toolchain["channel"]
          expected_active_toolchain = f"{expected_channel}-{os.environ['RELEASE_TARGET']}"
          if os.environ["RELEASE_TOOLCHAIN"] != expected_active_toolchain:
              raise SystemExit(
                  "active Rust toolchain "
                  f"{os.environ['RELEASE_TOOLCHAIN']!r} != {expected_active_toolchain!r}"
              )
          rustc_lines = os.environ["RELEASE_RUSTC"].splitlines()
          if not rustc_lines or not rustc_lines[0].startswith("rustc "):
              raise SystemExit("rustc -Vv did not start with an exact rustc version line")
          rustc_fields = {}
          for line in rustc_lines[1:]:
              if ": " not in line:
                  raise SystemExit(f"unexpected rustc -Vv metadata line: {line!r}")
              key, value = line.split(": ", 1)
              if key in rustc_fields or not value:
                  raise SystemExit(f"duplicate or empty rustc -Vv field: {key!r}")
              rustc_fields[key] = value
          required_rustc_fields = {"binary", "commit-hash", "commit-date", "host", "release", "LLVM version"}
          if set(rustc_fields) != required_rustc_fields:
              raise SystemExit(f"unexpected rustc -Vv field set: {sorted(rustc_fields)}")
          if rustc_fields["host"] != os.environ["RELEASE_TARGET"]:
              raise SystemExit("native release runner host does not equal the declared artifact target")

          is_windows = os.environ["RELEASE_RUNNER_OS"] == "Windows"
          archive = Path("dist") / (
              f"{os.environ['RELEASE_ASSET']}.zip"
              if is_windows
              else f"{os.environ['RELEASE_ASSET']}.tar.xz"
          )
          binary = Path("target") / os.environ["RELEASE_TARGET"] / "release" / (
              "pi.exe" if is_windows else "pi"
          )
          max_binary_bytes = 22 * 1024 * 1024
          binary_size = binary.stat().st_size
          if binary_size >= max_binary_bytes:
              raise SystemExit(
                  f"release binary is {binary_size} bytes; policy requires < {max_binary_bytes} bytes (22 MiB)"
              )
          manifest = {
              "schema": "pi.release.build_manifest.v1",
              "tag": os.environ["RELEASE_TAG"],
              "version": os.environ["RELEASE_VERSION"],
              "target": os.environ["RELEASE_TARGET"],
              "asset": os.environ["RELEASE_ASSET"],
              "runner_os": os.environ["RELEASE_RUNNER_OS"],
              "pi_agent_rust": os.environ["PI_AGENT_RUST_SHA"],
              "source_blobs": {
                  "cargo_toml": os.environ["CARGO_TOML_BLOB"],
                  "cargo_lock": os.environ["CARGO_LOCK_BLOB"],
                  "rust_toolchain": os.environ["RUST_TOOLCHAIN_BLOB"],
                  "license": os.environ["LICENSE_BLOB"],
                  "readme": os.environ["README_BLOB"],
                  "install": os.environ["INSTALL_BLOB"],
                  "dropin_verdict": os.environ["DROPIN_VERDICT_BLOB"],
                  "models_generated_ts": os.environ["MODELS_BLOB"],
              },
              "selected_locked_registry_packages": selected,
              "rustc": {
                  "toolchain_channel": expected_channel,
                  "version": rustc_lines[0],
                  "binary": rustc_fields["binary"],
                  "commit_hash": rustc_fields["commit-hash"],
                  "commit_date": rustc_fields["commit-date"],
                  "host": rustc_fields["host"],
                  "release": rustc_fields["release"],
                  "llvm_version": rustc_fields["LLVM version"],
              },
              "archive": digest(archive),
              "binary": digest(binary),
          }
          output = Path(f"dist/build-manifest-{os.environ['RELEASE_ASSET']}.json")
          output.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Verify build artifact pair
        env:
          RELEASE_ASSET: ${{ matrix.asset }}
          RELEASE_RUNNER_OS: ${{ runner.os }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_RUNNER_OS" = "Windows" ]; then
            archive="dist/${RELEASE_ASSET}.zip"
          else
            archive="dist/${RELEASE_ASSET}.tar.xz"
          fi
          manifest="dist/build-manifest-${RELEASE_ASSET}.json"
          for path in "$archive" "$manifest"; do
            if [ ! -f "$path" ] || [ -L "$path" ] || [ ! -s "$path" ]; then
              echo "::error::Missing, empty, or non-regular build artifact: $path"
              exit 1
            fi
          done
          if command -v python3 >/dev/null 2>&1; then
            PYTHON=python3
          else
            PYTHON=python
          fi
          ARCHIVE_PATH="$archive" MANIFEST_PATH="$manifest" "$PYTHON" - <<'PY'
          import os
          from pathlib import Path

          directory = Path("dist")
          expected = {
              Path(os.environ["ARCHIVE_PATH"]).name,
              Path(os.environ["MANIFEST_PATH"]).name,
          }
          entries = list(directory.iterdir()) if directory.is_dir() and not directory.is_symlink() else []
          actual = {entry.name for entry in entries}
          if len(entries) != 2 or actual != expected:
              raise SystemExit(
                  f"build leg produced {sorted(actual)!r}; expected exactly {sorted(expected)!r}"
              )
          PY

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-${{ matrix.target }}
          path: pi_agent_rust/dist/*
          if-no-files-found: error

  release:
    name: Prepare verified GitHub release draft
    needs: [plan, gate, installer_regression, build]
    if: always() && needs.plan.result == 'success' && needs.gate.result == 'success' && needs.installer_regression.result == 'success' && needs.build.result == 'success' && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Repository settings must require approval for this protected environment.
    environment:
      name: release
    permissions:
      contents: write
    outputs:
      release_state: ${{ steps.verify_release.outputs.release_state }}
    steps:
      - name: Checkout (for install script + changelog)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: pi_agent_rust
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.plan.outputs.commit }}

      - name: Verify frozen release source
        working-directory: pi_agent_rust
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
          RELEASE_TAG_OID: ${{ needs.plan.outputs.tag_oid }}
          RELEASE_MAIN_COMMIT: ${{ needs.plan.outputs.main_commit }}
        run: |
          set -euo pipefail
          tag_ref="refs/tags/${RELEASE_TAG}"
          validation_tag_ref="refs/release-validation/release/tag/${RELEASE_TAG}"
          validation_main_ref="refs/release-validation/release/main"
          validation_master_ref="refs/release-validation/release/master"
          for oid in "$RELEASE_COMMIT" "$RELEASE_TAG_OID" "$RELEASE_MAIN_COMMIT"; do
            if [[ ! "$oid" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Frozen release source contains an invalid Git object ID: $oid"
              exit 1
            fi
          done
          git fetch --no-tags --force origin \
            "${tag_ref}:${validation_tag_ref}" \
            "refs/heads/main:${validation_main_ref}" \
            "refs/heads/master:${validation_master_ref}"
          remote_tag_oid="$(git rev-parse "${validation_tag_ref}")"
          remote_commit="$(git rev-parse "${validation_tag_ref}^{commit}")"
          remote_main="$(git rev-parse "${validation_main_ref}^{commit}")"
          remote_master="$(git rev-parse "${validation_master_ref}^{commit}")"
          head_commit="$(git rev-parse 'HEAD^{commit}')"
          if [ "$remote_tag_oid" != "$RELEASE_TAG_OID" ] \
            || [ "$head_commit" != "$RELEASE_COMMIT" ] \
            || [ "$remote_commit" != "$RELEASE_COMMIT" ] \
            || [ "$RELEASE_COMMIT" != "$RELEASE_MAIN_COMMIT" ] \
            || [ "$remote_main" != "$remote_master" ]; then
            echo "::error::Frozen tag object, peeled commit, checkout, or main-tip binding changed"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$RELEASE_MAIN_COMMIT" "$remote_main"; then
            echo "::error::Frozen origin/main tip is no longer an ancestor of origin/main"
            exit 1
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: Verify exact release inventory and provenance
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import io
          import json
          import os
          import re
          import stat
          import struct
          import subprocess
          import tarfile
          import tomllib
          import zipfile
          from pathlib import Path

          root = Path("pi_agent_rust")
          dist = Path("dist")
          tag = os.environ["RELEASE_TAG"]
          version = os.environ["RELEASE_VERSION"]
          commit = os.environ["RELEASE_COMMIT"]

          def fail(message):
              raise SystemExit(message)

          def strict_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      fail(f"duplicate JSON object key: {key!r}")
                  result[key] = value
              return result

          def strict_json(path):
              try:
                  return json.loads(path.read_text(encoding="utf-8"), object_pairs_hook=strict_object)
              except (OSError, UnicodeError, json.JSONDecodeError) as exc:
                  fail(f"invalid JSON {path}: {exc}")

          def git(*args):
              completed = subprocess.run(
                  ["git", "-C", str(root), *args],
                  check=False,
                  capture_output=True,
                  text=True,
              )
              if completed.returncode != 0:
                  fail(f"git {' '.join(args)} failed: {completed.stderr.strip()}")
              return completed.stdout.strip()

          def sha256(data):
              return hashlib.sha256(data).hexdigest()

          def canonical_member(name):
              if "\\" in name or name.startswith("/"):
                  return False
              parts = name.split("/")
              return bool(parts) and all(part not in {"", ".", ".."} for part in parts)

          def validate_binary(data, target):
              if target.endswith("linux-gnu"):
                  if len(data) < 20 or data[:5] != b"\x7fELF\x02" or data[5] != 1:
                      fail(f"{target} binary is not a 64-bit little-endian ELF image")
                  expected_machine = 0x3E if target.startswith("x86_64") else 0xB7
                  if struct.unpack_from("<H", data, 18)[0] != expected_machine:
                      fail(f"{target} ELF machine does not match the declared target")
              elif target.endswith("apple-darwin"):
                  if len(data) < 8 or data[:4] != b"\xcf\xfa\xed\xfe":
                      fail(f"{target} binary is not a little-endian Mach-O 64 image")
                  expected_cpu = 0x01000007 if target.startswith("x86_64") else 0x0100000C
                  if struct.unpack_from("<I", data, 4)[0] != expected_cpu:
                      fail(f"{target} Mach-O CPU type does not match the declared target")
              elif target.endswith("windows-msvc"):
                  if len(data) < 64 or data[:2] != b"MZ":
                      fail("Windows binary has no DOS/PE header")
                  pe_offset = struct.unpack_from("<I", data, 0x3C)[0]
                  if pe_offset + 6 > len(data) or data[pe_offset:pe_offset + 4] != b"PE\0\0":
                      fail("Windows binary has an invalid PE header offset")
                  if struct.unpack_from("<H", data, pe_offset + 4)[0] != 0x8664:
                      fail("Windows PE machine is not x86_64")
              else:
                  fail(f"unsupported release target: {target}")

          def archive_binary(archive_path, target):
              root_name = f"pi-{version}-{target}"
              binary_name = "pi.exe" if target.endswith("windows-msvc") else "pi"
              expected_files = {
                  f"{root_name}/{binary_name}",
                  f"{root_name}/LICENSE",
                  f"{root_name}/README.md",
              }
              if archive_path.suffix == ".zip":
                  try:
                      with zipfile.ZipFile(archive_path) as archive:
                          infos = archive.infolist()
                          names = [info.filename.rstrip("/") for info in infos]
                          if len(names) != len(set(names)):
                              fail(f"archive contains duplicate paths: {archive_path}")
                          files = set()
                          directories = set()
                          for info, name in zip(infos, names, strict=True):
                              if not canonical_member(name) or info.flag_bits & 0x1:
                                  fail(f"archive contains unsafe/encrypted path: {info.filename!r}")
                              mode = info.external_attr >> 16
                              if stat.S_ISLNK(mode):
                                  fail(f"archive contains a symlink: {info.filename!r}")
                              (directories if info.is_dir() else files).add(name)
                          if files != expected_files or directories not in ({root_name}, set()):
                              fail(f"archive layout mismatch: {archive_path}")
                          if archive.read(f"{root_name}/LICENSE") != (root / "LICENSE").read_bytes() \
                              or archive.read(f"{root_name}/README.md") != (root / "README.md").read_bytes():
                              fail(f"archive documentation bytes differ from frozen source: {archive_path}")
                          return archive.read(f"{root_name}/{binary_name}")
                  except (OSError, zipfile.BadZipFile) as exc:
                      fail(f"invalid zip archive {archive_path}: {exc}")
              try:
                  with tarfile.open(archive_path, mode="r:xz") as archive:
                      members = archive.getmembers()
                      names = [member.name.rstrip("/") for member in members]
                      if len(names) != len(set(names)):
                          fail(f"archive contains duplicate paths: {archive_path}")
                      files = set()
                      directories = set()
                      binary = None
                      license_bytes = None
                      readme_bytes = None
                      for member, name in zip(members, names, strict=True):
                          if not canonical_member(name) or member.issym() or member.islnk():
                              fail(f"archive contains unsafe link/path: {member.name!r}")
                          if member.isdir():
                              directories.add(name)
                          elif member.isreg():
                              files.add(name)
                              if name == f"{root_name}/{binary_name}":
                                  if member.mode & 0o111 == 0:
                                      fail(f"Unix binary is not executable in archive: {archive_path}")
                                  extracted = archive.extractfile(member)
                                  if extracted is None:
                                      fail(f"could not read binary from {archive_path}")
                                  binary = extracted.read()
                              elif name == f"{root_name}/LICENSE":
                                  extracted = archive.extractfile(member)
                                  license_bytes = None if extracted is None else extracted.read()
                              elif name == f"{root_name}/README.md":
                                  extracted = archive.extractfile(member)
                                  readme_bytes = None if extracted is None else extracted.read()
                          else:
                              fail(f"archive contains a non-file/non-directory entry: {member.name!r}")
                      if files != expected_files or directories not in ({root_name}, set()) or binary is None:
                          fail(f"archive layout mismatch: {archive_path}")
                      if license_bytes != (root / "LICENSE").read_bytes() \
                          or readme_bytes != (root / "README.md").read_bytes():
                          fail(f"archive documentation bytes differ from frozen source: {archive_path}")
                      return binary
              except (OSError, tarfile.TarError) as exc:
                  fail(f"invalid tar archive {archive_path}: {exc}")

          if re.fullmatch(r"[0-9a-f]{40}", commit) is None or git("rev-parse", "HEAD^{commit}") != commit:
              fail("final release checkout differs from the frozen full commit ID")
          release_support_paths = {
              "LICENSE",
              "README.md",
              "install.sh",
              "docs/evidence/dropin-certification-verdict.json",
          }
          for relative in release_support_paths:
              path = root / relative
              if path.is_symlink() or not path.is_file():
                  fail(f"release support path is missing/non-regular: {relative}")
              completed = subprocess.run(
                  ["git", "hash-object", "--no-filters", "--", relative],
                  cwd=root,
                  check=False,
                  capture_output=True,
                  text=True,
              )
              if completed.returncode != 0 or completed.stdout.strip() != git(
                  "rev-parse", f"HEAD:{relative}"
              ):
                  fail(f"release support bytes differ from frozen HEAD: {relative}")
          source_blobs = {
              "cargo_toml": git("rev-parse", "HEAD:Cargo.toml"),
              "cargo_lock": git("rev-parse", "HEAD:Cargo.lock"),
              "rust_toolchain": git("rev-parse", "HEAD:rust-toolchain.toml"),
              "license": git("rev-parse", "HEAD:LICENSE"),
              "readme": git("rev-parse", "HEAD:README.md"),
              "install": git("rev-parse", "HEAD:install.sh"),
              "dropin_verdict": git(
                  "rev-parse", "HEAD:docs/evidence/dropin-certification-verdict.json"
              ),
              "models_generated_ts": git(
                  "rev-parse", "HEAD:legacy_pi_mono_code/pi-mono/packages/ai/src/models.generated.ts"
              ),
          }
          expected_toolchain = tomllib.loads(
              (root / "rust-toolchain.toml").read_text(encoding="utf-8")
          )["toolchain"]["channel"]
          specs = {
              "pi-linux-amd64": ("x86_64-unknown-linux-gnu", "Linux", ".tar.xz"),
              "pi-linux-arm64": ("aarch64-unknown-linux-gnu", "Linux", ".tar.xz"),
              "pi-darwin-amd64": ("x86_64-apple-darwin", "macOS", ".tar.xz"),
              "pi-darwin-arm64": ("aarch64-apple-darwin", "macOS", ".tar.xz"),
              "pi-windows-amd64": ("x86_64-pc-windows-msvc", "Windows", ".zip"),
          }
          expected_names = {
              *(asset + suffix for asset, (_, _, suffix) in specs.items()),
              *(f"build-manifest-{asset}.json" for asset in specs),
          }
          if not dist.is_dir() or dist.is_symlink():
              fail("downloaded artifact directory is missing or is a symlink")
          entries = list(dist.iterdir())
          actual_names = {entry.name for entry in entries}
          if len(entries) != len(actual_names) or actual_names != expected_names:
              fail(f"release inventory mismatch: expected={sorted(expected_names)}, actual={sorted(actual_names)}")
          for entry in entries:
              if entry.is_symlink() or not entry.is_file() or entry.stat().st_size == 0:
                  fail(f"release inventory entry must be a non-empty regular file: {entry}")

          lock = tomllib.loads((root / "Cargo.lock").read_text(encoding="utf-8"))
          crates_io_source = "registry+https://github.com/rust-lang/crates.io-index"
          selected = []
          for package in lock["package"]:
              name = package["name"]
              if not (name in {"asupersync", "rich_rust"} or name.startswith("charmed-") or name.startswith("sqlmodel-")):
                  continue
              source = package.get("source")
              checksum = package.get("checksum")
              if source != crates_io_source or not isinstance(checksum, str) or re.fullmatch(r"[0-9a-f]{64}", checksum) is None:
                  fail(f"invalid registry provenance for locked package {name}")
              selected.append({"name": name, "version": package["version"], "source": source, "checksum": checksum})
          selected.sort(key=lambda package: (package["name"], package["version"]))
          identities = [(package["name"], package["version"]) for package in selected]
          required = {"asupersync", "rich_rust", "sqlmodel-core", "sqlmodel-sqlite"}
          if len(identities) != len(set(identities)) or not required.issubset({name for name, _ in identities}):
              fail("selected locked package provenance is duplicate or incomplete")

          manifest_keys = {
              "schema", "tag", "version", "target", "asset", "runner_os",
              "pi_agent_rust", "source_blobs", "selected_locked_registry_packages",
              "rustc", "archive", "binary",
          }
          rustc_keys = {
              "toolchain_channel", "version", "binary", "commit_hash", "commit_date",
              "host", "release", "llvm_version",
          }
          common_rustc = None
          for asset, (target, runner_os, suffix) in specs.items():
              manifest_path = dist / f"build-manifest-{asset}.json"
              manifest = strict_json(manifest_path)
              if not isinstance(manifest, dict) or set(manifest) != manifest_keys:
                  fail(f"build manifest has an unexpected schema: {manifest_path}")
              expected_fields = {
                  "schema": "pi.release.build_manifest.v1", "tag": tag, "version": version,
                  "target": target, "asset": asset, "runner_os": runner_os,
                  "pi_agent_rust": commit, "source_blobs": source_blobs,
                  "selected_locked_registry_packages": selected,
              }
              for field, expected in expected_fields.items():
                  if manifest.get(field) != expected:
                      fail(f"{manifest_path} field {field} differs from frozen release source")
              rustc = manifest.get("rustc")
              if not isinstance(rustc, dict) or set(rustc) != rustc_keys:
                  fail(f"{manifest_path} has an unexpected rustc schema")
              if rustc["toolchain_channel"] != expected_toolchain or rustc["host"] != target:
                  fail(f"{manifest_path} rustc toolchain/host does not match the frozen target")
              for key, value in rustc.items():
                  if not isinstance(value, str) or not value:
                      fail(f"{manifest_path} rustc field {key} is empty or non-string")
              identity = tuple(rustc[key] for key in sorted(rustc_keys - {"host"}))
              if common_rustc is None:
                  common_rustc = identity
              elif identity != common_rustc:
                  fail("release targets were not built with one exact Rust compiler identity")

              archive_path = dist / f"{asset}{suffix}"
              archive_bytes = archive_path.read_bytes()
              expected_archive = {"name": archive_path.name, "sha256": sha256(archive_bytes), "size": len(archive_bytes)}
              if manifest.get("archive") != expected_archive:
                  fail(f"{manifest_path} archive digest/size binding failed")
              binary_bytes = archive_binary(archive_path, target)
              binary_name = "pi.exe" if runner_os == "Windows" else "pi"
              expected_binary = {"name": binary_name, "sha256": sha256(binary_bytes), "size": len(binary_bytes)}
              if manifest.get("binary") != expected_binary:
                  fail(f"{manifest_path} extracted binary digest/size binding failed")
              if len(binary_bytes) >= 22 * 1024 * 1024:
                  fail(f"{manifest_path} binary violates the <22 MiB release budget")
              validate_binary(binary_bytes, target)
          print("Verified exact five-platform inventory, strict manifests, archives, binaries, and compiler provenance")
          PY

      - name: Prepare release directory
        run: |
          set -euxo pipefail
          mkdir release

          # Copy archives and manifests
          for f in dist/*; do
            [ -f "$f" ] && cp "$f" release/
          done

          # Include install script
          if [ ! -f pi_agent_rust/install.sh ] || [ -L pi_agent_rust/install.sh ]; then
            echo "::error::Frozen install.sh is missing, non-regular, or a symlink"
            exit 1
          fi
          cp pi_agent_rust/install.sh release/
          cmp --silent pi_agent_rust/install.sh release/install.sh

          ls -lah release/

      - name: Generate SHA256SUMS
        run: |
          set -euxo pipefail
          cd release
          # Stable ordering for reproducible checksums file.
          find . -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort | while read -r f; do
            [ "$f" = "SHA256SUMS" ] && continue
            sha256sum "$f"
          done > SHA256SUMS
          cat SHA256SUMS
          if [ "$(wc -l < SHA256SUMS)" -ne 11 ]; then
            echo "::error::SHA256SUMS must bind exactly the other 11 public assets"
            exit 1
          fi
          sha256sum --check --strict SHA256SUMS

      - name: Build release notes
        run: |
          set -euxo pipefail
          TAG="${{ needs.plan.outputs.tag }}"
          CHANGELOG="pi_agent_rust/CHANGELOG.md"

          # Extract only the exact `## [vX.Y.Z] ...` heading and its body.
          CHANGELOG="$CHANGELOG" TAG="$TAG" python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          lines = Path(os.environ["CHANGELOG"]).read_text(encoding="utf-8").splitlines()
          heading = re.compile(r"^##\s+\[([^]]+)](?:\s|$)")
          start = None
          end = len(lines)
          for index, line in enumerate(lines):
              match = heading.match(line)
              if start is None and match is not None and match.group(1) == os.environ["TAG"]:
                  start = index
              elif start is not None and line.startswith("## "):
                  end = index
                  break
          body = "" if start is None else "\n".join(lines[start:end]).rstrip() + "\n"
          Path("RELEASE_BODY.md").write_text(body, encoding="utf-8")
          PY

          if [ ! -s RELEASE_BODY.md ]; then
            echo "## $TAG" > RELEASE_BODY.md
            echo "" >> RELEASE_BODY.md
          fi

          # Every release must disclose the strict drop-in claim status. A
          # missing verdict is allowed for an ordinary early-development
          # release, but is represented honestly as NOT_CERTIFIED.
          DROPIN_VERDICT_PATH="pi_agent_rust/docs/evidence/dropin-certification-verdict.json"
          DROPIN_STATUS="$(python3 - "$DROPIN_VERDICT_PATH" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          if not path.is_file():
              print("NOT_CERTIFIED")
              raise SystemExit(0)

          payload = json.loads(path.read_text(encoding="utf-8"))
          if not isinstance(payload, dict):
              raise SystemExit("drop-in certification verdict root must be an object")
          if payload.get("schema") != "pi.dropin.certification_verdict.v1":
              raise SystemExit("unsupported drop-in certification verdict schema")
          verdict = payload.get("overall_verdict")
          if verdict not in {"CERTIFIED", "NOT_CERTIFIED"}:
              raise SystemExit(f"invalid drop-in certification verdict: {verdict!r}")
          print(verdict)
          PY
          )"
          if [ "$DROPIN_STATUS" = "CERTIFIED" ]; then
            DROPIN_COPY="The committed release-source evidence satisfies the strict drop-in certification contract."
          else
            DROPIN_COPY="This release must not be described as a strict drop-in replacement."
          fi
          cat >> RELEASE_BODY.md <<EOF

          ### Drop-in certification status

          **${DROPIN_STATUS}** — ${DROPIN_COPY}

          Evidence: [drop-in certification verdict](https://github.com/Dicklesworthstone/pi_agent_rust/blob/${TAG}/docs/evidence/dropin-certification-verdict.json)
          EOF

          # Append install instructions
          cat >> RELEASE_BODY.md <<'INSTALL'

          ---

          ### Quick Install

          ```bash
          curl -fsSL https://raw.githubusercontent.com/Dicklesworthstone/pi_agent_rust/TAG_PLACEHOLDER/install.sh | bash -s -- --version TAG_PLACEHOLDER
          ```

          ### Manual Install

          Download the archive for your platform, extract, and place `pi` on your `PATH`:

          | Platform | Archive |
          |----------|---------|
          | Linux x86_64 | `pi-linux-amd64.tar.xz` |
          | Linux ARM64 | `pi-linux-arm64.tar.xz` |
          | macOS x86_64 | `pi-darwin-amd64.tar.xz` |
          | macOS ARM64 (Apple Silicon) | `pi-darwin-arm64.tar.xz` |
          | Windows x86_64 | `pi-windows-amd64.zip` |

          All archives include SHA256 checksums in `SHA256SUMS` for verification.
          INSTALL

          # Pin both script bytes and requested artifact version to this tag.
          sed -i "s/TAG_PLACEHOLDER/$TAG/g" RELEASE_BODY.md

      - name: Inspect or reconcile GitHub draft
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
          RELEASE_PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          MAX_API_RESPONSE_BYTES = 2 * 1024 * 1024

          def strict_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise SystemExit(f"duplicate GitHub API JSON key: {key!r}")
                  result[key] = value
              return result

          def load_api_json(response, label):
              body = response.read(MAX_API_RESPONSE_BYTES + 1)
              if len(body) > MAX_API_RESPONSE_BYTES:
                  raise SystemExit(f"{label} exceeds 2 MiB")
              return json.loads(body, object_pairs_hook=strict_object)

          expected_names = {
              "pi-linux-amd64.tar.xz", "pi-linux-arm64.tar.xz",
              "pi-darwin-amd64.tar.xz", "pi-darwin-arm64.tar.xz",
              "pi-windows-amd64.zip", "install.sh", "SHA256SUMS",
              "build-manifest-pi-linux-amd64.json",
              "build-manifest-pi-linux-arm64.json",
              "build-manifest-pi-darwin-amd64.json",
              "build-manifest-pi-darwin-arm64.json",
              "build-manifest-pi-windows-amd64.json",
          }
          release_dir = Path("release")
          entries = list(release_dir.iterdir()) if release_dir.is_dir() and not release_dir.is_symlink() else []
          actual_names = {entry.name for entry in entries}
          if len(entries) != len(actual_names) or actual_names != expected_names:
              raise SystemExit(f"local public asset inventory mismatch: {sorted(actual_names)}")
          local = {}
          for entry in entries:
              if entry.is_symlink() or not entry.is_file() or entry.stat().st_size == 0:
                  raise SystemExit(f"invalid local public asset: {entry}")
              data = entry.read_bytes()
              local[entry.name] = (len(data), hashlib.sha256(data).hexdigest())
          expected_body = Path("RELEASE_BODY.md").read_text(encoding="utf-8")
          expected_prerelease = os.environ["RELEASE_PRERELEASE"] == "true"

          api = os.environ["GITHUB_API_URL"]
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          tag = os.environ["RELEASE_TAG"]
          commit = os.environ["RELEASE_COMMIT"]

          api_url = urllib.parse.urlparse(api)
          api_origin = (api_url.scheme.lower(), (api_url.hostname or "").lower(), api_url.port or 443)
          storage_hosts = {
              "objects.githubusercontent.com",
              "release-assets.githubusercontent.com",
              "github-releases.githubusercontent.com",
          }
          if api_origin[0] != "https" or not api_origin[1]:
              raise SystemExit("GITHUB_API_URL must use a valid HTTPS origin")

          class SafeGitHubRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  absolute = urllib.parse.urljoin(req.full_url, newurl)
                  target = urllib.parse.urlparse(absolute)
                  target_origin = (
                      target.scheme.lower(), (target.hostname or "").lower(), target.port or 443
                  )
                  if target_origin[0] != "https" or (
                      target_origin != api_origin
                      and not (target_origin[1] in storage_hosts and target_origin[2] == 443)
                  ):
                      raise urllib.error.HTTPError(
                          absolute, code, "refusing untrusted GitHub asset redirect", headers, fp
                      )
                  redirected = super().redirect_request(req, fp, code, msg, headers, absolute)
                  if redirected is not None and target_origin != api_origin:
                      redirected.remove_header("Authorization")
                      for mapping in (redirected.headers, redirected.unredirected_hdrs):
                          for key in list(mapping):
                              if key.lower() == "authorization":
                                  del mapping[key]
                  return redirected

          opener = urllib.request.build_opener(SafeGitHubRedirect())

          def request(url, accept="application/vnd.github+json", timeout=30):
              parsed = urllib.parse.urlparse(url)
              request_origin = (
                  parsed.scheme.lower(), (parsed.hostname or "").lower(), parsed.port or 443
              )
              if request_origin != api_origin:
                  raise SystemExit(f"refusing non-API GitHub request URL: {url!r}")
              req = urllib.request.Request(
                  url,
                  headers={
                      "Accept": accept,
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "pi-agent-rust-release-verifier",
                  },
              )
              return opener.open(req, timeout=timeout)

          endpoint = f"{api}/repos/{repo}/releases/tags/{urllib.parse.quote(tag, safe='')}"
          try:
              with request(endpoint) as response:
                  release = load_api_json(response, "GitHub release response")
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  print("No existing release; a new draft will be created")
                  with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                      output.write("release_state=absent\nupload_needed=true\n")
                      output.write("missing_files<<PI_RELEASE_FILES\n")
                      for name in sorted(expected_names):
                          output.write(f"release/{name}\n")
                      output.write("PI_RELEASE_FILES\n")
                  raise SystemExit(0)
              raise

          if not isinstance(release, dict) \
              or type(release.get("id")) is not int \
              or release.get("id", 0) < 1 \
              or release.get("tag_name") != tag \
              or release.get("target_commitish") != commit \
              or release.get("name") != tag \
              or release.get("body") != expected_body \
              or release.get("prerelease") is not expected_prerelease \
              or type(release.get("draft")) is not bool:
              raise SystemExit("existing release metadata differs from the frozen exact release")
          with request(f"{release['assets_url']}?per_page=100") as response:
              assets = load_api_json(response, "GitHub release assets response")
          if not isinstance(assets, list) \
              or any(not isinstance(asset, dict) for asset in assets) \
              or any(not isinstance(asset.get("name"), str) for asset in assets):
              raise SystemExit("existing release asset response is malformed")
          remote_names = [asset.get("name") for asset in assets]
          if len(remote_names) != len(set(remote_names)):
              raise SystemExit("existing release contains duplicate asset names")
          extras = set(remote_names) - expected_names
          if extras:
              raise SystemExit(f"existing release contains unexpected assets: {sorted(extras)}")
          for asset in assets:
              name = asset["name"]
              expected_size = local[name][0]
              if type(asset.get("size")) is not int or asset.get("size") < 0 \
                  or not isinstance(asset.get("url"), str):
                  raise SystemExit(f"existing release asset metadata is malformed: {name}")
              with request(asset["url"], "application/octet-stream", timeout=60) as response:
                  data = response.read(expected_size + 1)
              if (len(data), hashlib.sha256(data).hexdigest()) != local[name]:
                  raise SystemExit(f"existing release asset bytes differ: {name}")
              if asset.get("size") != len(data):
                  raise SystemExit(f"existing release asset API size differs: {name}")
          missing = expected_names - set(remote_names)
          release_state = "draft" if release["draft"] else "public"
          if release_state == "public" and missing:
              raise SystemExit("existing public release is incomplete; refusing to mutate public assets")
          upload_needed = "true" if missing else "false"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"release_state={release_state}\nupload_needed={upload_needed}\n")
              output.write("missing_files<<PI_RELEASE_FILES\n")
              for name in sorted(missing):
                  output.write(f"release/{name}\n")
              output.write("PI_RELEASE_FILES\n")
          print(f"Reconciled existing {release_state} release; {len(missing)} assets remain")
          PY

      - name: Revalidate frozen source before draft creation
        working-directory: pi_agent_rust
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
          RELEASE_TAG_OID: ${{ needs.plan.outputs.tag_oid }}
          RELEASE_MAIN_COMMIT: ${{ needs.plan.outputs.main_commit }}
        run: |
          set -euo pipefail
          tag_ref="refs/tags/${RELEASE_TAG}"
          validation_tag_ref="refs/release-validation/pre-draft/tag/${RELEASE_TAG}"
          validation_main_ref="refs/release-validation/pre-draft/main"
          validation_master_ref="refs/release-validation/pre-draft/master"
          git fetch --no-tags --force origin \
            "${tag_ref}:${validation_tag_ref}" \
            "refs/heads/main:${validation_main_ref}" \
            "refs/heads/master:${validation_master_ref}"
          remote_tag_oid="$(git rev-parse "${validation_tag_ref}")"
          remote_commit="$(git rev-parse "${validation_tag_ref}^{commit}")"
          remote_main="$(git rev-parse "${validation_main_ref}^{commit}")"
          remote_master="$(git rev-parse "${validation_master_ref}^{commit}")"
          head_commit="$(git rev-parse 'HEAD^{commit}')"
          if [ "$remote_tag_oid" != "$RELEASE_TAG_OID" ] \
            || [ "$head_commit" != "$RELEASE_COMMIT" ] \
            || [ "$remote_commit" != "$RELEASE_COMMIT" ] \
            || [ "$RELEASE_COMMIT" != "$RELEASE_MAIN_COMMIT" ] \
            || [ "$remote_main" != "$remote_master" ] \
            || ! git merge-base --is-ancestor "$RELEASE_MAIN_COMMIT" "$remote_main"; then
            echo "::error::Frozen release source changed before draft creation"
            exit 1
          fi

      - name: Create or complete GitHub draft
        if: steps.draft.outputs.upload_needed == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          name: ${{ needs.plan.outputs.tag }}
          prerelease: ${{ needs.plan.outputs.prerelease == 'true' }}
          draft: true
          target_commitish: ${{ needs.plan.outputs.commit }}
          overwrite_files: false
          fail_on_unmatched_files: true
          body_path: RELEASE_BODY.md
          files: ${{ steps.draft.outputs.missing_files }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify exact GitHub release assets and state
        id: verify_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
          RELEASE_PRERELEASE: ${{ needs.plan.outputs.prerelease }}
          PRIOR_RELEASE_STATE: ${{ steps.draft.outputs.release_state }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          MAX_API_RESPONSE_BYTES = 2 * 1024 * 1024

          def strict_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise SystemExit(f"duplicate GitHub API JSON key: {key!r}")
                  result[key] = value
              return result

          def load_api_json(response, label):
              body = response.read(MAX_API_RESPONSE_BYTES + 1)
              if len(body) > MAX_API_RESPONSE_BYTES:
                  raise SystemExit(f"{label} exceeds 2 MiB")
              return json.loads(body, object_pairs_hook=strict_object)

          local = {}
          for path in Path("release").iterdir():
              data = path.read_bytes()
              local[path.name] = (len(data), hashlib.sha256(data).hexdigest())
          expected_body = Path("RELEASE_BODY.md").read_text(encoding="utf-8")
          headers = {
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "pi-agent-rust-release-verifier",
          }
          api_url = urllib.parse.urlparse(os.environ["GITHUB_API_URL"])
          api_origin = (api_url.scheme.lower(), (api_url.hostname or "").lower(), api_url.port or 443)
          storage_hosts = {
              "objects.githubusercontent.com",
              "release-assets.githubusercontent.com",
              "github-releases.githubusercontent.com",
          }
          if api_origin[0] != "https" or not api_origin[1]:
              raise SystemExit("GITHUB_API_URL must use a valid HTTPS origin")

          class SafeGitHubRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, response_headers, newurl):
                  absolute = urllib.parse.urljoin(req.full_url, newurl)
                  target = urllib.parse.urlparse(absolute)
                  target_origin = (
                      target.scheme.lower(), (target.hostname or "").lower(), target.port or 443
                  )
                  if target_origin[0] != "https" or (
                      target_origin != api_origin
                      and not (target_origin[1] in storage_hosts and target_origin[2] == 443)
                  ):
                      raise urllib.error.HTTPError(
                          absolute, code, "refusing untrusted GitHub asset redirect", response_headers, fp
                      )
                  redirected = super().redirect_request(
                      req, fp, code, msg, response_headers, absolute
                  )
                  if redirected is not None and target_origin != api_origin:
                      redirected.remove_header("Authorization")
                      for mapping in (redirected.headers, redirected.unredirected_hdrs):
                          for key in list(mapping):
                              if key.lower() == "authorization":
                                  del mapping[key]
                  return redirected

          opener = urllib.request.build_opener(SafeGitHubRedirect())

          def api_request(url, accept, timeout=30):
              parsed = urllib.parse.urlparse(url)
              request_origin = (
                  parsed.scheme.lower(), (parsed.hostname or "").lower(), parsed.port or 443
              )
              if request_origin != api_origin:
                  raise SystemExit(f"refusing non-API GitHub request URL: {url!r}")
              return opener.open(
                  urllib.request.Request(url, headers={**headers, "Accept": accept}), timeout=timeout
              )

          endpoint = (
              f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/releases/tags/"
              f"{urllib.parse.quote(os.environ['RELEASE_TAG'], safe='')}"
          )
          with api_request(endpoint, "application/vnd.github+json") as response:
              release = load_api_json(response, "GitHub release response")
          if not isinstance(release, dict):
              raise SystemExit("GitHub release response is not an object")
          expected_state = "public" if os.environ["PRIOR_RELEASE_STATE"] == "public" else "draft"
          actual_state = "draft" if release.get("draft") is True else "public"
          if type(release.get("id")) is not int \
              or release.get("id", 0) < 1 \
              or type(release.get("draft")) is not bool \
              or actual_state != expected_state \
              or release.get("tag_name") != os.environ["RELEASE_TAG"] \
              or release.get("name") != os.environ["RELEASE_TAG"] \
              or release.get("target_commitish") != os.environ["RELEASE_COMMIT"] \
              or release.get("prerelease") is not (os.environ["RELEASE_PRERELEASE"] == "true") \
              or release.get("body") != expected_body:
              raise SystemExit("release state or metadata differs from the frozen exact release")
          with api_request(f"{release['assets_url']}?per_page=100", "application/vnd.github+json") as response:
              assets = load_api_json(response, "GitHub release assets response")
          if not isinstance(assets, list) \
              or any(not isinstance(asset, dict) for asset in assets) \
              or any(not isinstance(asset.get("name"), str) for asset in assets):
              raise SystemExit("release assets response is malformed")
          names = [asset.get("name") for asset in assets]
          if len(names) != len(set(names)) or set(names) != set(local) or len(names) != 12:
              raise SystemExit(f"draft does not contain the exact 12 public assets: {sorted(names)}")
          for asset in assets:
              expected_size = local[asset["name"]][0]
              if type(asset.get("size")) is not int or asset.get("size") < 0 \
                  or not isinstance(asset.get("url"), str):
                  raise SystemExit(f"release asset metadata is malformed: {asset['name']}")
              with api_request(asset["url"], "application/octet-stream", timeout=60) as response:
                  data = response.read(expected_size + 1)
              if (len(data), hashlib.sha256(data).hexdigest()) != local[asset["name"]] or asset.get("size") != len(data):
                  raise SystemExit(f"draft asset bytes/size differ: {asset['name']}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"release_id={release['id']}\nrelease_state={actual_state}\n")
          print(f"Verified exact 12-asset {actual_state} release inventory, metadata, and bytes")
          PY

      - name: Revalidate frozen source before draft handoff
        working-directory: pi_agent_rust
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
          RELEASE_TAG_OID: ${{ needs.plan.outputs.tag_oid }}
          RELEASE_MAIN_COMMIT: ${{ needs.plan.outputs.main_commit }}
        run: |
          set -euo pipefail
          validation_tag_ref="refs/release-validation/pre-publication/tag/${RELEASE_TAG}"
          validation_main_ref="refs/release-validation/pre-publication/main"
          validation_master_ref="refs/release-validation/pre-publication/master"
          git fetch --no-tags --force origin \
            "refs/tags/${RELEASE_TAG}:${validation_tag_ref}" \
            "refs/heads/main:${validation_main_ref}" \
            "refs/heads/master:${validation_master_ref}"
          remote_tag_oid="$(git rev-parse "${validation_tag_ref}")"
          remote_commit="$(git rev-parse "${validation_tag_ref}^{commit}")"
          remote_main="$(git rev-parse "${validation_main_ref}^{commit}")"
          remote_master="$(git rev-parse "${validation_master_ref}^{commit}")"
          if [ "$remote_tag_oid" != "$RELEASE_TAG_OID" ] \
            || [ "$(git rev-parse 'HEAD^{commit}')" != "$RELEASE_COMMIT" ] \
            || [ "$remote_commit" != "$RELEASE_COMMIT" ] \
            || [ "$RELEASE_COMMIT" != "$RELEASE_MAIN_COMMIT" ] \
            || [ "$remote_main" != "$remote_master" ] \
            || ! git merge-base --is-ancestor "$RELEASE_MAIN_COMMIT" "$remote_main"; then
            echo "::error::Frozen release source changed before draft handoff"
            exit 1
          fi

      - name: Upload verified draft publication inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-publication-inputs-${{ needs.plan.outputs.tag }}
          path: |
            release
            RELEASE_BODY.md
          if-no-files-found: error
          retention-days: 1

      - name: Confirm verified release state remains unchanged
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
          RELEASE_ID: ${{ steps.verify_release.outputs.release_id }}
          RELEASE_STATE: ${{ steps.verify_release.outputs.release_state }}
          RELEASE_PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          MAX_API_RESPONSE_BYTES = 2 * 1024 * 1024

          def strict_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise SystemExit(f"duplicate GitHub API JSON key: {key!r}")
                  result[key] = value
              return result

          def load_api_json(response, label):
              body = response.read(MAX_API_RESPONSE_BYTES + 1)
              if len(body) > MAX_API_RESPONSE_BYTES:
                  raise SystemExit(f"{label} exceeds 2 MiB")
              return json.loads(body, object_pairs_hook=strict_object)

          local = {path.name: (path.stat().st_size, hashlib.sha256(path.read_bytes()).hexdigest()) for path in Path("release").iterdir()}
          expected_body = Path("RELEASE_BODY.md").read_text(encoding="utf-8")
          headers = {
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "pi-agent-rust-release-verifier",
          }
          api_url = urllib.parse.urlparse(os.environ["GITHUB_API_URL"])
          api_origin = (api_url.scheme.lower(), (api_url.hostname or "").lower(), api_url.port or 443)
          storage_hosts = {
              "objects.githubusercontent.com",
              "release-assets.githubusercontent.com",
              "github-releases.githubusercontent.com",
          }
          if api_origin[0] != "https" or not api_origin[1]:
              raise SystemExit("GITHUB_API_URL must use a valid HTTPS origin")

          class SafeGitHubRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, response_headers, newurl):
                  absolute = urllib.parse.urljoin(req.full_url, newurl)
                  target = urllib.parse.urlparse(absolute)
                  target_origin = (
                      target.scheme.lower(), (target.hostname or "").lower(), target.port or 443
                  )
                  if target_origin[0] != "https" or (
                      target_origin != api_origin
                      and not (target_origin[1] in storage_hosts and target_origin[2] == 443)
                  ):
                      raise urllib.error.HTTPError(
                          absolute, code, "refusing untrusted GitHub asset redirect", response_headers, fp
                      )
                  redirected = super().redirect_request(
                      req, fp, code, msg, response_headers, absolute
                  )
                  if redirected is not None and target_origin != api_origin:
                      redirected.remove_header("Authorization")
                      for mapping in (redirected.headers, redirected.unredirected_hdrs):
                          for key in list(mapping):
                              if key.lower() == "authorization":
                                  del mapping[key]
                  return redirected

          opener = urllib.request.build_opener(SafeGitHubRedirect())

          def api_request(url, accept, timeout=30):
              parsed = urllib.parse.urlparse(url)
              request_origin = (
                  parsed.scheme.lower(), (parsed.hostname or "").lower(), parsed.port or 443
              )
              if request_origin != api_origin:
                  raise SystemExit(f"refusing non-API GitHub request URL: {url!r}")
              return opener.open(
                  urllib.request.Request(url, headers={**headers, "Accept": accept}), timeout=timeout
              )

          endpoint = (
              f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/releases/tags/"
              f"{urllib.parse.quote(os.environ['RELEASE_TAG'], safe='')}"
          )
          with api_request(endpoint, "application/vnd.github+json") as response:
              release = load_api_json(response, "GitHub release response")
          expected_draft = os.environ["RELEASE_STATE"] == "draft"
          if not isinstance(release, dict) \
              or type(release.get("id")) is not int \
              or release.get("id", 0) < 1 \
              or release.get("draft") is not expected_draft \
              or release.get("id") != int(os.environ["RELEASE_ID"]) \
              or release.get("tag_name") != os.environ["RELEASE_TAG"] \
              or release.get("name") != os.environ["RELEASE_TAG"] \
              or release.get("target_commitish") != os.environ["RELEASE_COMMIT"] \
              or release.get("prerelease") is not (os.environ["RELEASE_PRERELEASE"] == "true") \
