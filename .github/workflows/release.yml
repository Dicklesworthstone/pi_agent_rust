              if (len(data), hashlib.sha256(data).hexdigest()) != local[asset["name"]] or asset.get("size") != len(data):
                  raise SystemExit(f"draft asset bytes/size differ: {asset['name']}")
          print(f"Confirmed exact 12-asset release remains {os.environ['RELEASE_STATE']}")
          PY

      - name: Revalidate frozen source after draft handoff
        working-directory: pi_agent_rust
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
          RELEASE_TAG_OID: ${{ needs.plan.outputs.tag_oid }}
          RELEASE_MAIN_COMMIT: ${{ needs.plan.outputs.main_commit }}
        run: |
          set -euo pipefail
          validation_tag_ref="refs/release-validation/post-draft-handoff/tag/${RELEASE_TAG}"
          validation_main_ref="refs/release-validation/post-draft-handoff/main"
          validation_master_ref="refs/release-validation/post-draft-handoff/master"
          git fetch --no-tags --force origin \
            "refs/tags/${RELEASE_TAG}:${validation_tag_ref}" \
            "refs/heads/main:${validation_main_ref}" \
            "refs/heads/master:${validation_master_ref}"
          if [ "$(git rev-parse "${validation_tag_ref}")" != "$RELEASE_TAG_OID" ] \
            || [ "$(git rev-parse "${validation_tag_ref}^{commit}")" != "$RELEASE_COMMIT" ] \
            || [ "$(git rev-parse 'HEAD^{commit}')" != "$RELEASE_COMMIT" ] \
            || [ "$RELEASE_COMMIT" != "$RELEASE_MAIN_COMMIT" ] \
            || [ "$(git rev-parse "${validation_main_ref}^{commit}")" != "$(git rev-parse "${validation_master_ref}^{commit}")" ] \
            || ! git merge-base --is-ancestor "$RELEASE_MAIN_COMMIT" "$(git rev-parse "${validation_main_ref}^{commit}")"; then
            echo "::error::Frozen release source changed across draft handoff"
            exit 1
          fi

  verify_crate:
    name: Verify exact crate publication payload
    needs: [plan, release]
    if: needs.plan.result == 'success' && needs.release.result == 'success' && needs.plan.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: pi_agent_rust
        shell: bash
    steps:
      - name: Checkout frozen release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: pi_agent_rust
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.plan.outputs.commit }}

      - name: Verify frozen release source
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
          RELEASE_TAG_OID: ${{ needs.plan.outputs.tag_oid }}
          RELEASE_MAIN_COMMIT: ${{ needs.plan.outputs.main_commit }}
        run: |
          set -euo pipefail
          validation_tag_ref="refs/release-validation/crate/tag/${RELEASE_TAG}"
          validation_main_ref="refs/release-validation/crate/main"
          validation_master_ref="refs/release-validation/crate/master"
          git fetch --no-tags --force origin \
            "refs/tags/${RELEASE_TAG}:${validation_tag_ref}" \
            "refs/heads/main:${validation_main_ref}" \
            "refs/heads/master:${validation_master_ref}"
          remote_tag_oid="$(git rev-parse "${validation_tag_ref}")"
          remote_commit="$(git rev-parse "${validation_tag_ref}^{commit}")"
          remote_main="$(git rev-parse "${validation_main_ref}^{commit}")"
          remote_master="$(git rev-parse "${validation_master_ref}^{commit}")"
          if [ "$remote_tag_oid" != "$RELEASE_TAG_OID" ] \
            || [ "$(git rev-parse 'HEAD^{commit}')" != "$RELEASE_COMMIT" ] \
            || [ "$remote_commit" != "$RELEASE_COMMIT" ] \
            || [ "$RELEASE_COMMIT" != "$RELEASE_MAIN_COMMIT" ] \
            || [ "$remote_main" != "$remote_master" ] \
            || ! git merge-base --is-ancestor "$RELEASE_MAIN_COMMIT" "$remote_main"; then
            echo "::error::Frozen release source changed before crate validation"
            exit 1
          fi

      - name: Install system dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Install frozen Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # upstream commit verified 2026-08-04
        with:
          toolchain: nightly-2026-07-05

      - name: Resolve exact root package
        id: package
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          metadata="$(cargo metadata --no-deps --locked --format-version 1)"
          package_fields="$(python3 -c '
          import json, pathlib, sys
          metadata = json.load(sys.stdin)
          manifest = pathlib.Path("Cargo.toml").resolve()
          matches = [package for package in metadata["packages"] if pathlib.Path(package["manifest_path"]) == manifest]
          if len(matches) != 1:
              raise SystemExit(f"expected one root package, found {len(matches)}")
          package = matches[0]
          print(package["name"], package["version"])
          ' <<< "$metadata")"
          read -r package_name package_version <<< "$package_fields"
          if [ "$package_name" != "pi_agent_rust" ] || [ "$package_version" != "$RELEASE_VERSION" ]; then
            echo "::error::Root package identity differs from release tag: ${package_name} ${package_version}"
            exit 1
          fi
          {
            echo "name=$package_name"
            echo "version=$package_version"
          } >> "$GITHUB_OUTPUT"

      - name: Build and verify dry-run crate package
        id: crate
        env:
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain=v2 --untracked-files=all)" ] \
            || ! git diff --quiet HEAD -- \
            || ! git diff --cached --quiet HEAD --; then
            echo "::error::Canonical release checkout is dirty before cargo publish dry-run"
            exit 1
          fi
          noncanonical_flags="$(git ls-files -v | grep -v '^H ' || true)"
          if [ -n "$noncanonical_flags" ]; then
            echo "::error::Release index contains hidden or noncanonical flags"
            printf '%s\n' "$noncanonical_flags"
            exit 1
          fi
          cargo publish --dry-run --locked
          crate_path="target/package/${PACKAGE_NAME}-${PACKAGE_VERSION}.crate"
          if [ ! -f "$crate_path" ] || [ -L "$crate_path" ] || [ ! -s "$crate_path" ]; then
            echo "::error::cargo publish dry-run did not produce the expected regular .crate"
            exit 1
          fi
          CRATE_PATH="$crate_path" python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          import tarfile
          import tomllib
          from pathlib import Path, PurePosixPath

          crate_path = Path(os.environ["CRATE_PATH"])
          package_name = os.environ["PACKAGE_NAME"]
          version = os.environ["PACKAGE_VERSION"]
          commit = os.environ["RELEASE_COMMIT"]
          prefix = f"{package_name}-{version}"

          def strict_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise SystemExit(f"duplicate JSON key in crate metadata: {key!r}")
                  result[key] = value
              return result

          def head_blob(path):
              tree = subprocess.run(
                  ["git", "ls-tree", "HEAD", "--", path], capture_output=True, text=True, check=True
              ).stdout.strip().split()
              if len(tree) < 4 or tree[0] not in {"100644", "100755"} or tree[1] != "blob":
                  raise SystemExit(f"packaged path is not a regular tracked HEAD blob: {path}")
              return subprocess.run(["git", "show", f"HEAD:{path}"], capture_output=True, check=True).stdout

          data = crate_path.read_bytes()
          with tarfile.open(fileobj=__import__("io").BytesIO(data), mode="r:gz") as archive:
              members = archive.getmembers()
              names = [member.name.rstrip("/") for member in members]
              if len(names) != len(set(names)):
                  raise SystemExit("dry-run crate archive contains duplicate paths")
              saw_vcs = saw_original_manifest = saw_normalized_manifest = False
              for member, name in zip(members, names, strict=True):
                  raw_parts = name.split("/")
                  path = PurePosixPath(name)
                  if "\\" in name or name.startswith("/") or not raw_parts or raw_parts[0] != prefix \
                      or any(part in {"", ".", ".."} for part in raw_parts):
                      raise SystemExit(f"unsafe dry-run crate path: {name!r}")
                  if member.isdir():
                      continue
                  if not member.isreg() or member.issym() or member.islnk():
                      raise SystemExit(f"non-regular dry-run crate entry: {name!r}")
                  extracted = archive.extractfile(member)
                  if extracted is None:
                      raise SystemExit(f"unreadable dry-run crate entry: {name!r}")
                  member_bytes = extracted.read()
                  relative = PurePosixPath(*path.parts[1:]).as_posix()
                  if relative == ".cargo_vcs_info.json":
                      vcs = json.loads(member_bytes, object_pairs_hook=strict_object)
                      if not isinstance(vcs, dict) or not set(vcs).issubset({"git", "path_in_vcs"}) or "git" not in vcs:
                          raise SystemExit("unexpected .cargo_vcs_info.json schema")
                      if not isinstance(vcs["git"], dict) \
                          or set(vcs["git"]) not in ({"sha1"}, {"sha1", "dirty"}) \
                          or vcs["git"].get("sha1") != commit or vcs["git"].get("dirty", False) is not False:
                          raise SystemExit("crate VCS metadata is not bound cleanly to the frozen commit")
                      if "path_in_vcs" in vcs and vcs["path_in_vcs"] != "":
                          raise SystemExit("root package has unexpected path_in_vcs metadata")
                      saw_vcs = True
                  elif relative == "Cargo.toml.orig":
                      if member_bytes != head_blob("Cargo.toml"):
                          raise SystemExit("Cargo.toml.orig bytes differ from frozen HEAD")
                      saw_original_manifest = True
                  elif relative == "Cargo.toml":
                      normalized = tomllib.loads(member_bytes.decode("utf-8"))
                      if normalized.get("package", {}).get("name") != package_name \
                          or normalized.get("package", {}).get("version") != version:
                          raise SystemExit("normalized package manifest identity differs")
                      saw_normalized_manifest = True
                  elif member_bytes != head_blob(relative):
                      raise SystemExit(f"packaged bytes differ from frozen HEAD: {relative}")
              if not (saw_vcs and saw_original_manifest and saw_normalized_manifest):
                  raise SystemExit("dry-run crate is missing required Cargo/VCS metadata")
          digest = hashlib.sha256(data).hexdigest()
          if re.fullmatch(r"[0-9a-f]{64}", digest) is None:
              raise SystemExit("invalid dry-run crate SHA256")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"path={crate_path.as_posix()}\nsha256={digest}\nsize={len(data)}\n")
          print(f"Verified canonical dry-run crate: sha256={digest} size={len(data)}")
          PY

      - name: Check crates.io reconciliation state
        id: registry
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          CRATE_SHA256: ${{ steps.crate.outputs.sha256 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          MAX_RESPONSE_BYTES = 1024 * 1024

          def strict_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise SystemExit(f"duplicate crates.io response key: {key!r}")
                  result[key] = value
              return result

          endpoint = (
              "https://crates.io/api/v1/crates/"
              f"{urllib.parse.quote(os.environ['PACKAGE_NAME'], safe='')}/"
              f"{urllib.parse.quote(os.environ['PACKAGE_VERSION'], safe='')}"
          )
          request = urllib.request.Request(endpoint, headers={"User-Agent": "pi-agent-rust-release-verifier"})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  body = response.read(MAX_RESPONSE_BYTES + 1)
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  needed = "true"
              else:
                  raise
          else:
              if len(body) > MAX_RESPONSE_BYTES:
                  raise SystemExit("crates.io reconciliation response exceeds 1 MiB")
              payload = json.loads(body, object_pairs_hook=strict_object)
              version = payload.get("version") if isinstance(payload, dict) else None
              if not isinstance(version, dict) \
                  or version.get("crate") != os.environ["PACKAGE_NAME"] \
                  or version.get("num") != os.environ["PACKAGE_VERSION"] \
                  or version.get("yanked") is not False \
                  or version.get("checksum") != os.environ["CRATE_SHA256"] \
                  or re.fullmatch(r"[0-9a-f]{64}", version.get("checksum", "")) is None:
                  raise SystemExit("existing crates.io version identity/checksum/yank state differs")
              needed = "false"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"publish_needed={needed}\n")
          PY

      - name: Final source and package proof before payload capture
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
          RELEASE_TAG_OID: ${{ needs.plan.outputs.tag_oid }}
          RELEASE_MAIN_COMMIT: ${{ needs.plan.outputs.main_commit }}
          CRATE_PATH: ${{ steps.crate.outputs.path }}
          CRATE_SHA256: ${{ steps.crate.outputs.sha256 }}
          CRATE_SIZE: ${{ steps.crate.outputs.size }}
        run: |
          set -euo pipefail
          validation_tag_ref="refs/release-validation/pre-crates/tag/${RELEASE_TAG}"
          validation_main_ref="refs/release-validation/pre-crates/main"
          validation_master_ref="refs/release-validation/pre-crates/master"
          git fetch --no-tags --force origin \
            "refs/tags/${RELEASE_TAG}:${validation_tag_ref}" \
            "refs/heads/main:${validation_main_ref}" \
            "refs/heads/master:${validation_master_ref}"
          if [ "$(git rev-parse "${validation_tag_ref}")" != "$RELEASE_TAG_OID" ] \
            || [ "$(git rev-parse "${validation_tag_ref}^{commit}")" != "$RELEASE_COMMIT" ] \
            || [ "$(git rev-parse 'HEAD^{commit}')" != "$RELEASE_COMMIT" ] \
            || [ "$RELEASE_COMMIT" != "$RELEASE_MAIN_COMMIT" ] \
            || [ "$(git rev-parse "${validation_main_ref}^{commit}")" != "$(git rev-parse "${validation_master_ref}^{commit}")" ] \
            || ! git merge-base --is-ancestor "$RELEASE_MAIN_COMMIT" "$(git rev-parse "${validation_main_ref}^{commit}")"; then
            echo "::error::Frozen release source changed immediately before payload capture"
            exit 1
          fi
          if [ -n "$(git status --porcelain=v2 --untracked-files=all)" ] \
            || ! git diff --quiet HEAD -- \
            || ! git diff --cached --quiet HEAD -- \
            || [ -n "$(git ls-files -v | grep -v '^H ' || true)" ]; then
            echo "::error::Release checkout/index is not canonical immediately before payload capture"
            exit 1
          fi
          actual_sha256="$(sha256sum "$CRATE_PATH" | awk '{print $1}')"
          actual_size="$(stat -c '%s' "$CRATE_PATH")"
          if [ "$actual_sha256" != "$CRATE_SHA256" ] || [ "$actual_size" != "$CRATE_SIZE" ]; then
            echo "::error::Dry-run .crate changed after raw-byte verification"
            exit 1
          fi

      - name: Prepare exact verified crate handoff
        id: capture
        env:
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
          RELEASE_TAG_OID: ${{ needs.plan.outputs.tag_oid }}
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          CRATE_PATH: ${{ steps.crate.outputs.path }}
          CRATE_SHA256: ${{ steps.crate.outputs.sha256 }}
          CRATE_SIZE: ${{ steps.crate.outputs.size }}
        run: |
          set -euo pipefail
          handoff_dir="$(mktemp -d "${RUNNER_TEMP}/pi-verified-crate.XXXXXX")"
          handoff_crate="${handoff_dir}/${PACKAGE_NAME}-${PACKAGE_VERSION}.crate"
          handoff_receipt="${handoff_dir}/pi-crates-publish-receipt.json"
          if [ -e "$handoff_crate" ] || [ -e "$handoff_receipt" ]; then
            echo "::error::Fresh verified-crate handoff paths unexpectedly already exist"
            exit 1
          fi
          cp "$CRATE_PATH" "$handoff_crate"
          cmp --silent "$CRATE_PATH" "$handoff_crate"
          HANDOFF_CRATE="$handoff_crate" HANDOFF_RECEIPT="$handoff_receipt" python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          crate_path = Path(os.environ["HANDOFF_CRATE"])
          if crate_path.is_symlink() or not crate_path.is_file():
              raise SystemExit("verified crate handoff is missing or non-regular")
          crate_bytes = crate_path.read_bytes()
          if not crate_bytes or len(crate_bytes) > 50 * 1024 * 1024:
              raise SystemExit("verified crate handoff is empty or exceeds the 50 MiB safety cap")
          digest = hashlib.sha256(crate_bytes).hexdigest()
          if digest != os.environ["CRATE_SHA256"] or str(len(crate_bytes)) != os.environ["CRATE_SIZE"]:
              raise SystemExit("verified crate handoff bytes differ from dry-run proof")
          commit = os.environ["RELEASE_COMMIT"]
          tag_oid = os.environ["RELEASE_TAG_OID"]
          if re.fullmatch(r"[0-9a-f]{40}", commit) is None or re.fullmatch(r"[0-9a-f]{40}", tag_oid) is None:
              raise SystemExit("crate handoff source binding contains an invalid Git object ID")
          receipt = {
              "schema": "pi.release.verified_crate.v1",
              "commit": commit,
              "tag_oid": tag_oid,
              "name": os.environ["PACKAGE_NAME"],
              "version": os.environ["PACKAGE_VERSION"],
              "crate_sha256": digest,
              "crate_size": len(crate_bytes),
          }
          with Path(os.environ["HANDOFF_RECEIPT"]).open("x", encoding="utf-8") as output:
              output.write(json.dumps(receipt, indent=2, sort_keys=True) + "\n")
          print("Prepared source-bound exact verified crate for fresh-runner publication")
          PY
          {
            echo "crate=$handoff_crate"
            echo "receipt=$handoff_receipt"
          } >> "$GITHUB_OUTPUT"

      - name: Upload verified crate handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crates-publication-payload-${{ needs.plan.outputs.tag }}
          path: |
            ${{ steps.capture.outputs.crate }}
            ${{ steps.capture.outputs.receipt }}
          if-no-files-found: error
          retention-days: 1

      - name: Revalidate frozen source after payload capture
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
          RELEASE_TAG_OID: ${{ needs.plan.outputs.tag_oid }}
          RELEASE_MAIN_COMMIT: ${{ needs.plan.outputs.main_commit }}
        run: |
          set -euo pipefail
          validation_tag_ref="refs/release-validation/post-crate-capture/tag/${RELEASE_TAG}"
          validation_main_ref="refs/release-validation/post-crate-capture/main"
          validation_master_ref="refs/release-validation/post-crate-capture/master"
          git fetch --no-tags --force origin \
            "refs/tags/${RELEASE_TAG}:${validation_tag_ref}" \
            "refs/heads/main:${validation_main_ref}" \
            "refs/heads/master:${validation_master_ref}"
          if [ "$(git rev-parse "${validation_tag_ref}")" != "$RELEASE_TAG_OID" ] \
            || [ "$(git rev-parse "${validation_tag_ref}^{commit}")" != "$RELEASE_COMMIT" ] \
            || [ "$(git rev-parse 'HEAD^{commit}')" != "$RELEASE_COMMIT" ] \
            || [ "$RELEASE_COMMIT" != "$RELEASE_MAIN_COMMIT" ] \
            || [ "$(git rev-parse "${validation_main_ref}^{commit}")" != "$(git rev-parse "${validation_master_ref}^{commit}")" ] \
            || ! git merge-base --is-ancestor "$RELEASE_MAIN_COMMIT" "$(git rev-parse "${validation_main_ref}^{commit}")"; then
            echo "::error::Frozen release source changed across crate payload capture"
            exit 1
          fi

  publish_crate:
    name: Reconcile exact verified crate on crates.io
    needs: [plan, release, verify_crate]
    if: needs.plan.result == 'success' && needs.release.result == 'success' && needs.verify_crate.result == 'success' && needs.plan.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A separately configured review-protected environment gates this fresh runner.
    environment:
      name: release
    permissions:
      contents: read
    outputs:
      crate_sha256: ${{ steps.payload.outputs.crate_sha256 }}
    env:
      HAS_CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    defaults:
      run:
        working-directory: pi_agent_rust
        shell: bash
    steps:
      - name: Checkout frozen release commit without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: pi_agent_rust
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.plan.outputs.commit }}

      - name: Download verified crate handoff outside the checkout
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: crates-publication-payload-${{ needs.plan.outputs.tag }}
          path: crate-payload

      - name: Re-hash and validate verified crate handoff
        id: payload
        env:
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
          RELEASE_TAG_OID: ${{ needs.plan.outputs.tag_oid }}
          PACKAGE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          def strict_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise SystemExit(f"duplicate verified-crate receipt key: {key!r}")
                  result[key] = value
              return result

          directory = Path("../crate-payload")
          crate_name = f"pi_agent_rust-{os.environ['PACKAGE_VERSION']}.crate"
          expected_names = {crate_name, "pi-crates-publish-receipt.json"}
          entries = list(directory.iterdir()) if directory.is_dir() and not directory.is_symlink() else []
          if len(entries) != 2 or {entry.name for entry in entries} != expected_names:
              raise SystemExit("verified crate artifact must contain exactly one .crate plus its receipt")
          if any(entry.is_symlink() or not entry.is_file() for entry in entries):
              raise SystemExit("verified crate artifact entries must be regular files")
          crate_path = directory / crate_name
          receipt_path = directory / "pi-crates-publish-receipt.json"
          if receipt_path.stat().st_size == 0 or receipt_path.stat().st_size > 16 * 1024:
              raise SystemExit("verified-crate receipt is empty or exceeds 16 KiB")
          crate_bytes = crate_path.read_bytes()
          if not crate_bytes or len(crate_bytes) > 50 * 1024 * 1024:
              raise SystemExit("verified crate is empty or exceeds the 50 MiB safety cap")
          receipt = json.loads(receipt_path.read_text(encoding="utf-8"), object_pairs_hook=strict_object)
          expected_keys = {
              "schema", "commit", "tag_oid", "name", "version", "crate_sha256", "crate_size"
          }
          digest = hashlib.sha256(crate_bytes).hexdigest()
          if not isinstance(receipt, dict) or set(receipt) != expected_keys \
              or receipt.get("schema") != "pi.release.verified_crate.v1" \
              or receipt.get("commit") != os.environ["RELEASE_COMMIT"] \
              or receipt.get("tag_oid") != os.environ["RELEASE_TAG_OID"] \
              or receipt.get("name") != "pi_agent_rust" \
              or receipt.get("version") != os.environ["PACKAGE_VERSION"] \
              or receipt.get("crate_sha256") != digest \
              or receipt.get("crate_size") != len(crate_bytes) \
              or re.fullmatch(r"[0-9a-f]{64}", digest) is None:
              raise SystemExit("verified-crate receipt/source/byte binding failed")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(
                  f"crate={crate_path.as_posix()}\n"
                  f"name={receipt['name']}\n"
                  f"version={receipt['version']}\n"
                  f"crate_sha256={digest}\n"
                  f"crate_size={len(crate_bytes)}\n"
              )
          print("Revalidated the exact source-bound crate on a fresh publisher runner")
          PY

      - name: Install frozen Rust toolchain without running package code
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # upstream commit verified 2026-08-04
        with:
          toolchain: nightly-2026-07-05

      - name: Revalidate source and immutable refs on the fresh runner
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
          RELEASE_TAG_OID: ${{ needs.plan.outputs.tag_oid }}
          RELEASE_MAIN_COMMIT: ${{ needs.plan.outputs.main_commit }}
        run: |
          set -euo pipefail
          validation_tag_ref="refs/release-validation/fresh-publisher/tag/${RELEASE_TAG}"
          validation_main_ref="refs/release-validation/fresh-publisher/main"
          validation_master_ref="refs/release-validation/fresh-publisher/master"
          git fetch --no-tags --force origin \
            "refs/tags/${RELEASE_TAG}:${validation_tag_ref}" \
            "refs/heads/main:${validation_main_ref}" \
            "refs/heads/master:${validation_master_ref}"
          remote_main="$(git rev-parse "${validation_main_ref}^{commit}")"
          remote_master="$(git rev-parse "${validation_master_ref}^{commit}")"
          if [ "$(git cat-file -t "${validation_tag_ref}")" != "tag" ] \
            || [ "$(git rev-parse "${validation_tag_ref}")" != "$RELEASE_TAG_OID" ] \
            || [ "$(git rev-parse "${validation_tag_ref}^{commit}")" != "$RELEASE_COMMIT" ] \
            || [ "$(git rev-parse 'HEAD^{commit}')" != "$RELEASE_COMMIT" ] \
            || [ "$RELEASE_COMMIT" != "$RELEASE_MAIN_COMMIT" ] \
            || [ "$remote_main" != "$remote_master" ] \
            || ! git merge-base --is-ancestor "$RELEASE_MAIN_COMMIT" "$remote_main"; then
            echo "::error::Frozen release source changed before fresh-runner crate reconciliation"
            exit 1
          fi
          if [ -n "$(git status --porcelain=v2 --untracked-files=all)" ] \
            || ! git diff --quiet HEAD -- \
            || ! git diff --cached --quiet HEAD -- \
            || [ -n "$(git ls-files -v | grep -v '^H ' || true)" ]; then
            echo "::error::Fresh publisher checkout is not canonical"
            exit 1
          fi

      - name: Check exact crates.io reconciliation state
        id: registry
        env:
          PACKAGE_NAME: ${{ steps.payload.outputs.name }}
          PACKAGE_VERSION: ${{ steps.payload.outputs.version }}
          CRATE_SHA256: ${{ steps.payload.outputs.crate_sha256 }}
          RELEASE_STATE: ${{ needs.release.outputs.release_state }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          MAX_RESPONSE_BYTES = 1024 * 1024

          def strict_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise SystemExit(f"duplicate crates.io response key: {key!r}")
                  result[key] = value
              return result

          endpoint = (
              "https://crates.io/api/v1/crates/"
              f"{urllib.parse.quote(os.environ['PACKAGE_NAME'], safe='')}/"
              f"{urllib.parse.quote(os.environ['PACKAGE_VERSION'], safe='')}"
          )
          request = urllib.request.Request(
              endpoint, headers={"Accept": "application/json", "User-Agent": "pi-agent-rust-release-verifier"}
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  body = response.read(MAX_RESPONSE_BYTES + 1)
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
              needed = "true"
          else:
              if len(body) > MAX_RESPONSE_BYTES:
                  raise SystemExit("crates.io reconciliation response exceeds 1 MiB")
              payload = json.loads(body, object_pairs_hook=strict_object)
              version = payload.get("version") if isinstance(payload, dict) else None
              if not isinstance(version, dict) \
                  or version.get("crate") != os.environ["PACKAGE_NAME"] \
                  or version.get("num") != os.environ["PACKAGE_VERSION"] \
                  or version.get("yanked") is not False \
                  or version.get("checksum") != os.environ["CRATE_SHA256"] \
                  or re.fullmatch(r"[0-9a-f]{64}", version.get("checksum", "")) is None:
                  raise SystemExit("existing crates.io version identity/checksum/yank state differs")
              needed = "false"
          if os.environ.get("RELEASE_STATE") == "public" and needed == "true":
              raise SystemExit("public GitHub release exists but the exact stable crate is absent")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"publish_needed={needed}\n")
          PY

      - name: Require CARGO_REGISTRY_TOKEN for missing exact version
        if: steps.registry.outputs.publish_needed == 'true' && env.HAS_CARGO_REGISTRY_TOKEN != 'true'
        run: |
          echo "::error::CARGO_REGISTRY_TOKEN is required for exact crates.io publication"
          exit 1

      - name: Revalidate refs immediately before credential setup
        if: steps.registry.outputs.publish_needed == 'true'
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
          RELEASE_TAG_OID: ${{ needs.plan.outputs.tag_oid }}
          RELEASE_MAIN_COMMIT: ${{ needs.plan.outputs.main_commit }}
        run: |
          set -euo pipefail
          validation_tag_ref="refs/release-validation/pre-cargo-publish/tag/${RELEASE_TAG}"
          validation_main_ref="refs/release-validation/pre-cargo-publish/main"
          validation_master_ref="refs/release-validation/pre-cargo-publish/master"
          git fetch --no-tags --force origin \
            "refs/tags/${RELEASE_TAG}:${validation_tag_ref}" \
            "refs/heads/main:${validation_main_ref}" \
            "refs/heads/master:${validation_master_ref}"
          remote_main="$(git rev-parse "${validation_main_ref}^{commit}")"
          remote_master="$(git rev-parse "${validation_master_ref}^{commit}")"
          if [ "$(git cat-file -t "${validation_tag_ref}")" != "tag" ] \
            || [ "$(git rev-parse "${validation_tag_ref}")" != "$RELEASE_TAG_OID" ] \
            || [ "$(git rev-parse "${validation_tag_ref}^{commit}")" != "$RELEASE_COMMIT" ] \
            || [ "$(git rev-parse 'HEAD^{commit}')" != "$RELEASE_COMMIT" ] \
            || [ "$RELEASE_COMMIT" != "$RELEASE_MAIN_COMMIT" ] \
            || [ "$remote_main" != "$remote_master" ] \
            || ! git merge-base --is-ancestor "$RELEASE_MAIN_COMMIT" "$remote_main"; then
            echo "::error::Frozen release source changed immediately before credential setup"
            exit 1
          fi

      - name: Create and adversarially self-test checksum credential provider
        id: provider
        if: steps.registry.outputs.publish_needed == 'true'
        env:
          PACKAGE_NAME: ${{ steps.payload.outputs.name }}
          PACKAGE_VERSION: ${{ steps.payload.outputs.version }}
          CRATE_SHA256: ${{ steps.payload.outputs.crate_sha256 }}
        run: |
          set -euo pipefail
          provider="${RUNNER_TEMP}/pi-crates-credential-provider.py"
          receipt="${RUNNER_TEMP}/pi-crates-credential-receipt.json"
          if [ -e "$provider" ] || [ -e "$receipt" ]; then
            echo "::error::Fresh credential-provider paths unexpectedly already exist"
            exit 1
          fi
          PROVIDER_PATH="$provider" python3 - <<'PY'
          import os
          from pathlib import Path

          source = r'''#!/usr/bin/env python3
          import json
          import os
          import re
          import sys
          from pathlib import Path

          MAX_REQUEST_BYTES = 64 * 1024
          OFFICIAL_INDEX_URLS = {
              "sparse+https://index.crates.io/",
              "https://github.com/rust-lang/crates.io-index",
          }

          def strict_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(f"duplicate request key: {key!r}")
                  result[key] = value
              return result

          def emit(payload):
              print(json.dumps(payload, separators=(",", ":"), sort_keys=True), flush=True)

          def reject(message):
              emit({"Err": {"kind": "other", "message": message}})
              raise SystemExit(0)

          if sys.argv[1:] != ["--cargo-plugin"]:
              raise SystemExit("credential provider requires Cargo's --cargo-plugin invocation")
          emit({"v": [1]})
          line = sys.stdin.buffer.readline(MAX_REQUEST_BYTES + 1)
          if not line or len(line) > MAX_REQUEST_BYTES or not line.endswith(b"\n"):
              reject("credential request is missing, unterminated, or oversized")
          try:
              request = json.loads(line, object_pairs_hook=strict_object)
          except (UnicodeDecodeError, ValueError, json.JSONDecodeError):
              reject("credential request is not strict JSON")
          if not isinstance(request, dict) or request.get("v") != 1 or request.get("kind") != "get":
              reject("unsupported credential protocol request")
          if request.get("args", []) != []:
              reject("credential provider arguments are forbidden")
          registry = request.get("registry")
          if not isinstance(registry, dict) \
              or not set(registry).issubset({"index-url", "name", "headers"}) \
              or registry.get("name") != "crates-io" \
              or registry.get("index-url") not in OFFICIAL_INDEX_URLS:
              reject("credential request is not for the canonical crates.io registry")
          headers = registry.get("headers", [])
          if not isinstance(headers, list) or any(not isinstance(value, str) for value in headers) \
              or sum(len(value) for value in headers) > 8 * 1024:
              reject("registry authentication headers are malformed or oversized")
          token = os.environ.get("PI_CRATES_IO_RELEASE_TOKEN", "")
          if not token or len(token) > 4096 or "\n" in token or "\r" in token:
              reject("release token is missing or malformed")

          operation = request.get("operation")
          common = {"v", "kind", "operation", "registry"}
          if "args" in request:
              common.add("args")
          if operation == "read":
              if set(request) != common:
                  reject("read credential request contains unexpected fields")
          elif operation == "publish":
              if set(request) != common | {"name", "vers", "cksum"}:
                  reject("publish credential request contains unexpected fields")
              expected_name = os.environ["PI_EXPECTED_CRATE_NAME"]
              expected_version = os.environ["PI_EXPECTED_CRATE_VERSION"]
              expected_checksum = os.environ["PI_EXPECTED_CRATE_SHA256"]
              if request.get("name") != expected_name \
                  or request.get("vers") != expected_version \
                  or request.get("cksum") != expected_checksum \
                  or re.fullmatch(r"[0-9a-f]{64}", request.get("cksum", "")) is None:
                  reject("Cargo publish identity/checksum differs from the verified crate")
              receipt = {
                  "schema": "pi.release.cargo_credential_receipt.v1",
                  "name": expected_name,
                  "version": expected_version,
                  "crate_sha256": expected_checksum,
                  "registry_name": registry["name"],
                  "registry_index_url": registry["index-url"],
              }
              receipt_path = Path(os.environ["PI_CREDENTIAL_RECEIPT"])
              encoded = json.dumps(receipt, indent=2, sort_keys=True) + "\n"
              if receipt_path.exists():
                  if receipt_path.is_symlink() or receipt_path.read_text(encoding="utf-8") != encoded:
                      reject("credential receipt path already contains different data")
              else:
                  with receipt_path.open("x", encoding="utf-8") as output:
                      output.write(encoded)
          else:
              reject("unsupported credential operation")
          emit({
              "Ok": {
                  "kind": "get",
                  "token": token,
                  "cache": "never",
                  "operation_independent": False,
              }
          })
          '''
          Path(os.environ["PROVIDER_PATH"]).write_text(source, encoding="utf-8")
          PY
          chmod 700 "$provider"
          PROVIDER_PATH="$provider" python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          provider = os.environ["PROVIDER_PATH"]
          base_env = {
              **os.environ,
              "PI_CRATES_IO_RELEASE_TOKEN": "self-test-token",
              "PI_EXPECTED_CRATE_NAME": os.environ["PACKAGE_NAME"],
              "PI_EXPECTED_CRATE_VERSION": os.environ["PACKAGE_VERSION"],
              "PI_EXPECTED_CRATE_SHA256": os.environ["CRATE_SHA256"],
          }
          official = {
              "index-url": "sparse+https://index.crates.io/",
              "name": "crates-io",
          }

          def invoke(label, request):
              receipt = Path(os.environ["RUNNER_TEMP"]) / f"provider-self-test-{label}.json"
              if receipt.exists():
                  raise SystemExit(f"self-test receipt path unexpectedly exists: {receipt}")
              env = {**base_env, "PI_CREDENTIAL_RECEIPT": str(receipt)}
              process = subprocess.run(
                  [provider, "--cargo-plugin"],
                  input=json.dumps(request, separators=(",", ":")) + "\n",
                  capture_output=True,
                  text=True,
                  env=env,
                  timeout=10,
                  check=False,
              )
              lines = process.stdout.splitlines()
              if process.returncode != 0 or len(lines) != 2 or json.loads(lines[0]) != {"v": [1]}:
                  raise SystemExit(f"credential provider protocol self-test failed: {label}")
              return json.loads(lines[1]), receipt

          read_request = {
              "v": 1, "kind": "get", "operation": "read", "registry": official, "args": []
          }
          response, receipt = invoke("read", read_request)
          if response.get("Ok", {}).get("token") != "self-test-token" or receipt.exists():
              raise SystemExit("credential provider read self-test failed")

          publish_request = {
              "v": 1, "kind": "get", "operation": "publish",
              "name": os.environ["PACKAGE_NAME"], "vers": os.environ["PACKAGE_VERSION"],
              "cksum": os.environ["CRATE_SHA256"], "registry": official, "args": [],
          }
          response, receipt = invoke("publish", publish_request)
          if "Ok" not in response or not receipt.is_file():
              raise SystemExit("credential provider exact-publish self-test failed")

          wrong_checksum = {**publish_request, "cksum": "0" * 64}
          response, receipt = invoke("wrong-checksum", wrong_checksum)
          if "Err" not in response or receipt.exists():
              raise SystemExit("credential provider checksum deny self-test failed")

          wrong_registry = {**publish_request, "registry": {**official, "name": "not-crates-io"}}
          response, receipt = invoke("wrong-registry", wrong_registry)
          if "Err" not in response or receipt.exists():
              raise SystemExit("credential provider registry deny self-test failed")

          digest = hashlib.sha256(Path(provider).read_bytes()).hexdigest()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"path={provider}\nsha256={digest}\nreceipt={os.environ['RUNNER_TEMP']}/pi-crates-credential-receipt.json\n")
          print("Credential provider passed read/allow/deny protocol self-tests")
          PY

      - name: Publish only when Cargo proves the exact verified crate checksum
        id: cargo_publish
        if: steps.registry.outputs.publish_needed == 'true'
        env:
          PI_CRATES_IO_RELEASE_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          PI_EXPECTED_CRATE_NAME: ${{ steps.payload.outputs.name }}
          PI_EXPECTED_CRATE_VERSION: ${{ steps.payload.outputs.version }}
          PI_EXPECTED_CRATE_SHA256: ${{ steps.payload.outputs.crate_sha256 }}
          PI_CREDENTIAL_RECEIPT: ${{ steps.provider.outputs.receipt }}
          PROVIDER_PATH: ${{ steps.provider.outputs.path }}
          PROVIDER_SHA256: ${{ steps.provider.outputs.sha256 }}
          VERIFIED_CRATE: ${{ steps.payload.outputs.crate }}
          VERIFIED_CRATE_SIZE: ${{ steps.payload.outputs.crate_size }}
        run: |
          set -euo pipefail
          set +x
          release_crates_io_token="${PI_CRATES_IO_RELEASE_TOKEN:-}"
          export -n release_crates_io_token
          unset PI_CRATES_IO_RELEASE_TOKEN
          if [ -z "$release_crates_io_token" ]; then
            echo "::error::Registry publication token is empty"
            exit 1
          fi
          if [ ! -f "$PROVIDER_PATH" ] || [ -L "$PROVIDER_PATH" ] \
            || [ "$(sha256sum "$PROVIDER_PATH" | awk '{print $1}')" != "$PROVIDER_SHA256" ] \
            || [ -e "$PI_CREDENTIAL_RECEIPT" ]; then
            echo "::error::Credential provider or receipt path changed after self-test"
            exit 1
          fi
          actual_crate_sha="$(sha256sum "$VERIFIED_CRATE" | awk '{print $1}')"
          actual_crate_size="$(stat -c '%s' "$VERIFIED_CRATE")"
          if [ "$actual_crate_sha" != "$PI_EXPECTED_CRATE_SHA256" ] \
            || [ "$actual_crate_size" != "$VERIFIED_CRATE_SIZE" ]; then
            echo "::error::Verified crate handoff changed immediately before Cargo publication"
            exit 1
          fi
          manifest_abs="$(realpath Cargo.toml)"
          export CARGO_HOME="${RUNNER_TEMP}/pi-release-cargo-home"
          publisher_cwd="${RUNNER_TEMP}/pi-release-publisher-cwd"
          mkdir "$CARGO_HOME" "$publisher_cwd"
          if [ -n "$(find "$publisher_cwd" -mindepth 1 -maxdepth 1 -print -quit)" ]; then
            echo "::error::Isolated Cargo publisher working directory is not empty"
            exit 1
          fi
          registry_credential_config="$(PROVIDER_PATH="$PROVIDER_PATH" python3 - <<'PY'
          import json
          import os
          print("registry.credential-provider=" + json.dumps(os.environ["PROVIDER_PATH"]))
          PY
          )"
          named_credential_config="$(PROVIDER_PATH="$PROVIDER_PATH" python3 - <<'PY'
          import json
          import os
          print("registries.crates-io.credential-provider=" + json.dumps(os.environ["PROVIDER_PATH"]))
          PY
          )"
          cd "$publisher_cwd"
          # Prove, without exposing any token, that the exact command-line
          # provider wins even over adversarial lower-precedence settings.
          # Running from an empty directory with a fresh CARGO_HOME also keeps
          # source-tree and user-level Cargo configuration out of discovery.
          adversarial_registry_config='registry.credential-provider="/bin/false"'
          adversarial_named_config='registries.crates-io.credential-provider="/bin/false"'
          actual_registry_provider="$(
            env -u PI_CRATES_IO_RELEASE_TOKEN \
              -u CARGO_REGISTRY_TOKEN \
              -u CARGO_REGISTRIES_CRATES_IO_TOKEN \
              cargo -Z unstable-options config get registry.credential-provider \
                --format=json-value \
                --config "$adversarial_registry_config" \
                --config "$registry_credential_config" \
                --config "$adversarial_named_config" \
                --config "$named_credential_config"
          )"
          actual_named_provider="$(
            env -u PI_CRATES_IO_RELEASE_TOKEN \
              -u CARGO_REGISTRY_TOKEN \
              -u CARGO_REGISTRIES_CRATES_IO_TOKEN \
              cargo -Z unstable-options config get registries.crates-io.credential-provider \
                --format=json-value \
                --config "$adversarial_registry_config" \
                --config "$registry_credential_config" \
                --config "$adversarial_named_config" \
                --config "$named_credential_config"
          )"
          EXPECTED_PROVIDER="$PROVIDER_PATH" \
            ACTUAL_REGISTRY_PROVIDER="$actual_registry_provider" \
            ACTUAL_NAMED_PROVIDER="$actual_named_provider" \
            python3 - <<'PY'
          import json
          import os

          expected = os.environ["EXPECTED_PROVIDER"]
          for label, variable in (
              ("registry", "ACTUAL_REGISTRY_PROVIDER"),
              ("named crates.io registry", "ACTUAL_NAMED_PROVIDER"),
          ):
              try:
                  actual = json.loads(os.environ[variable])
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"effective {label} credential provider is not JSON: {exc}") from exc
              if actual != expected:
                  raise SystemExit(
                      f"effective {label} credential provider differs from the verified provider"
                  )
          print("Verified exact CLI-precedence credential provider configuration")
          PY
          set +e
          # All compilation and package verification completed before this
          # secret-scoped step. --no-verify is mandatory here: Cargo's normal
          # publish verification builds the package and would expose the
          # credential environment to package/dependency build scripts.
          PI_CRATES_IO_RELEASE_TOKEN="$release_crates_io_token" \
            env -u CARGO_REGISTRY_TOKEN -u CARGO_REGISTRIES_CRATES_IO_TOKEN \
            cargo publish \
              --manifest-path "$manifest_abs" \
              --locked \
              --no-verify \
              --registry crates-io \
              --config "$registry_credential_config" \
              --config "$named_credential_config"
          cargo_status=$?
          unset release_crates_io_token
          set -e
          if [ -f "$PI_CREDENTIAL_RECEIPT" ] && [ ! -L "$PI_CREDENTIAL_RECEIPT" ]; then
            RECEIPT_PATH="$PI_CREDENTIAL_RECEIPT" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          def strict_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise SystemExit(f"duplicate credential receipt key: {key!r}")
                  result[key] = value
              return result

          path = Path(os.environ["RECEIPT_PATH"])
          if path.stat().st_size == 0 or path.stat().st_size > 16 * 1024:
              raise SystemExit("credential receipt is empty or oversized")
          receipt = json.loads(path.read_text(encoding="utf-8"), object_pairs_hook=strict_object)
          expected_keys = {
              "schema", "name", "version", "crate_sha256", "registry_name", "registry_index_url"
          }
          if not isinstance(receipt, dict) or set(receipt) != expected_keys \
              or receipt.get("schema") != "pi.release.cargo_credential_receipt.v1" \
              or receipt.get("name") != os.environ["PI_EXPECTED_CRATE_NAME"] \
              or receipt.get("version") != os.environ["PI_EXPECTED_CRATE_VERSION"] \
              or receipt.get("crate_sha256") != os.environ["PI_EXPECTED_CRATE_SHA256"] \
              or receipt.get("registry_name") != "crates-io" \
              or receipt.get("registry_index_url") not in {
                  "sparse+https://index.crates.io/",
                  "https://github.com/rust-lang/crates.io-index",
              }:
              raise SystemExit("credential receipt does not prove the exact canonical publication")
          PY
          elif [ "$cargo_status" -eq 0 ]; then
            echo "::error::Cargo reported success without an exact publish credential request"
            exit 1
          fi
          echo "cargo_status=$cargo_status" >> "$GITHUB_OUTPUT"
          if [ "$cargo_status" -ne 0 ]; then
            echo "::warning::Cargo publish returned $cargo_status; registry reconciliation will decide the outcome"
          fi

      - name: Verify exact non-yanked crates.io version
        env:
          PACKAGE_NAME: ${{ steps.payload.outputs.name }}
          PACKAGE_VERSION: ${{ steps.payload.outputs.version }}
          CRATE_SHA256: ${{ steps.payload.outputs.crate_sha256 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          MAX_RESPONSE_BYTES = 1024 * 1024

          def strict_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise SystemExit(f"duplicate crates.io response key: {key!r}")
                  result[key] = value
              return result

          endpoint = (
              "https://crates.io/api/v1/crates/"
              f"{urllib.parse.quote(os.environ['PACKAGE_NAME'], safe='')}/"
              f"{urllib.parse.quote(os.environ['PACKAGE_VERSION'], safe='')}"
          )
          version = None
          for attempt in range(60):
              request = urllib.request.Request(
                  endpoint, headers={"Accept": "application/json", "User-Agent": "pi-agent-rust-release-verifier"}
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      body = response.read(MAX_RESPONSE_BYTES + 1)
              except urllib.error.HTTPError as exc:
                  if exc.code != 404:
                      raise
              else:
                  if len(body) > MAX_RESPONSE_BYTES:
                      raise SystemExit("crates.io verification response exceeds 1 MiB")
                  payload = json.loads(body, object_pairs_hook=strict_object)
                  version = payload.get("version") if isinstance(payload, dict) else None
                  if version is not None:
                      break
              if attempt != 59:
                  time.sleep(5)
          if not isinstance(version, dict) \
              or version.get("crate") != os.environ["PACKAGE_NAME"] \
              or version.get("num") != os.environ["PACKAGE_VERSION"] \
              or version.get("yanked") is not False \
              or version.get("checksum") != os.environ["CRATE_SHA256"] \
              or re.fullmatch(r"[0-9a-f]{64}", version.get("checksum", "")) is None:
              raise SystemExit("crates.io did not reconcile to the exact non-yanked verified crate")
          print("Verified exact non-yanked crates.io identity and checksum")
          PY

      - name: Revalidate frozen refs after crates.io reconciliation
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
          RELEASE_TAG_OID: ${{ needs.plan.outputs.tag_oid }}
          RELEASE_MAIN_COMMIT: ${{ needs.plan.outputs.main_commit }}
        run: |
          set -euo pipefail
          validation_tag_ref="refs/release-validation/post-cargo-publish/tag/${RELEASE_TAG}"
          validation_main_ref="refs/release-validation/post-cargo-publish/main"
          validation_master_ref="refs/release-validation/post-cargo-publish/master"
          git fetch --no-tags --force origin \
            "refs/tags/${RELEASE_TAG}:${validation_tag_ref}" \
            "refs/heads/main:${validation_main_ref}" \
            "refs/heads/master:${validation_master_ref}"
          remote_main="$(git rev-parse "${validation_main_ref}^{commit}")"
          remote_master="$(git rev-parse "${validation_master_ref}^{commit}")"
          if [ "$(git cat-file -t "${validation_tag_ref}")" != "tag" ] \
            || [ "$(git rev-parse "${validation_tag_ref}")" != "$RELEASE_TAG_OID" ] \
            || [ "$(git rev-parse "${validation_tag_ref}^{commit}")" != "$RELEASE_COMMIT" ] \
            || [ "$(git rev-parse 'HEAD^{commit}')" != "$RELEASE_COMMIT" ] \
            || [ "$RELEASE_COMMIT" != "$RELEASE_MAIN_COMMIT" ] \
            || [ "$remote_main" != "$remote_master" ] \
            || ! git merge-base --is-ancestor "$RELEASE_MAIN_COMMIT" "$remote_main"; then
            echo "::error::Frozen release source changed across crates.io reconciliation"
            exit 1
          fi

  publish_github_release:
    name: Publish fully reconciled GitHub release
    needs: [plan, release, verify_crate, publish_crate]
    if: >-
      always() &&
      !cancelled() &&
      needs.plan.result == 'success' &&
      needs.release.result == 'success' &&
      ((needs.plan.outputs.prerelease == 'false' && needs.verify_crate.result == 'success' && needs.publish_crate.result == 'success') ||
       (needs.plan.outputs.prerelease == 'true' && needs.verify_crate.result == 'skipped' && needs.publish_crate.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Public visibility is the final irreversible release boundary.
    environment:
      name: release
    permissions:
      contents: write
    steps:
      - name: Checkout frozen release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: pi_agent_rust
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.plan.outputs.commit }}

      - name: Download verified draft publication inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-publication-inputs-${{ needs.plan.outputs.tag }}
          path: publication

      - name: Revalidate annotated tag and synchronized branches before publication
        working-directory: pi_agent_rust
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
          RELEASE_TAG_OID: ${{ needs.plan.outputs.tag_oid }}
          RELEASE_MAIN_COMMIT: ${{ needs.plan.outputs.main_commit }}
        run: |
          set -euo pipefail
          validation_tag_ref="refs/release-validation/final-publication/tag/${RELEASE_TAG}"
          validation_main_ref="refs/release-validation/final-publication/main"
          validation_master_ref="refs/release-validation/final-publication/master"
          git fetch --no-tags --force origin \
            "refs/tags/${RELEASE_TAG}:${validation_tag_ref}" \
            "refs/heads/main:${validation_main_ref}" \
            "refs/heads/master:${validation_master_ref}"
          remote_tag_oid="$(git rev-parse "${validation_tag_ref}")"
          remote_commit="$(git rev-parse "${validation_tag_ref}^{commit}")"
          remote_main="$(git rev-parse "${validation_main_ref}^{commit}")"
          remote_master="$(git rev-parse "${validation_master_ref}^{commit}")"
          if [ "$(git cat-file -t "${validation_tag_ref}")" != "tag" ] \
            || [ "$remote_tag_oid" != "$RELEASE_TAG_OID" ] \
            || [ "$remote_commit" != "$RELEASE_COMMIT" ] \
            || [ "$(git rev-parse 'HEAD^{commit}')" != "$RELEASE_COMMIT" ] \
            || [ "$RELEASE_COMMIT" != "$RELEASE_MAIN_COMMIT" ] \
            || [ "$remote_main" != "$remote_master" ] \
            || ! git merge-base --is-ancestor "$RELEASE_MAIN_COMMIT" "$remote_main"; then
            echo "::error::Release source changed before final GitHub publication"
            exit 1
          fi

      - name: Publish only the exact verified GitHub draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
          RELEASE_PRERELEASE: ${{ needs.plan.outputs.prerelease }}
          RELEASE_STATE: ${{ needs.release.outputs.release_state }}
          CRATE_SHA256: ${{ needs.publish_crate.outputs.crate_sha256 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          MAX_API_RESPONSE_BYTES = 2 * 1024 * 1024

          def strict_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise SystemExit(f"duplicate GitHub API JSON key: {key!r}")
                  result[key] = value
              return result

          def load_api_json(response, label):
              body = response.read(MAX_API_RESPONSE_BYTES + 1)
              if len(body) > MAX_API_RESPONSE_BYTES:
                  raise SystemExit(f"{label} exceeds 2 MiB")
              return json.loads(body, object_pairs_hook=strict_object)

          release_dir = Path("publication/release")
          body_path = Path("publication/RELEASE_BODY.md")
          expected_names = {
              "pi-linux-amd64.tar.xz", "pi-linux-arm64.tar.xz",
              "pi-darwin-amd64.tar.xz", "pi-darwin-arm64.tar.xz",
              "pi-windows-amd64.zip", "install.sh", "SHA256SUMS",
              "build-manifest-pi-linux-amd64.json",
              "build-manifest-pi-linux-arm64.json",
              "build-manifest-pi-darwin-amd64.json",
              "build-manifest-pi-darwin-arm64.json",
              "build-manifest-pi-windows-amd64.json",
          }
          entries = list(release_dir.iterdir()) if release_dir.is_dir() and not release_dir.is_symlink() else []
          if len(entries) != 12 or {entry.name for entry in entries} != expected_names \
              or any(entry.is_symlink() or not entry.is_file() or entry.stat().st_size == 0 for entry in entries) \
              or body_path.is_symlink() or not body_path.is_file() or body_path.stat().st_size == 0:
              raise SystemExit("final publication inputs are incomplete, extra, empty, or non-regular")
          local = {
              entry.name: (entry.stat().st_size, hashlib.sha256(entry.read_bytes()).hexdigest())
              for entry in entries
          }
          expected_body = body_path.read_text(encoding="utf-8")
          expected_prerelease = os.environ["RELEASE_PRERELEASE"] == "true"

          api = os.environ["GITHUB_API_URL"]
          api_url = urllib.parse.urlparse(api)
          api_origin = (api_url.scheme.lower(), (api_url.hostname or "").lower(), api_url.port or 443)
          storage_hosts = {
              "objects.githubusercontent.com",
              "release-assets.githubusercontent.com",
              "github-releases.githubusercontent.com",
          }
          if api_origin[0] != "https" or not api_origin[1]:
              raise SystemExit("GITHUB_API_URL must use a valid HTTPS origin")

          class SafeGitHubRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, response_headers, newurl):
                  absolute = urllib.parse.urljoin(req.full_url, newurl)
                  target = urllib.parse.urlparse(absolute)
                  target_origin = (
                      target.scheme.lower(), (target.hostname or "").lower(), target.port or 443
                  )
                  if target_origin[0] != "https" or (
                      target_origin != api_origin
                      and not (target_origin[1] in storage_hosts and target_origin[2] == 443)
                  ):
                      raise urllib.error.HTTPError(
                          absolute, code, "refusing untrusted GitHub asset redirect", response_headers, fp
                      )
                  redirected = super().redirect_request(
                      req, fp, code, msg, response_headers, absolute
                  )
                  if redirected is not None and target_origin != api_origin:
                      redirected.remove_header("Authorization")
                      for mapping in (redirected.headers, redirected.unredirected_hdrs):
                          for key in list(mapping):
                              if key.lower() == "authorization":
                                  del mapping[key]
                  return redirected

          opener = urllib.request.build_opener(SafeGitHubRedirect())
          headers = {
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "pi-agent-rust-release-publisher",
          }

          def api_request(url, accept, timeout=30, data=None, method=None):
              parsed = urllib.parse.urlparse(url)
              request_origin = (
                  parsed.scheme.lower(), (parsed.hostname or "").lower(), parsed.port or 443
              )
              if request_origin != api_origin:
                  raise SystemExit(f"refusing non-API GitHub request URL: {url!r}")
              request_headers = {**headers, "Accept": accept}
              if data is not None:
                  request_headers["Content-Type"] = "application/json"
              request = urllib.request.Request(
                  url, data=data, method=method, headers=request_headers
              )
              return opener.open(request, timeout=timeout)

          tag = os.environ["RELEASE_TAG"]
          commit = os.environ["RELEASE_COMMIT"]
          endpoint = (
              f"{api}/repos/{os.environ['GITHUB_REPOSITORY']}/releases/tags/"
              f"{urllib.parse.quote(tag, safe='')}"
          )
          with api_request(endpoint, "application/vnd.github+json") as response:
              release = load_api_json(response, "GitHub release response")
          expected_initial_draft = os.environ["RELEASE_STATE"] != "public"
          if not isinstance(release, dict) \
              or type(release.get("id")) is not int \
              or release.get("id", 0) < 1 \
              or release.get("draft") is not expected_initial_draft \
              or release.get("tag_name") != tag \
              or release.get("name") != tag \
              or release.get("target_commitish") != commit \
              or release.get("body") != expected_body \
              or release.get("prerelease") is not expected_prerelease:
              raise SystemExit("final GitHub release state/metadata differs from the frozen exact release")
          assets_url = f"{release['assets_url']}?per_page=100"

          def verify_assets(expected_draft):
              with api_request(assets_url, "application/vnd.github+json") as response:
                  assets = load_api_json(response, "GitHub release assets response")
              if not isinstance(assets, list) \
                  or any(not isinstance(asset, dict) for asset in assets) \
                  or any(not isinstance(asset.get("name"), str) for asset in assets):
                  raise SystemExit("GitHub release assets response is malformed")
              names = [asset.get("name") for asset in assets]
              if len(names) != 12 or len(names) != len(set(names)) or set(names) != expected_names:
                  raise SystemExit(f"GitHub release asset inventory mismatch: {sorted(names)}")
              for asset in assets:
                  expected_size = local[asset["name"]][0]
                  if type(asset.get("size")) is not int or asset.get("size") < 0 \
                      or not isinstance(asset.get("url"), str):
                      raise SystemExit(f"GitHub release asset metadata is malformed: {asset['name']}")
                  with api_request(asset["url"], "application/octet-stream", timeout=60) as response:
                      data = response.read(expected_size + 1)
                  if (len(data), hashlib.sha256(data).hexdigest()) != local[asset["name"]] \
                      or asset.get("size") != len(data):
                      raise SystemExit(f"GitHub release asset bytes differ: {asset['name']}")
              if release.get("draft") is not expected_draft:
                  raise SystemExit("GitHub release draft state differs")

          verify_assets(expected_initial_draft)
          if not expected_initial_draft:
              print("Reconciled an already-public exact GitHub release without mutation")
              raise SystemExit(0)

          if not expected_prerelease:
              endpoint = (
                  "https://crates.io/api/v1/crates/pi_agent_rust/"
                  f"{urllib.parse.quote(os.environ['RELEASE_TAG'][1:], safe='')}"
              )
              request = urllib.request.Request(
                  endpoint,
                  headers={
                      "Accept": "application/json",
                      "User-Agent": "pi-agent-rust-final-release-verifier",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  crate_body = response.read(1024 * 1024 + 1)
              if len(crate_body) > 1024 * 1024:
                  raise SystemExit("final crates.io response exceeds 1 MiB")
              crate_payload = json.loads(crate_body, object_pairs_hook=strict_object)
              version = crate_payload.get("version") if isinstance(crate_payload, dict) else None
              if not isinstance(version, dict) \
                  or version.get("crate") != "pi_agent_rust" \
                  or version.get("num") != os.environ["RELEASE_TAG"][1:] \
                  or version.get("yanked") is not False \
                  or version.get("checksum") != os.environ["CRATE_SHA256"] \
                  or re.fullmatch(r"[0-9a-f]{64}", version.get("checksum", "")) is None:
                  raise SystemExit(
                      "exact non-yanked crates.io version was not present immediately before GitHub publication"
                  )

          payload = json.dumps(
              {
                  "tag_name": tag,
                  "target_commitish": commit,
                  "name": tag,
                  "body": expected_body,
                  "draft": False,
                  "prerelease": os.environ["RELEASE_PRERELEASE"] == "true",
              }
          ).encode("utf-8")
          release_endpoint = (
              f"{api}/repos/{os.environ['GITHUB_REPOSITORY']}/releases/{release['id']}"
          )
          with api_request(
              release_endpoint, "application/vnd.github+json", data=payload, method="PATCH"
          ) as response:
              published = load_api_json(response, "GitHub publication response")
          if not isinstance(published, dict) \
              or type(published.get("id")) is not int \
              or published.get("draft") is not False \
              or published.get("id") != release.get("id") \
              or published.get("tag_name") != tag \
              or published.get("name") != tag \
              or published.get("target_commitish") != commit \
              or published.get("body") != expected_body \
              or published.get("prerelease") is not expected_prerelease:
              raise SystemExit("GitHub did not confirm publication of the exact verified draft")
          release = published
          verify_assets(False)
          print("Published GitHub release last and verified all 12 exact public assets")
          PY

      - name: Revalidate release source after final publication
        working-directory: pi_agent_rust
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
          RELEASE_TAG_OID: ${{ needs.plan.outputs.tag_oid }}
          RELEASE_MAIN_COMMIT: ${{ needs.plan.outputs.main_commit }}
        run: |
          set -euo pipefail
          validation_tag_ref="refs/release-validation/post-final-publication/tag/${RELEASE_TAG}"
          validation_main_ref="refs/release-validation/post-final-publication/main"
          validation_master_ref="refs/release-validation/post-final-publication/master"
          git fetch --no-tags --force origin \
            "refs/tags/${RELEASE_TAG}:${validation_tag_ref}" \
            "refs/heads/main:${validation_main_ref}" \
            "refs/heads/master:${validation_master_ref}"
          remote_main="$(git rev-parse "${validation_main_ref}^{commit}")"
          remote_master="$(git rev-parse "${validation_master_ref}^{commit}")"
          if [ "$(git cat-file -t "${validation_tag_ref}")" != "tag" ] \
            || [ "$(git rev-parse "${validation_tag_ref}")" != "$RELEASE_TAG_OID" ] \
            || [ "$(git rev-parse "${validation_tag_ref}^{commit}")" != "$RELEASE_COMMIT" ] \
            || [ "$(git rev-parse 'HEAD^{commit}')" != "$RELEASE_COMMIT" ] \
            || [ "$RELEASE_COMMIT" != "$RELEASE_MAIN_COMMIT" ] \
            || [ "$remote_main" != "$remote_master" ] \
            || ! git merge-base --is-ancestor "$RELEASE_MAIN_COMMIT" "$remote_main"; then
            echo "::error::Frozen release source changed across final GitHub publication"
            exit 1
          fi
