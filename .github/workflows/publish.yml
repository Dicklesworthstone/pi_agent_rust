name: Publish validation (no publication)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.1.0)'
        required: true
        type: string

concurrency:
  # Share the one release lane with release.yml; this workflow never publishes.
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      commit: ${{ steps.source.outputs.commit }}
      tag_oid: ${{ steps.source.outputs.tag_oid }}
      main_commit: ${{ steps.source.outputs.main_commit }}
    steps:
      - name: Determine and validate tag
        id: tag
        env:
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$RELEASE_TAG_INPUT"
          else
            if [[ "$GITHUB_REF" != refs/tags/* ]]; then
              echo "::error::Expected a tag ref, got '$GITHUB_REF'"
              exit 1
            fi
            TAG="${GITHUB_REF#refs/tags/}"
          fi

          semver_tag_re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$TAG" =~ $semver_tag_re ]]; then
            echo "::error::Tag '$TAG' is not a complete v-prefixed SemVer tag"
            exit 1
          fi
          VERSION="${TAG#v}"

          version_without_build="${VERSION%%+*}"
          if [[ "$version_without_build" == *-* ]]; then
            PRERELEASE="true"
          else
            PRERELEASE="false"
          fi

          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout release tag for commit resolution
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: pi_agent_rust
          fetch-depth: 0
          persist-credentials: false
          ref: refs/tags/${{ steps.tag.outputs.tag }}

      - name: Freeze release source commit
        id: source
        working-directory: pi_agent_rust
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          tag_ref="refs/tags/${RELEASE_TAG}"
          validation_tag_ref="refs/release-validation/publish-validation-plan/tag/${RELEASE_TAG}"
          validation_main_ref="refs/release-validation/publish-validation-plan/main"
          validation_master_ref="refs/release-validation/publish-validation-plan/master"
          git fetch --no-tags --force origin \
            "${tag_ref}:${validation_tag_ref}" \
            "refs/heads/main:${validation_main_ref}" \
            "refs/heads/master:${validation_master_ref}"
          tag_oid="$(git rev-parse "${tag_ref}")"
          remote_tag_oid="$(git rev-parse "${validation_tag_ref}")"
          tag_type="$(git cat-file -t "${tag_ref}")"
          remote_tag_type="$(git cat-file -t "${validation_tag_ref}")"
          tag_commit="$(git rev-parse "${tag_ref}^{commit}")"
          remote_commit="$(git rev-parse "${validation_tag_ref}^{commit}")"
          main_commit="$(git rev-parse "${validation_main_ref}^{commit}")"
          master_commit="$(git rev-parse "${validation_master_ref}^{commit}")"
          head_commit="$(git rev-parse 'HEAD^{commit}')"
          for oid in "$tag_oid" "$remote_tag_oid" "$tag_commit" "$remote_commit" "$main_commit" "$master_commit" "$head_commit"; do
            if [[ ! "$oid" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Release validation source contains an invalid Git object ID: $oid"
              exit 1
            fi
          done
          if [ "$tag_type" != "tag" ] || [ "$remote_tag_type" != "tag" ]; then
            echo "::error::Release validation requires an annotated tag object"
            exit 1
          fi
          if [ "$tag_oid" != "$remote_tag_oid" ] \
            || [ "$head_commit" != "$tag_commit" ] \
            || [ "$remote_commit" != "$tag_commit" ] \
            || [ "$tag_commit" != "$main_commit" ] \
            || [ "$tag_commit" != "$master_commit" ]; then
            echo "::error::Tag object/commit must equal the synchronized main/master release tips"
            exit 1
          fi
          {
            echo "commit=$tag_commit"
            echo "tag_oid=$tag_oid"
            echo "main_commit=$main_commit"
          } >> "$GITHUB_OUTPUT"

  publish:
    # Irreversible publication lives only in release.yml, after binary verification.
    name: Validate crates.io package (dry run only)
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ needs.plan.outputs.prerelease == 'false' }}
    defaults:
      run:
        working-directory: pi_agent_rust
        shell: bash
    steps:
      - name: Checkout pi_agent_rust
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: pi_agent_rust
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.plan.outputs.commit }}

      - name: Verify frozen release source
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
          RELEASE_TAG_OID: ${{ needs.plan.outputs.tag_oid }}
          RELEASE_MAIN_COMMIT: ${{ needs.plan.outputs.main_commit }}
        run: |
          set -euo pipefail
          tag_ref="refs/tags/${RELEASE_TAG}"
          validation_tag_ref="refs/release-validation/publish-validation/tag/${RELEASE_TAG}"
          validation_main_ref="refs/release-validation/publish-validation/main"
          validation_master_ref="refs/release-validation/publish-validation/master"
          git fetch --no-tags --force origin \
            "${tag_ref}:${validation_tag_ref}" \
            "refs/heads/main:${validation_main_ref}" \
            "refs/heads/master:${validation_master_ref}"
          remote_tag_oid="$(git rev-parse "${validation_tag_ref}")"
          remote_commit="$(git rev-parse "${validation_tag_ref}^{commit}")"
          remote_main="$(git rev-parse "${validation_main_ref}^{commit}")"
          remote_master="$(git rev-parse "${validation_master_ref}^{commit}")"
          head_commit="$(git rev-parse 'HEAD^{commit}')"
          if [ "$remote_tag_oid" != "$RELEASE_TAG_OID" ] \
            || [ "$head_commit" != "$RELEASE_COMMIT" ] \
            || [ "$remote_commit" != "$RELEASE_COMMIT" ] \
            || [ "$RELEASE_COMMIT" != "$RELEASE_MAIN_COMMIT" ] \
            || [ "$remote_main" != "$remote_master" ] \
            || ! git merge-base --is-ancestor "$RELEASE_MAIN_COMMIT" "$remote_main"; then
            echo "::error::Frozen release validation source changed"
            exit 1
          fi

      - name: Require canonical checkout before validation code executes
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain=v2 --untracked-files=all)" ] \
            || ! git diff --quiet HEAD -- \
            || ! git diff --cached --quiet HEAD -- \
            || [ -n "$(git ls-files -v | grep -v '^H ' || true)" ]; then
            echo "::error::Publish-validation checkout/index is not canonical"
            exit 1
          fi

      - name: Install system deps (xcb) [linux]
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # upstream commit verified 2026-08-04
        with:
          toolchain: nightly-2026-07-05

      - name: Verify exact root package identity matches tag
        id: package
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          package_fields="$(cargo metadata --no-deps --locked --format-version 1 \
            | python3 -c 'import json, pathlib, sys; data=json.load(sys.stdin); root=pathlib.Path("Cargo.toml").resolve(); matches=[p for p in data["packages"] if pathlib.Path(p["manifest_path"]) == root]; assert len(matches) == 1; print(matches[0]["name"], matches[0]["version"])')"
          read -r cargo_name cargo_version <<< "$package_fields"
          if [[ "$cargo_name" != "pi_agent_rust" || "$cargo_version" != "$RELEASE_VERSION" ]]; then
            echo "Package mismatch: root=${cargo_name}@${cargo_version}, expected=pi_agent_rust@${RELEASE_VERSION}"
            exit 1
          fi
          {
            echo "name=$cargo_name"
            echo "version=$cargo_version"
          } >> "$GITHUB_OUTPUT"
          echo "Package identity verified: ${cargo_name}@${cargo_version}"

      - name: Run release gate
        env:
          RELEASE_GATE_CARGO_RUNNER: local
          RELEASE_GATE_REQUIRE_DROPIN_CERTIFIED: "0"
          RELEASE_GATE_REQUIRE_PREFLIGHT: "1"
          RELEASE_GATE_REQUIRE_QUALITY: "1"
        run: |
          set -euo pipefail
          chmod +x scripts/release_gate.sh
          report_path="${RUNNER_TEMP}/pi-publish-release-gate-report.json"
          gate_exit=0
          ./scripts/release_gate.sh --no-rch --report | tee "$report_path" || gate_exit=$?
          verdict=$(python3 -c "import json, sys; print(json.load(open(sys.argv[1])).get('verdict','unknown'))" "$report_path")
          echo "Release gate verdict: $verdict"
          if [ "$gate_exit" -ne 0 ] || [ "$verdict" != "pass" ]; then
            echo "::error::Release gate failed (exit=$gate_exit, verdict=$verdict)"
            exit 1
          fi

      - name: Upload release gate report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: publish-release-gate-report
          path: ${{ runner.temp }}/pi-publish-release-gate-report.json
          if-no-files-found: error

      - name: Require canonical checkout after validation code executes
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain=v2 --untracked-files=all)" ] \
            || ! git diff --quiet HEAD -- \
            || ! git diff --cached --quiet HEAD -- \
            || [ -n "$(git ls-files -v | grep -v '^H ' || true)" ]; then
            echo "::error::Release-gate execution mutated the validation checkout/index"
            exit 1
          fi

      - name: Dry run and inspect exact source package
        env:
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          cargo publish --dry-run --locked
          crate_path="target/package/${PACKAGE_NAME}-${PACKAGE_VERSION}.crate"
          if [ ! -f "$crate_path" ] || [ -L "$crate_path" ] || [ ! -s "$crate_path" ]; then
            echo "::error::Publish dry run did not produce the expected regular .crate"
            exit 1
          fi
          CRATE_PATH="$crate_path" python3 - <<'PY'
          import hashlib
          import io
          import json
          import os
          import subprocess
          import tarfile
          import tomllib
          from pathlib import Path, PurePosixPath

          def strict_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise SystemExit(f"duplicate package metadata key: {key!r}")
                  result[key] = value
              return result

          def head_blob(path):
              entry = subprocess.run(
                  ["git", "ls-tree", "HEAD", "--", path], capture_output=True, text=True, check=True
              ).stdout.strip().split()
              if len(entry) < 4 or entry[0] not in {"100644", "100755"} or entry[1] != "blob":
                  raise SystemExit(f"packaged path is not a regular tracked HEAD blob: {path}")
              return subprocess.run(
                  ["git", "show", f"HEAD:{path}"], capture_output=True, check=True
              ).stdout

          crate_path = Path(os.environ["CRATE_PATH"])
          data = crate_path.read_bytes()
          if len(data) > 50 * 1024 * 1024:
              raise SystemExit("dry-run crate exceeds the 50 MiB validation cap")
          prefix = f"{os.environ['PACKAGE_NAME']}-{os.environ['PACKAGE_VERSION']}"
          saw_vcs = saw_original = saw_normalized = False
          with tarfile.open(fileobj=io.BytesIO(data), mode="r:gz") as archive:
              members = archive.getmembers()
              names = [member.name.rstrip("/") for member in members]
              if len(names) != len(set(names)):
                  raise SystemExit("dry-run crate contains duplicate paths")
              for member, name in zip(members, names, strict=True):
                  parts = name.split("/")
                  path = PurePosixPath(name)
                  if "\\" in name or name.startswith("/") or not parts or parts[0] != prefix \
                      or any(part in {"", ".", ".."} for part in parts):
                      raise SystemExit(f"unsafe dry-run crate path: {name!r}")
                  if member.isdir():
                      continue
                  if not member.isreg() or member.issym() or member.islnk():
                      raise SystemExit(f"non-regular dry-run crate entry: {name!r}")
                  extracted = archive.extractfile(member)
                  if extracted is None:
                      raise SystemExit(f"unreadable dry-run crate entry: {name!r}")
                  member_bytes = extracted.read()
                  relative = PurePosixPath(*path.parts[1:]).as_posix()
                  if relative == ".cargo_vcs_info.json":
                      vcs = json.loads(member_bytes, object_pairs_hook=strict_object)
                      if not isinstance(vcs, dict) \
                          or not set(vcs).issubset({"git", "path_in_vcs"}) \
                          or not isinstance(vcs.get("git"), dict) \
                          or set(vcs["git"]) not in ({"sha1"}, {"sha1", "dirty"}) \
                          or vcs["git"].get("sha1") != os.environ["RELEASE_COMMIT"] \
                          or vcs["git"].get("dirty", False) is not False:
                          raise SystemExit("dry-run crate VCS metadata differs from the frozen commit")
                      if "path_in_vcs" in vcs and vcs["path_in_vcs"] != "":
                          raise SystemExit("root package has unexpected path_in_vcs metadata")
                      saw_vcs = True
                  elif relative == "Cargo.toml.orig":
                      if member_bytes != head_blob("Cargo.toml"):
                          raise SystemExit("Cargo.toml.orig differs from frozen HEAD")
                      saw_original = True
                  elif relative == "Cargo.toml":
                      normalized = tomllib.loads(member_bytes.decode("utf-8"))
                      if normalized.get("package", {}).get("name") != os.environ["PACKAGE_NAME"] \
                          or normalized.get("package", {}).get("version") != os.environ["PACKAGE_VERSION"]:
                          raise SystemExit("normalized package identity differs")
                      saw_normalized = True
                  elif member_bytes != head_blob(relative):
                      raise SystemExit(f"packaged bytes differ from frozen HEAD: {relative}")
          if not (saw_vcs and saw_original and saw_normalized):
              raise SystemExit("dry-run crate is missing required Cargo/VCS metadata")
          print(f"Verified dry-run crate sha256={hashlib.sha256(data).hexdigest()} size={len(data)}")
          PY

      - name: Revalidate frozen source after dry run
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
          RELEASE_TAG_OID: ${{ needs.plan.outputs.tag_oid }}
          RELEASE_MAIN_COMMIT: ${{ needs.plan.outputs.main_commit }}
        run: |
          set -euo pipefail
          validation_tag_ref="refs/release-validation/final-publish-validation/tag/${RELEASE_TAG}"
          validation_main_ref="refs/release-validation/final-publish-validation/main"
          validation_master_ref="refs/release-validation/final-publish-validation/master"
          git fetch --no-tags --force origin \
            "refs/tags/${RELEASE_TAG}:${validation_tag_ref}" \
            "refs/heads/main:${validation_main_ref}" \
            "refs/heads/master:${validation_master_ref}"
          if [ "$(git cat-file -t "${validation_tag_ref}")" != "tag" ] \
            || [ "$(git rev-parse "${validation_tag_ref}")" != "$RELEASE_TAG_OID" ] \
            || [ "$(git rev-parse "${validation_tag_ref}^{commit}")" != "$RELEASE_COMMIT" ] \
            || [ "$(git rev-parse 'HEAD^{commit}')" != "$RELEASE_COMMIT" ] \
            || [ "$RELEASE_COMMIT" != "$RELEASE_MAIN_COMMIT" ] \
            || [ "$(git rev-parse "${validation_main_ref}^{commit}")" != "$(git rev-parse "${validation_master_ref}^{commit}")" ] \
            || ! git merge-base --is-ancestor "$RELEASE_MAIN_COMMIT" "$(git rev-parse "${validation_main_ref}^{commit}")"; then
            echo "::error::Frozen release source changed during publish validation"
            exit 1
          fi
          if [ -n "$(git status --porcelain=v2 --untracked-files=all)" ] \
            || ! git diff --quiet HEAD -- \
            || ! git diff --cached --quiet HEAD -- \
            || [ -n "$(git ls-files -v | grep -v '^H ' || true)" ]; then
            echo "::error::Publish validation mutated the canonical checkout/index"
            exit 1
          fi

      - name: Summary
        run: |
          {
            echo "## Crates.io package validation"
            echo ""
            echo "Validated pi_agent_rust v${{ needs.plan.outputs.version }} with cargo publish --dry-run."
            echo "This is a non-authoritative manual diagnostic: no registry mutation is performed."
            echo "Only release.yml's full frozen-SHA gate and ordered reconciliation may authorize publication."
          } >> "$GITHUB_STEP_SUMMARY"
