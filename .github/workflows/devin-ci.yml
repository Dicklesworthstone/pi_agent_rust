name: devin-ci

on:
  workflow_dispatch:
  push:
    branches:
      - devin-rust-core
      - "devin-*"
  pull_request:
    paths:
      - ".github/workflows/devin-ci.yml"
      - "src/agent.rs"
      - "src/devin/**"
      - "src/lib.rs"
      - "src/session.rs"
      - "tests/devin_*.rs"
      - "tests/fixtures/devin_cli/**"
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      VCR_MODE: "playback"
      RUST_BACKTRACE: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fd-find \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            ripgrep
          sudo ln -sf "$(command -v fdfind)" /usr/local/bin/fd

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4fd1da8b0805d2d2e936788875a7d65dbd677dc2 # nightly
        with:
          toolchain: nightly
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint default features
        run: cargo clippy --all-targets -- -D warnings

      - name: Test Devin contract, session policy, and process supervisor
        run: |
          cargo test --test devin_contract --test devin_session_state
          cargo test --test devin_process_supervisor
          cargo test devin::

      - name: Build release binary
        run: cargo build --release
